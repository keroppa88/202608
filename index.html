<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>相場データ</title>
<style>
  /* 配色は :root の変数だけで切り替える。全画面に波及する */
  :root {
    --bg:      #000000;
    --fg:      #33ff66;
    --fg2:     #33ff66;
    --line:    #33ff66;
    --panel:   #000000;
    --sel-bg:  #33ff66;
    --sel-fg:  #000000;
    --dim:     #1a7a33;
  }
  html[data-theme="light"] {
    --bg: #ffffff; --fg: #000000; --fg2: #000000; --line: #000000;
    --panel: #ffffff; --sel-bg: #000000; --sel-fg: #ffffff; --dim: #888888;
  }
  /* 以下3つは提案。夜 / 紙 / 熾火 */
  html[data-theme="midnight"] {
    --bg: #14181f; --fg: #d6dee8; --fg2: #7fb2ff; --line: #2c3644;
    --panel: #1a1f28; --sel-bg: #7fb2ff; --sel-fg: #14181f; --dim: #6b7787;
  }
  html[data-theme="paper"] {
    --bg: #f4efe4; --fg: #33302a; --fg2: #7a5c3e; --line: #cabfa9;
    --panel: #ece5d6; --sel-bg: #7a5c3e; --sel-fg: #f4efe4; --dim: #a1957f;
  }
  html[data-theme="ember"] {
    --bg: #1b1a17; --fg: #e6dac4; --fg2: #e0863a; --line: #3d3830;
    --panel: #221f1b; --sel-bg: #e0863a; --sel-fg: #1b1a17; --dim: #7c7263;
  }
  /* ここから5つ。琥珀端末 / 青画面 / 相場端末 / 深緑 / 桜 */
  html[data-theme="amber"] {
    --bg: #000000; --fg: #ffb000; --fg2: #ffb000; --line: #ffb000;
    --panel: #000000; --sel-bg: #ffb000; --sel-fg: #000000; --dim: #7a5400;
  }
  html[data-theme="blue"] {
    --bg: #000080; --fg: #ffffff; --fg2: #ffe066; --line: #5566cc;
    --panel: #0000a8; --sel-bg: #ffffff; --sel-fg: #000080; --dim: #9aa4e0;
  }
  html[data-theme="desk"] {
    --bg: #0a0a0a; --fg: #ededed; --fg2: #ff9d2f; --line: #333333;
    --panel: #161616; --sel-bg: #ff9d2f; --sel-fg: #0a0a0a; --dim: #767676;
  }
  html[data-theme="deep"] {
    --bg: #002b36; --fg: #94a5a5; --fg2: #b58900; --line: #0b3f4c;
    --panel: #073642; --sel-bg: #b58900; --sel-fg: #002b36; --dim: #587680;
  }
  html[data-theme="sakura"] {
    --bg: #fbf0f2; --fg: #3a2b30; --fg2: #b3506b; --line: #e2c4cc;
    --panel: #f4e2e6; --sel-bg: #b3506b; --sel-fg: #fbf0f2; --dim: #a4868e;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "MS Gothic", "Osaka-Mono", "Courier New", monospace;
    font-size: 14px;
  }
  .hidden { display: none !important; }

  /* ---- タイトル画面 ---- */
  #title {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
  }
  #title h1 { font-size: 22px; letter-spacing: .4em; margin: 0 0 8px; font-weight: normal; }
  #title .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .menu { display: flex; flex-direction: column; gap: 14px; }
  .menu button {
    width: 320px; padding: 18px 0;
    background: var(--panel); color: var(--fg);
    border: 2px solid var(--line);
    font: inherit; font-size: 18px; letter-spacing: .3em;
    cursor: pointer;
  }
  .menu button[aria-selected="true"] { background: var(--sel-bg); color: var(--sel-fg); }
  .menu button:disabled { color: var(--dim); border-color: var(--dim); cursor: default; }
  .menu button[aria-selected="true"]:disabled { background: var(--dim); color: var(--bg); }
  #title .hint { color: var(--dim); font-size: 12px; }

  /* ---- 表画面 ---- */
  #sheet { height: 100%; display: flex; flex-direction: column; }
  .bar {
    display: flex; align-items: stretch;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  .bar > * { border-right: 1px solid var(--line); }
  .bar button, .bar select {
    background: var(--panel); color: var(--fg);
    border: 0; font: inherit; padding: 6px 14px; cursor: pointer;
  }
  .bar select { padding-right: 8px; }
  .bar .spacer { flex: 1; border-right: 0; }
  .bar .note { padding: 6px 14px; color: var(--dim); border-right: 0; }

  .grid { flex: 1; overflow: auto; }

  /* スクロールの棒。配色に合わせて自分で描く。
     Firefox はこの2行だけ効く */
  .grid { scrollbar-color: var(--fg) var(--bg); scrollbar-width: thin; }
  .grid::-webkit-scrollbar { width: 13px; height: 13px; }
  .grid::-webkit-scrollbar-track {
    background: var(--bg);
    border-left: 1px solid var(--line);
    border-top: 1px solid var(--line);
  }
  .grid::-webkit-scrollbar-thumb {
    background: var(--fg);
    border: 3px solid var(--bg);   /* 内側を空けて細く見せる */
  }
  .grid::-webkit-scrollbar-thumb:hover { background: var(--fg2); }
  .grid::-webkit-scrollbar-corner { background: var(--bg); }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed; }
  th, td {
    border: 1px solid var(--line);
    padding: 3px 10px;
    white-space: nowrap;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 見出しの右端を掴むと幅を変えられる */
  .grip {
    position: absolute; top: 0; right: -3px; width: 7px; height: 100%;
    cursor: col-resize; user-select: none;
  }
  .grip:hover { background: var(--fg2); opacity: .5; }
  /* sticky は位置指定なので、取っ手はこの中に絶対配置できる */
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--panel); color: var(--fg2);
    text-align: center;
  }
  thead th.corner { left: 0; z-index: 3; }
  tbody th {
    position: sticky; left: 0; z-index: 1;
    background: var(--panel); color: var(--fg2);
    text-align: left; font-weight: normal;
  }
  td.na { color: var(--dim); }
  /* 見出しは幅を狭めると2行3行に折り返す */
  thead th { white-space: normal; }
  /* 名前が横幅を丸ごと使う。× と ▼ はマス目の下辺に貼り付ける。
     横は詰まっているので操作の記号に幅を割かない。
     名前の長さで位置がずれないよう、全列そろえて一番下に置く */
  /* セルの中身を下へ寄せる。行の高さは一番背の高い見出しで決まるので、
     これだけで全列の × ▼ が下辺にそろう */
  thead th { vertical-align: bottom; }
  .colhead { display: block; }
  .colhead .name {
    font-size: 12px; line-height: 1.25;
    word-break: break-all;      /* 銘柄名は途中でも折る */
    text-align: center;
    cursor: pointer;            /* 押すとチャート */
  }
  .colhead .ops {
    display: flex; justify-content: center; gap: 6px;
    line-height: 1; margin-top: 2px;
    flex: none;
  }
  /* 四本値のとき、× ▼ は4列のうち左端だけに出す。
     残りの3列は同じ高さの空きを置いて、下辺の位置をそろえる */
  .colhead .ops.blank { visibility: hidden; }
  .colhead .field { font-size: 12px; line-height: 1.25; text-align: center; }
  .colhead .ops button {
    background: none; border: 0; color: var(--dim);
    font: inherit; font-size: 11px; cursor: pointer; padding: 0 2px;
    position: relative; z-index: 3;
  }
  /* ▼ の上に重ねた選択。押すと候補が開く。見た目には出さない */
  .pickwrap { position: relative; display: block; }
  .picker {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
    font: inherit; z-index: 4;
  }
  .grip { z-index: 5; }

  /* ---- チャート画面 ---- */
  #charts { height: 100%; display: flex; flex-direction: column; }
  /* 銘柄の選択欄。既定5・最大10 */
  .picks {
    display: flex; flex-wrap: wrap; gap: 6px 10px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  .picks .one {
    display: inline-flex; align-items: center; gap: 3px;
    border: 1px solid var(--line); padding: 1px 4px;
    position: relative;
  }
  .picks .one .nm { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picks .one button {
    background: none; border: 0; color: var(--dim);
    font: inherit; font-size: 11px; cursor: pointer; padding: 0 1px;
  }
  .picks .one select {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; font: inherit;
  }
  .picks .add {
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); font: inherit; cursor: pointer; padding: 1px 8px;
  }
  .canvas {
    flex: 1; overflow: auto;
    padding: 10px;
    scrollbar-color: var(--fg) var(--bg); scrollbar-width: thin;
  }
  .canvas::-webkit-scrollbar { width: 13px; height: 13px; }
  .canvas::-webkit-scrollbar-track { background: var(--bg); border-left: 1px solid var(--line); }
  .canvas::-webkit-scrollbar-thumb { background: var(--fg); border: 3px solid var(--bg); }
  .canvas::-webkit-scrollbar-corner { background: var(--bg); }
  .canvas .one-chart { margin-bottom: 14px; }
  .canvas .cap { margin-bottom: 3px; }
  .canvas svg { display: block; }
  .canvas .axis { stroke: var(--line); fill: none; }
  .canvas .vline, .canvas .hline { stroke: var(--dim); stroke-width: .5; }
  .canvas .lab { fill: var(--fg); font-size: 14px; font-weight: bold; }
  .canvas .plot { fill: none; stroke-width: 1.2; }

  /* ---- チャート（ポップアップ） ---- */
  #chart {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, .55);
    display: flex; align-items: center; justify-content: center;
  }
  /* 枠の幅は SVG に合わせて決め打ちする。
     見出しが長くても横に伸ばさない。伸ばすと縦横比（1:1.62）が崩れる */
  #chart .box {
    background: var(--bg); color: var(--fg);
    border: 2px solid var(--line);
    padding: 8px 8px 6px;
  }
  /* チャートの中の字は全部おなじ。表の数字と同じ書体・大きさで、太字 */
  #chart .box, #chart text {
    font-family: "MS Gothic", "Osaka-Mono", "Courier New", monospace;
    font-size: 14px;
    font-weight: bold;
  }
  #chart .head {
    display: flex; justify-content: space-between; gap: 8px 20px;
    flex-wrap: wrap;                 /* 入らなければ行を変える */
    margin-bottom: 4px;
  }
  #chart .head .sub { color: var(--fg); }
  #chart svg { display: block; }
  #chart .axis { stroke: var(--line); fill: none; }
  #chart .vline { stroke: var(--dim); stroke-width: .5; }
  #chart .hline { stroke: var(--dim); stroke-width: .5; }
  #chart .lab { fill: var(--fg); }
  #chart .plot { stroke: var(--fg); fill: none; stroke-width: 1.2; }
  /* ローソク足。上げた日は枠だけ、下げた日は塗りつぶし */
  #chart .cs { stroke: var(--fg); fill: none; stroke-width: 1; }
  #chart .cs.dn { fill: var(--fg); }
  #chart .ma { stroke: var(--fg); fill: none; stroke-width: 1; opacity: .75; }
  #chart .head .left {
    display: flex; align-items: center; gap: 8px 16px;
    flex-wrap: wrap; min-width: 0;
  }
  #chart .head .name { word-break: break-all; }
  #chart .ma-pick { display: flex; gap: 12px; color: var(--fg); flex: none; }
  #chart .ma-pick label {
    cursor: pointer; user-select: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  #chart .ma-pick input { position: absolute; opacity: 0; width: 0; height: 0; }
  #chart .ma-pick .bx {
    display: inline-block; width: 12px; height: 12px;
    border: 1px solid var(--fg);
    background: var(--bg);
  }
  #chart .ma-pick input:checked + .bx { background: var(--fg); }
  .addcol {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    font: inherit; cursor: pointer; padding: 2px 10px;
  }
  #loading { padding: 20px; color: var(--dim); }

  /* ---- 擬似スクリーンセーバー。画面の上を虫が動くだけ ---- */
  /* 白っぽい地に色の折れ線は飛んで見えにくい。相対チャートだけ太くする */
  html[data-theme="light"] .canvas .plot.rel,
  html[data-theme="paper"] .canvas .plot.rel,
  html[data-theme="sakura"] .canvas .plot.rel { stroke-width: 2; }

  #saver {
    position: fixed; inset: 0; z-index: 90;
    pointer-events: none;               /* 板は素通し。下の操作を邪魔しない */
    overflow: hidden;
  }
  #saver svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #saver .bug {
    fill: none; stroke: var(--fg); stroke-width: 1.3;
    stroke-linecap: round; stroke-linejoin: round;
  }
  /* 体は塗りつぶし。境目は背景色の線で分ける */
  #saver .body { fill: var(--fg); stroke: var(--bg); stroke-width: 1.2; }
  #saver .seam { stroke: var(--bg); }
  #saver .seg { stroke-width: .8; }         /* ムカデの節。切れ目は細く */
</style>
</head>
<body>

<!-- ===================== タイトル画面 ===================== -->
<section id="title">
  <h1>相 場 デ ー タ</h1>
  <div class="sub">1999 - 2026</div>
  <div class="menu" id="titleMenu">
    <button data-go="sheet" aria-selected="true">表</button>
    <button data-go="chart">チャート</button>
  </div>
  <div class="hint">↑ ↓ で選択　Enter で決定</div>
</section>

<!-- ===================== 表画面 ===================== -->
<section id="sheet" class="hidden">
  <div class="bar">
    <button id="mode" title="押すと終値と四本値が入れ替わる">終値</button>
    <button id="back" title="タイトルへ戻る">← 戻る</button>
    <select id="year" title="表示する年"></select>
    <button id="theme" title="押すたびに配色が変わる">Color</button>
    <div class="spacer"></div>
    <div class="note" id="status"></div>
  </div>
  <div class="grid" id="grid"><div id="loading">読み込み中…</div></div>
</section>

<!-- ===================== チャート画面 ===================== -->
<section id="charts" class="hidden">
  <div class="bar">
    <button id="ctype" title="押すと相対と絶対が入れ替わる">相対</button>
    <button id="cback" title="タイトルへ戻る">← 戻る</button>
    <select id="cyear" title="表示する年"></select>
    <button id="ctheme" title="押すたびに配色が変わる">Color</button>
    <div class="spacer"></div>
    <div class="note" id="cstatus"></div>
  </div>
  <div class="picks" id="cpicks"></div>
  <div class="canvas" id="ccanvas"></div>
</section>

<!-- ===================== チャート（ポップアップ） ===================== -->
<div id="chart" class="hidden"></div>

<!-- ===================== 擬似スクリーンセーバー ===================== -->
<div id="saver" class="hidden" aria-hidden="true"></div>

<script>
"use strict";

/* ---------------------------------------------------------------
   保存する設定。銘柄の並びと配色はブラウザに覚えさせる
--------------------------------------------------------------- */
const STORE = "soba.v2";
const DEFAULT_COLUMNS = [
  "yahoo:^N225",          // 日経平均株価
  "jpx:TOPIX",
  "nikkei:日経半導体株指数",
  "yahoo:^DJI",           // NYダウ
  "yahoo:^GSPC",          // S&P500
  "yahoo:^IXIC",          // ナスダック総合
  "yahoo:^SOX"            // SOX
];
// チャート画面の既定。5銘柄。＋で最大10まで
const MAX_SERIES = 10;
const DEFAULT_CHART_COLUMNS = [
  "yahoo:^N225",          // 日経平均株価
  "jpx:TOPIX",
  "yahoo:^DJI",           // NYダウ
  "yahoo:^GSPC",          // S&P500
  "yahoo:^SOX"            // SOX
];
// 表の四本値の既定。1銘柄で4列使う
const DEFAULT_OHLC_COLUMNS = DEFAULT_CHART_COLUMNS.slice();
const OHLC_FIELDS = [
  { f: "open", label: "始値" },
  { f: "high", label: "高値" },
  { f: "low", label: "安値" },
  { f: "close", label: "終値" }
];

// 呼び名を変えた銘柄。前に覚えた並びもここで読み替える
const RENAMED = { "jpx:TOPIX (東証株価指数)": "jpx:TOPIX" };

function fixKeys(list, fallback) {
  if (!Array.isArray(list) || !list.length) return fallback.slice();
  return list.map((k) => RENAMED[k] || k);
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "{}");
    return {
      theme: s.theme || "retro",
      year: s.year || 2026,
      columns: fixKeys(s.columns, DEFAULT_COLUMNS),
      widths: (s.widths && typeof s.widths === "object") ? s.widths : {},
      ma: (s.ma && typeof s.ma === "object") ? s.ma : { 20: false, 80: false, 200: false },
      chartType: s.chartType === "abs" ? "abs" : "rel",
      chartYear: s.chartYear || 2026,
      chartColumns: fixKeys(s.chartColumns, DEFAULT_CHART_COLUMNS).slice(0, MAX_SERIES),
      bugIndex: Number(s.bugIndex) || 0,
      chartZoom: Number(s.chartZoom) > 0 ? Number(s.chartZoom) : 1,
      sheetMode: s.sheetMode === "ohlc" ? "ohlc" : "close",
      ohlcColumns: fixKeys(s.ohlcColumns, DEFAULT_OHLC_COLUMNS)
    };
  } catch (e) {
    return {
      theme: "retro", year: 2026, columns: DEFAULT_COLUMNS.slice(), widths: {},
      ma: { 20: false, 80: false, 200: false },
      chartType: "rel", chartYear: 2026, chartColumns: DEFAULT_CHART_COLUMNS.slice(),
      bugIndex: 0, chartZoom: 1,
      sheetMode: "close", ohlcColumns: DEFAULT_OHLC_COLUMNS.slice()
    };
  }
}
function saveSettings() {
  localStorage.setItem(STORE, JSON.stringify(settings));
}
let settings = loadSettings();

// 押すたびにこの順で回る。先頭が既定
const THEMES = ["retro", "light", "midnight", "paper", "ember",
                "amber", "blue", "desk", "deep", "sakura"];

function applyTheme(name) {
  if (!THEMES.includes(name)) name = THEMES[0];
  document.documentElement.dataset.theme = name;
  settings.theme = name;
  saveSettings();
}
function nextTheme() {
  const i = THEMES.indexOf(settings.theme);
  applyTheme(THEMES[(i + 1) % THEMES.length]);
}
applyTheme(settings.theme);

/* ---------------------------------------------------------------
   タイトル画面。↑↓ で選び Enter で決める
--------------------------------------------------------------- */
const titleEl = document.getElementById("title");
const sheetEl = document.getElementById("sheet");
const items = [...document.querySelectorAll("#titleMenu button")];
let cursor = 0;

function drawCursor() {
  items.forEach((b, i) => b.setAttribute("aria-selected", String(i === cursor)));
}
function decide() {
  const b = items[cursor];
  if (b.disabled) return;
  if (b.dataset.go === "sheet") openSheet();
  if (b.dataset.go === "chart") openCharts();
}
// 表を矢印で動かす幅。1回押すとこれだけ寄る
const STEP_X = 120;   // 列1つぶんくらい
const STEP_Y = 60;    // 行3つぶんくらい

document.addEventListener("keydown", (e) => {
  if (!titleEl.classList.contains("hidden")) {
    // タイトル画面。↑↓ で選び Enter で決める
    if (e.key === "ArrowDown") { cursor = (cursor + 1) % items.length; drawCursor(); e.preventDefault(); }
    if (e.key === "ArrowUp")   { cursor = (cursor - 1 + items.length) % items.length; drawCursor(); e.preventDefault(); }
    if (e.key === "Enter")     { decide(); e.preventDefault(); }
    return;
  }

  // チャート画面。Esc で戻り、矢印で上下左右へ寄せる
  if (!chartsEl.classList.contains("hidden")) {
    if (e.key === "Escape") { backFromCharts(); return; }
    const m = {
      ArrowLeft:  [-STEP_X, 0],
      ArrowRight: [STEP_X, 0],
      ArrowUp:    [0, -STEP_Y],
      ArrowDown:  [0, STEP_Y],
      PageUp:     [0, -canvasEl.clientHeight],
      PageDown:   [0, canvasEl.clientHeight]
    }[e.key];
    if (!m) return;
    canvasEl.scrollBy(m[0], m[1]);
    e.preventDefault();
    return;
  }

  if (e.key === "Escape") {
    if (!chartEl.classList.contains("hidden")) closeChart();
    else backToTitle();
    return;
  }

  // チャートを出している間は表を動かさない
  if (!chartEl.classList.contains("hidden")) return;

  // 表画面。矢印で上下左右へ寄せる
  const move = {
    ArrowLeft:  [-STEP_X, 0],
    ArrowRight: [STEP_X, 0],
    ArrowUp:    [0, -STEP_Y],
    ArrowDown:  [0, STEP_Y],
    PageUp:     [0, -gridEl.clientHeight],
    PageDown:   [0, gridEl.clientHeight],
    Home:       [-gridEl.scrollWidth, 0],
    End:        [gridEl.scrollWidth, 0]
  }[e.key];
  if (!move) return;

  gridEl.scrollBy(move[0], move[1]);
  e.preventDefault();          // 画面ごと動くのを止める
});
items.forEach((b, i) => {
  b.addEventListener("mouseenter", () => { cursor = i; drawCursor(); });

/* ---------------------------------------------------------------
   データの読み込み。CSVはそのまま置いてあるものを読む

     yahoo:{シンボル}  data/overseas_{年}.csv
     jpx:{指数名}      data/jpx_index.csv
     nikkei:{指数名}   data/nikkei_ohlc.csv

   どれも終値を出す。無い日は #N/A
--------------------------------------------------------------- */
const cache = new Map();

async function fetchCsv(path) {
  if (cache.has(path)) return cache.get(path);
  const p = fetch(path).then(async (r) => {
    if (!r.ok) return [];
    return parseCsv(await r.text());
  }).catch(() => []);
  cache.set(path, p);
  return p;
}

function parseCsv(text) {
  const lines = text.split("\n").filter((l) => l.length);
  if (!lines.length) return [];
  const head = splitLine(lines[0]);
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = splitLine(lines[i]);
    const row = {};
    head.forEach((h, j) => { row[h] = cells[j] === undefined ? "" : cells[j]; });
    out.push(row);
  }
  return out;
}

// 引用符つきのカンマ区切りを分ける
function splitLine(line) {
  const out = [];
  let cur = "", quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quoted) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; } else { quoted = false; }
      } else cur += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { out.push(cur); cur = ""; }
    else if (c !== "\r") cur += c;
  }
  out.push(cur);
  return out;
}

// 候補はこの順で並べる
const GROUPS = ["日本株指数", "米国株指数", "海外その他", "為替", "日本個別株", "海外個別株"];

// 米国の株価指数。ここに無い海外指数は「海外その他」へ入れる
const US_INDEX = new Set(["^DJI", "^IXIC", "^NDX", "^GSPC", "^RUT", "^SOX", "^VIX"]);

// symbols.csv の分類 → 画面での分野
function groupOf(category, symbol) {
  if (category === "日本指数" || category === "先物") return "日本株指数";
  if (category === "日本株") return "日本個別株";
  if (category === "個別株") return "海外個別株";
  if (category === "為替") return "為替";
  if (category === "セクター" || category === "REIT" || category === "ボラティリティ") return "米国株指数";
  if (category === "海外指数") return US_INDEX.has(symbol) ? "米国株指数" : "海外その他";
  return "海外その他";           // 商品・金利・通貨指数・暗号資産・ETF
}

// 米国株指数の中の並び。主要なものを先に、残りはサブ指数として後ろへ
const US_MAIN = ["^DJI", "^GSPC", "^IXIC", "^NDX", "^RUT", "^SOX"];

// 日本株指数の中の並び。名前がそのまま一致するものを先頭に置く
const JP_MAIN = [
  "TOPIX",
  "日経平均株価",
  "日経半導体株指数",
  "日経平均ボラティリティー・インデックス",
  "日経平均内需株50指数",
  "日経平均外需株50指数"
];

// 東証33業種
const GYOSHU = new Set([
  "水産・農林業", "鉱業", "建設業", "食料品", "繊維製品", "パルプ・紙", "化学",
  "医薬品", "石油・石炭製品", "ゴム製品", "ガラス・土石製品", "鉄鋼", "非鉄金属",
  "金属製品", "機械", "電気機器", "輸送用機器", "精密機器", "その他製品",
  "電気・ガス業", "陸運業", "海運業", "空運業", "倉庫・運輸関連業", "情報・通信業",
  "卸売業", "小売業", "銀行業", "証券、商品先物取引業", "保険業", "その他金融業",
  "不動産業", "サービス業"
]);

// 分野の中の並び
//   日本株指数 … TOPIX → 日経平均 → 日経半導体 → 日経VI → 内需50 → 外需50 →
//                 日経のほか → TOPIX系 → 業種別 → 残り
//   米国株指数 … NYダウ → S&P500 → ナスダック → ラッセル → SOX → サブ指数
function subRank(c) {
  if (c.group === "日本株指数") {
    const j = JP_MAIN.indexOf(c.label);
    if (j >= 0) return j;
    if (c.label.startsWith("日経")) return 10;      // 日経のほか
    if (c.label.includes("TOPIX")) return 11;       // TOPIX系
    if (GYOSHU.has(c.label)) return 12;             // 業種別
    return 13;                                       // REIT・市場区分・規模別など
  }
  if (c.group === "米国株指数") {
    const i = US_MAIN.indexOf(c.sym);
    return i < 0 ? 99 : i;
  }
  return 0;
}

// 同じ指数が2か所から入っているもの。候補には出さない
//   日経平均は Yahoo（^N225）で1985年から揃っているので、そちらに寄せる
const HIDDEN = new Set(["nikkei:日経平均株価"]);

// 選べる銘柄の一覧を作る（その年に値がある銘柄）
// 四本値が4つとも入っているか
function hasOhlc(r) {
  return OHLC_FIELDS.every((x) => (r[x.f] || "").trim() !== "");
}

async function buildCatalog(year) {
  const cat = [];
  const seen = new Set(HIDDEN);

  // 銘柄名だけを出す。コードを添えるのは個別株だけ。
  // 指数や商品にコードを出しても読む側には意味がない
  const WITH_CODE = new Set(["個別株", "日本株"]);

  // その年の一番新しい日に四本値が揃っているかを見ておく。
  // 揃っているものだけが四本値の表に出せる
  const last = new Map();
  const note = (key, r) => {
    const cur = last.get(key);
    if (!cur || r.trade_date > cur.date) last.set(key, { date: r.trade_date, ohlc: hasOhlc(r) });
  };

  for (const r of await fetchCsv(`data/overseas_${year}.csv`)) {
    const key = "yahoo:" + r.symbol;
    note(key, r);
    if (!seen.has(key)) {
      seen.add(key);
      const code = WITH_CODE.has(r.category) ? `（${r.symbol}）` : "";
      cat.push({ key, label: r.name + code, group: groupOf(r.category, r.symbol), sym: r.symbol });
    }
  }
  for (const r of await fetchCsv("data/jpx_index.csv")) {
    const key = "jpx:" + r.name;
    if (r.trade_date.startsWith(year)) note(key, r);
    if (!seen.has(key)) { seen.add(key); cat.push({ key, label: r.name, group: "日本株指数" }); }
  }
  for (const r of await fetchCsv("data/nikkei_ohlc.csv")) {
    const key = "nikkei:" + r.name;
    if (r.trade_date.startsWith(year)) note(key, r);
    if (!seen.has(key)) { seen.add(key); cat.push({ key, label: r.name, group: "日本株指数" }); }
  }
  cat.forEach((c) => { c.ohlc = !!(last.get(c.key) || {}).ohlc; });
  // 分野の順、分野の中は名前順
  cat.sort((a, b) =>
    GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group) ||
    subRank(a) - subRank(b) ||
    a.label.localeCompare(b.label, "ja")
  );
  return cat;
}

// 1銘柄ぶんの「日付 → 終値」を返す
async function seriesOf(key, year) {
  const [src, id] = splitKey(key);
  const map = new Map();
  if (src === "yahoo") {
    for (const r of await fetchCsv(`data/overseas_${year}.csv`)) {
      if (r.symbol === id && r.close !== "") map.set(r.trade_date, r.close);
    }
  } else if (src === "jpx") {
    for (const r of await fetchCsv("data/jpx_index.csv")) {
      if (r.name === id && r.close !== "" && r.trade_date.startsWith(year)) {
        map.set(r.trade_date, r.close);
      }
    }
  } else if (src === "nikkei") {
    for (const r of await fetchCsv("data/nikkei_ohlc.csv")) {
      if (r.name === id && r.close !== "" && r.trade_date.startsWith(year)) {
        map.set(r.trade_date, r.close);
      }
    }
  }
  return map;
}

// 1銘柄ぶんの「日付 → 四本値」を返す。4つとも揃っている日だけ
async function barsOf(key, year) {
  const [src, id] = splitKey(key);
  const map = new Map();
  const take = (rows, hit) => {
    for (const r of rows) {
      if (!hit(r) || !hasOhlc(r)) continue;
      map.set(r.trade_date, {
        open: r.open, high: r.high, low: r.low, close: r.close
      });
    }
  };
  if (src === "yahoo") {
    take(await fetchCsv(`data/overseas_${year}.csv`), (r) => r.symbol === id);
  } else if (src === "jpx") {
    take(await fetchCsv("data/jpx_index.csv"), (r) => r.name === id && r.trade_date.startsWith(year));
  } else if (src === "nikkei") {
    take(await fetchCsv("data/nikkei_ohlc.csv"), (r) => r.name === id && r.trade_date.startsWith(year));
  }
  return map;
}

function splitKey(key) {
  const i = key.indexOf(":");
  return [key.slice(0, i), key.slice(i + 1)];
}

function labelOf(key, catalog) {
  const hit = catalog.find((c) => c.key === key);
  if (hit) return hit.label;
  return splitKey(key)[1];       // その年に無い銘柄は素の名前を出す
}

/* ---------------------------------------------------------------
   列の幅。見出しの右端を掴んで動かす。幅は覚えさせる
--------------------------------------------------------------- */
const DATE_COL = "__date__";
const DEFAULT_W = { [DATE_COL]: 110, __plus__: 44 };

// 四本値の列幅は終値の表とは別に覚える。1銘柄4列ぶんが同じ幅で動く
const OHLC_W = 92;
const ohlcWidthKey = (key) => "ohlc|" + key;

function widthOf(key) {
  return settings.widths[key] || DEFAULT_W[key] ||
    (key.startsWith("ohlc|") ? OHLC_W : 130);
}

// col は1本でも、まとめて動かす複数本でもよい
function makeGrip(key, col) {
  const grip = document.createElement("div");
  grip.className = "grip";
  grip.title = "掴んで幅を変える";
  const cols = Array.isArray(col) ? col : [col];
  grip.addEventListener("mousedown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    const x0 = e.clientX;
    const w0 = parseInt(cols[0].style.width, 10) || widthOf(key);
    const move = (ev) => {
      const w = Math.max(50, w0 + (ev.clientX - x0));
      cols.forEach((c) => { c.style.width = w + "px"; });
      settings.widths[key] = w;
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      saveSettings();
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  // 取っ手を二度押しすると既定の幅へ戻す
  grip.addEventListener("dblclick", (e) => {
    e.stopPropagation();
    delete settings.widths[key];
    cols.forEach((c) => { c.style.width = widthOf(key) + "px"; });
    saveSettings();
  });
  return grip;
}

function fmt(v) {
  const n = Number(v);
  if (!isFinite(n)) return v;
  return n.toLocaleString("ja-JP", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// チャートの目盛。3桁区切りは出さない。小数も出さない。
// ただし目盛の幅が1未満のとき（金利や為替）は、整数にすると同じ数字が
// 並んでしまうので、その幅に必要なぶんだけ小数を残す
function fmtAxis(v, step) {
  const n = Number(v);
  if (!isFinite(n)) return v;
  if (!(step < 1)) return String(Math.round(n));
  const d = Math.max(0, Math.ceil(-Math.log10(step)));
  return n.toFixed(d);
}

/* ---------------------------------------------------------------
   チャート。いま表に出ている分をそのまま折れ線にする

   配色は表と同じものを使う（--bg / --fg / --line / --dim）。
   横軸の目盛は1か月ごと。線は日足。
--------------------------------------------------------------- */
const chartEl = document.getElementById("chart");

// 目盛の幅。R÷6 にいちばん近い「きりのいい数」を選ぶ
//   きりのいい数 … 1 / 2 / 2.5 / 5 の 10のべき乗倍。同点なら小さい方
//   R=1000→200  3000→500  4000→500  5000→1000  8000→1000  10000→2000
function niceStep(range) {
  const t = range / 6;
  const k = Math.floor(Math.log10(t));
  let best = null;
  for (const e of [k - 1, k, k + 1]) {
    for (const m of [1, 2, 2.5, 5]) {
      const step = m * Math.pow(10, e);
      if (step <= 0) continue;
      const d = Math.abs(step - t);
      if (!best || d < best.d - 1e-12 || (Math.abs(d - best.d) < 1e-12 && step < best.step)) {
        best = { d, step };
      }
    }
  }
  return best.step;
}

// 目盛の幅と上下端を決める。線は4〜10本に収める
function scaleOf(lo, hi) {
  let step = niceStep(hi - lo || Math.abs(hi) || 1);
  for (let n = 0; n < 8; n++) {
    const bottom = Math.floor(lo / step) * step;
    const top = Math.ceil(hi / step) * step;
    const lines = Math.round((top - bottom) / step) + 1;
    if (lines < 4) { step /= 2; continue; }      // 少なすぎたら細かく
    if (lines > 10) { step *= 2; continue; }     // 多すぎたら粗く
    return { step, bottom, top, lines };
  }
  const bottom = Math.floor(lo / step) * step;
  const top = Math.ceil(hi / step) * step;
  return { step, bottom, top, lines: Math.round((top - bottom) / step) + 1 };
}

// 移動平均。押した分だけ点線で重ねる。線の形で見分ける
const MA_LINES = [
  { n: 20,  dash: "5 3" },
  { n: 80,  dash: "10 4" },
  { n: 200, dash: "2 4" }
];

// 移動平均を出す。前年ぶんも入れた並びで計算し、表に出ている分だけ返す
function movingAverage(all, from, n) {
  const out = new Map();
  let sum = 0;
  for (let i = 0; i < all.length; i++) {
    sum += all[i].v;
    if (i >= n) sum -= all[i - n].v;
    if (i >= n - 1 && all[i].d >= from) out.set(all[i].d, sum / n);
  }
  return out;
}

// いま開いているチャートの中身。押し直しで描き直すために持っておく
let chartState = null;

async function openChart(title, key, map, bars) {
  const days = [...map.keys()].sort();
  if (!days.length) return;

  // 移動平均は前年から続いていないと年初が出ない。前の年も読む
  const prev = await seriesOf(key, String(settings.year - 1));
  const all = [];
  [...prev.keys()].sort().forEach((d) => all.push({ d, v: Number(prev.get(d)) }));
  days.forEach((d) => all.push({ d, v: Number(map.get(d)) }));

  chartState = { title, days, map, all, bars: bars || null };
  drawChart();
  chartEl.classList.remove("hidden");
}

function drawChart() {
  const { title, days, map, all, bars } = chartState;


  // 押されている移動平均を出す
  const shown = MA_LINES.filter((m) => settings.ma[m.n]).map((m) => ({
    ...m, line: movingAverage(all, days[0], m.n)
  }));

  // 上下の幅は、押しているかに関わらず 200MA を入れて決める。
  // 押すたびに縮尺が動くと、線の傾きが目で比べられなくなる。
  // 目盛の桁数が左の余白を決めるので、大きさより先に出す
  const vals = days.map((d) => Number(map.get(d)));
  if (bars) bars.forEach((b) => { vals.push(Number(b.high), Number(b.low)); });
  movingAverage(all, days[0], 200).forEach((v) => vals.push(v));
  const sc = scaleOf(Math.min(...vals), Math.max(...vals));

  // 縦横 1 : 1.62 にするのは**描画部分**（枠の内側）。
  // 目盛の文字を置く余白は、その外側に必要なぶんだけ足す
  const RATIO = 1.62;

  // 左の余白は目盛の桁数で決める。等幅なので 1文字 ≒ 8.4px
  const widest = Math.max(...[sc.bottom, sc.top].map((v) => fmtAxis(v, sc.step).length));
  const L = Math.ceil(widest * 8.4) + 10;
  const R = 6, T = 8, B = 24;

  let ih = Math.round(gridEl.clientHeight / 2) - T - B;  // 描画部分の高さ
  ih = Math.round(Math.max(160, ih) * settings.chartZoom);   // ホイールで伸び縮み
  let iw = Math.round(ih * RATIO);                       // 描画部分の幅

  // 画面からはみ出す分は詰める。縦横の比は変えない
  const maxIH = window.innerHeight - 90 - T - B;
  const maxIW = window.innerWidth - 60 - L - R;
  if (ih > maxIH) { ih = maxIH; iw = Math.round(ih * RATIO); }
  if (iw > maxIW) { iw = maxIW; ih = Math.round(iw / RATIO); }
  if (ih < 100) { ih = 100; iw = Math.round(ih * RATIO); }

  const W = iw + L + R, H = ih + T + B;

  const x = (i) => L + (days.length === 1 ? iw / 2 : (iw * i) / (days.length - 1));
  const y = (v) => T + ih - (ih * (v - sc.bottom)) / (sc.top - sc.bottom);

  const parts = [];

  // 月ごとの細い縦線
  let prevMonth = "";
  days.forEach((d, i) => {
    const m = d.slice(0, 7);
    if (m === prevMonth) return;
    prevMonth = m;
    const px = x(i);
    parts.push(`<line x1="${px}" y1="${T}" x2="${px}" y2="${T + ih}" class="vline"/>`);
    parts.push(`<text x="${px}" y="${T + ih + 18}" class="lab" text-anchor="middle">${Number(d.slice(5, 7))}</text>`);
  });

  // きりのいい価格に横線
  for (let v = sc.bottom; v <= sc.top + sc.step / 2; v += sc.step) {
    const py = y(v);
    parts.push(`<line x1="${L}" y1="${py}" x2="${L + iw}" y2="${py}" class="hline"/>`);
    parts.push(`<text x="${L - 8}" y="${py + 5}" class="lab" text-anchor="end">${fmtAxis(v, sc.step)}</text>`);
  }

  parts.push(`<rect x="${L}" y="${T}" width="${iw}" height="${ih}" class="axis"/>`);

  // 移動平均。抜けている日はつながずに切る
  shown.forEach((m) => {
    let d = "", pen = false;
    days.forEach((day, i) => {
      const v = m.line.get(day);
      if (v === undefined) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    if (d) parts.push(`<path d="${d}" class="ma" stroke-dasharray="${m.dash}"/>`);
  });

  if (bars) {
    // ローソク足。ヒゲは細線、実体は箱。陽線は枠だけ、陰線は塗りつぶし
    const cw = Math.max(1, Math.min(11, (iw / days.length) * 0.7));
    days.forEach((d, i) => {
      const b = bars.get(d);
      if (!b) return;
      const o = Number(b.open), h = Number(b.high), l = Number(b.low), c = Number(b.close);
      const px = x(i);
      parts.push(`<line x1="${px.toFixed(1)}" y1="${y(h).toFixed(1)}" x2="${px.toFixed(1)}" y2="${y(l).toFixed(1)}" class="cs"/>`);
      const top = y(Math.max(o, c));
      const hgt = Math.max(1, Math.abs(y(o) - y(c)));
      const cls = c < o ? "cs dn" : "cs";      // 下げた日は塗る
      parts.push(`<rect x="${(px - cw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${cw.toFixed(1)}" height="${hgt.toFixed(1)}" class="${cls}"/>`);
    });
  } else {
    const dpath = days
      .map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(Number(map.get(d))).toFixed(1)}`)
      .join("");
    parts.push(`<path d="${dpath}" class="plot"/>`);
  }

  const boxes = MA_LINES.map((m) =>
    `<label><input type="checkbox" data-ma="${m.n}"${settings.ma[m.n] ? " checked" : ""}><span class="bx"></span>${m.n}MA</label>`
  ).join("");

  const boxW = W + 8 * 2 + 2 * 2;      // padding と枠線のぶん
  chartEl.innerHTML = `
    <div class="box" style="width:${boxW}px">
      <div class="head">
        <div class="left"><span class="name">${title}</span><span class="ma-pick">${boxes}</span></div>
        <div class="sub">${days[0]} 〜 ${days[days.length - 1]}　${days.length}日</div>
      </div>
      <svg width="${W}" height="${H}">${parts.join("")}</svg>
    </div>`;

  chartEl.querySelectorAll("input[data-ma]").forEach((box) => {
    box.addEventListener("change", () => {
      settings.ma[box.dataset.ma] = box.checked;
      saveSettings();
      drawChart();
    });
  });
}

function closeChart() {
  chartEl.classList.add("hidden");
  chartEl.innerHTML = "";
}
// チャート以外を押したら消す
chartEl.addEventListener("click", (e) => {
  if (!e.target.closest(".box")) closeChart();
});

// ホイールで大きさを変える。縦横の比は 1 : 1.62 のまま
const ZOOM_MIN = 0.4, ZOOM_MAX = 4;
chartEl.addEventListener("wheel", (e) => {
  if (chartEl.classList.contains("hidden")) return;
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  settings.chartZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, settings.chartZoom * f));
  saveSettings();
  drawChart();
}, { passive: false });

async function drawCharts() {
  const mine = ++cRendering;
  const year = String(settings.chartYear);
  cyearEl.value = year;

  canvasEl.innerHTML = '<div id="loading">読み込み中…</div>';

  const catalog = await buildCatalog(year);
  const series = [];
  for (const key of settings.chartColumns) series.push(await seriesOf(key, year));
  if (mine !== cRendering) return;

  drawPicks(catalog);

  // 横軸は全銘柄をそろえる。どれかに値がある日を並べる
  const dates = new Set();
  series.forEach((m) => m.forEach((_, d) => dates.add(d)));

  if (!days.length) {
    canvasEl.innerHTML = '<div id="loading">この年のデータがない</div>';

  else drawAbsolute(days, series, catalog);

    `${days[0]} 〜 ${days[days.length - 1]}　${days.length}日 × ${settings.chartColumns.length}銘柄`;
}

/* 価格の数字を置く左の幅。ここは固定する。
   銘柄によって桁が違っても描画枠の大きさを変えないため、
   5桁までは普段の大きさで書き、それより多い桁は字を縮めて収める。 */
const AXIS_CHARS = 5;
const AXIS_FS = 14;                                  // .lab と同じ大きさ
const AXIS_CW = AXIS_FS * 0.6;                       // 1文字ぶんの幅
const AXIS_L = Math.ceil(AXIS_CHARS * AXIS_CW) + 10;

// 価格の横線と、その左の数字。数字は AXIS_L の幅に収める
function priceLines(sc, y, iw) {
  const labs = [];
  for (let v = sc.bottom; v <= sc.top + sc.step / 2; v += sc.step) labs.push([v, fmtAxis(v, sc.step)]);
  const widest = Math.max(...labs.map(([, s]) => s.length));
  const fs = widest > AXIS_CHARS
    ? Math.floor((AXIS_FS * AXIS_CHARS / widest) * 10) / 10
    : AXIS_FS;

  const out = [];
  labs.forEach(([v, s]) => {
    const py = y(v);
    out.push(`<line x1="${AXIS_L}" y1="${py}" x2="${AXIS_L + iw}" y2="${py}" class="hline"/>`);
    out.push(`<text x="${AXIS_L - 8}" y="${(py + fs * 0.36).toFixed(1)}" class="lab"`
      + ` font-size="${fs}" text-anchor="end">${s}</text>`);
  });
  return out;
}

// 等幅なので文字数で幅が出る。全角は2文字ぶん
function textW(s, fs) {
  let n = 0;
  for (const ch of s) n += ch.charCodeAt(0) < 256 ? 1 : 2;
  return n * fs * 0.6;
}

/* 右横の名札。折れ線の終わりの高さに置くが、近すぎると重なるので
   上から順に押し下げる。下にはみ出したら全体を上へ寄せる */
function stackTags(tags, y, T, ih) {
  const H = AXIS_FS + 3;
  const out = tags.map((t) => ({ ...t, ly: y(t.v) })).sort((a, b) => a.ly - b.ly);
  let prev = -1e9;
  out.forEach((t) => { t.ly = Math.max(t.ly, prev + H); prev = t.ly; });
  const over = out.length ? out[out.length - 1].ly - (T + ih) : 0;
  if (over > 0) out.forEach((t) => { t.ly = Math.max(T + AXIS_FS, t.ly - over); });
  return out;
}

// 描く場所の大きさ。描画部分が 1 : 1.62
function boxSize(rows, rightPad) {
  const RATIO = 1.62;
  const T = 8, B = 24, R = rightPad === undefined ? 6 : rightPad;
  const avail = canvasEl.clientHeight - 20;
  let ih = rows > 1 ? Math.round(avail / 2) - T - B : avail - T - B;
  ih = Math.max(150, ih);
  let iw = Math.round(ih * RATIO);
  const maxIW = canvasEl.clientWidth - 34 - AXIS_L - R;
  if (iw > maxIW) { iw = maxIW; ih = Math.round(iw / RATIO); }
  return { iw, ih, T, B, R, RATIO };
}

// 月ごとの縦線と、下の月の数字
function monthLines(days, x, T, ih) {
  const out = [];
  let prev = "";
  days.forEach((d, i) => {
    const m = d.slice(0, 7);
    if (m === prev) return;
    prev = m;
    const px = x(i);
    out.push(`<line x1="${px}" y1="${T}" x2="${px}" y2="${T + ih}" class="vline"/>`);
    out.push(`<text x="${px}" y="${T + ih + 18}" class="lab" text-anchor="middle">${Number(d.slice(5, 7))}</text>`);
  });
  return out;
}

// 相対チャート。年初を100にして重ねる
function drawRelative(days, series, catalog) {
  const rel = series.map((m) => {
    const first = days.map((d) => m.get(d)).find((v) => v !== undefined);
    const out = new Map();
    if (first === undefined) return out;
    days.forEach((d) => {
      const v = m.get(d);
      if (v !== undefined) out.set(d, (Number(v) / Number(first)) * 100);
    });
    return out;
  });

  const vals = [];
  rel.forEach((m) => m.forEach((v) => vals.push(v)));
  if (!vals.length) return;
  const sc = scaleOf(Math.min(...vals), Math.max(...vals));

  // 折れ線の右横に出す銘柄名と最終値。線と同じ色で置く
  const tags = [];
  rel.forEach((m, i) => {
    let last = null;
    for (let j = days.length - 1; j >= 0; j--) {
      const v = m.get(days[j]);
      if (v !== undefined) { last = v; break; }
    }
    if (last === null) return;
    tags.push({
      i, v: last,
      text: `${labelOf(settings.chartColumns[i], catalog)}　${last.toFixed(1)}`
    });
  });

  // 名前のぶんだけ右に余白を取る。取りすぎるとチャートが痩せるので頭を打つ
  const pad = tags.length
    ? Math.min(Math.max(...tags.map((t) => textW(t.text, AXIS_FS))) + 14,
               Math.max(120, canvasEl.clientWidth * 0.34))
    : 6;
  const { iw, ih, T, B, R } = boxSize(1, pad);
  const W = iw + AXIS_L + R, H = ih + T + B;

  const x = (i) => AXIS_L + (days.length === 1 ? iw / 2 : (iw * i) / (days.length - 1));
  const y = (v) => T + ih - (ih * (v - sc.bottom)) / (sc.top - sc.bottom);

  const parts = monthLines(days, x, T, ih).concat(priceLines(sc, y, iw));
  parts.push(`<rect x="${AXIS_L}" y="${T}" width="${iw}" height="${ih}" class="axis"/>`);

  rel.forEach((m, i) => {
    let d = "", pen = false;
    days.forEach((day, j) => {
      const v = m.get(day);
      if (v === undefined) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(j).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    if (d) {
      const c = SERIES_COLORS[i % SERIES_COLORS.length];
      parts.push(`<path d="${d}" class="plot rel" stroke="${c}"/>`);
    }
  });

  stackTags(tags, y, T, ih).forEach((t) => {
    const c = SERIES_COLORS[t.i % SERIES_COLORS.length];
    parts.push(`<text x="${AXIS_L + iw + 8}" y="${t.ly.toFixed(1)}" class="lab" fill="${c}">${t.text}</text>`);
  });

  const box = document.createElement("div");
  box.className = "one-chart";
  box.innerHTML = `<div class="cap">年初を100とした動き</div><svg width="${W}" height="${H}">${parts.join("")}</svg>`;
  canvasEl.appendChild(box);
}

// 絶対チャート。そのままの値で、同じ時系列を上から縦に並べる
function drawAbsolute(days, series, catalog) {
  const { iw, ih, T, B, R } = boxSize(2);

  settings.chartColumns.forEach((key, i) => {
    const m = series[i];
    const vals = days.map((d) => m.get(d)).filter((v) => v !== undefined).map(Number);
    const box = document.createElement("div");
    box.className = "one-chart";

    if (!vals.length) {
      box.innerHTML = `<div class="cap">${labelOf(key, catalog)}　この年のデータがない</div>`;
      canvasEl.appendChild(box);
      return;
    }

    const sc = scaleOf(Math.min(...vals), Math.max(...vals));
    const W = iw + AXIS_L + R, H = ih + T + B;

    const x = (j) => AXIS_L + (days.length === 1 ? iw / 2 : (iw * j) / (days.length - 1));
    const y = (v) => T + ih - (ih * (v - sc.bottom)) / (sc.top - sc.bottom);

    const parts = monthLines(days, x, T, ih).concat(priceLines(sc, y, iw));
    parts.push(`<rect x="${AXIS_L}" y="${T}" width="${iw}" height="${ih}" class="axis"/>`);

    let d = "", pen = false;
    days.forEach((day, j) => {
      const v = m.get(day);
      if (v === undefined) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(j).toFixed(1)},${y(Number(v)).toFixed(1)}`;
      pen = true;
    });
    parts.push(`<path d="${d}" class="plot" stroke="var(--fg)"/>`);

    box.innerHTML = `<div class="cap">${labelOf(key, catalog)}</div><svg width="${W}" height="${H}">${parts.join("")}</svg>`;
    canvasEl.appendChild(box);
  });
}

let rendering = 0;
// いま表に並べている銘柄。終値と四本値で別々に覚える
function curColumns() {
  return settings.sheetMode === "ohlc" ? settings.ohlcColumns : settings.columns;
}

async function render() {
  const mine = ++rendering;
  const year = String(settings.year);
  const ohlc = settings.sheetMode === "ohlc";
  modeEl.textContent = ohlc ? "四本値" : "終値";
  gridEl.innerHTML = '<div id="loading">読み込み中…</div>';
  statusEl.textContent = "";

  // 四本値のときは、四本値の揃っている銘柄だけを候補にする
  const all = await buildCatalog(year);
  const catalog = ohlc ? all.filter((c) => c.ohlc) : all;

  const keys = curColumns();
  const series = [];                 // 終値。チャートと移動平均に使う
  const bars = [];                   // 四本値
  for (const key of keys) {
    if (ohlc) {
      const b = await barsOf(key, year);
      bars.push(b);
      series.push(new Map([...b].map(([d, v]) => [d, v.close])));
    } else {
      series.push(await seriesOf(key, year));
    }
  }
  if (mine !== rendering) return;                 // 途中で年が変わったら捨てる

  const dates = new Set();
  series.forEach((m) => m.forEach((_, d) => dates.add(d)));
  const rows = [...dates].sort();                 // 上が過去、下が現在

  const table = document.createElement("table");

  // 幅は colgroup で決める（table-layout: fixed）
  const colgroup = document.createElement("colgroup");
  const addCol = (key) => {
    const c = document.createElement("col");
    c.style.width = widthOf(key) + "px";
    colgroup.appendChild(c);
    return c;
  };
  const dateCol = addCol(DATE_COL);
  // 四本値は1銘柄で4列。4列とも同じ幅で動かす
  const groupCols = keys.map((key) =>
    ohlc ? OHLC_FIELDS.map(() => addCol(ohlcWidthKey(key))) : [addCol(key)]
  );
  addCol("__plus__");
  table.appendChild(colgroup);

  const thead = document.createElement("thead");
  const htr = document.createElement("tr");
  const corner = document.createElement("th");
  corner.className = "corner";
  corner.textContent = "日付";
  corner.appendChild(makeGrip(DATE_COL, dateCol));
  htr.appendChild(corner);

  keys.forEach((key, i) => {
    const name = labelOf(key, all);

    // 四本値は 銘柄名 / 始値・高値・安値・終値 の2行。名前は4列とも出す
    const fields = ohlc ? OHLC_FIELDS : [null];
    fields.forEach((fld, j) => {
      const th = document.createElement("th");
      const wrap = document.createElement("div");
      wrap.className = "colhead";

      const sel = document.createElement("select");
      sel.className = "picker";
      sel.title = "銘柄を変える";
      // その年に値が無い銘柄も選び続けられるようにしておく
      if (!catalog.some((c) => c.key === key)) {
        const keep = document.createElement("option");
        keep.value = key;
        keep.textContent = name;
        sel.appendChild(keep);
      }
      // 分野ごとに見出しを付けて区切る
      let box = null, cur = null;
      catalog.forEach((c) => {
        if (c.group !== cur) {
          cur = c.group;
          box = document.createElement("optgroup");
          box.label = cur;
          sel.appendChild(box);
        }
        const o = document.createElement("option");
        o.value = c.key;
        o.textContent = c.label;
        box.appendChild(o);
      });
      sel.value = key;
      sel.addEventListener("change", () => {
        curColumns()[i] = sel.value;
        saveSettings();
        render();
      });

      const del = document.createElement("button");
      del.textContent = "×";
      del.title = "この列を消す";
      del.addEventListener("click", () => {
        curColumns().splice(i, 1);
        saveSettings();
        render();
      });

      const arrow = document.createElement("button");
      arrow.textContent = "▼";
      arrow.title = "銘柄を変える";

      // ▼ と選択を重ねる。▼を押すと候補が開く
      const pick = document.createElement("div");
      pick.className = "pickwrap";
      pick.append(arrow, sel);

      const ops = document.createElement("div");
      ops.className = "ops" + (j ? " blank" : "");   // 出すのは左端の1列だけ
      ops.append(del, pick);        // 名前の下に横並びで置く

      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = name;
      nameEl.title = "押すとチャート";
      // 名前を押すと、いま画面に出ている分のチャートを出す
      nameEl.addEventListener("click", () =>
        openChart(name, key, series[i], ohlc ? bars[i] : null));

      wrap.appendChild(nameEl);
      if (fld) {
        const f = document.createElement("div");
        f.className = "field";
        f.textContent = fld.label;
        wrap.appendChild(f);
      }
      wrap.appendChild(ops);
      th.appendChild(wrap);
      // 取っ手は銘柄の右端に置く。掴むと4列とも同じ幅で動く
      if (j === fields.length - 1) {
        th.appendChild(makeGrip(ohlc ? ohlcWidthKey(key) : key, groupCols[i]));
      }
      htr.appendChild(th);
    });
  });

  const addTh = document.createElement("th");
  const add = document.createElement("button");
  add.className = "addcol";
  add.textContent = "＋";
  add.title = "列を足す";
  add.addEventListener("click", () => {
    const first = catalog.find((c) => !curColumns().includes(c.key));
    if (!first) return;
    curColumns().push(first.key);
    saveSettings();
    render();
  });
  addTh.appendChild(add);
  htr.appendChild(addTh);
  thead.appendChild(htr);

  const tbody = document.createElement("tbody");
  for (const d of rows) {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = d;
    tr.appendChild(th);
    keys.forEach((key, i) => {
      const b = ohlc ? bars[i].get(d) : null;
      (ohlc ? OHLC_FIELDS : [null]).forEach((fld) => {
        const td = document.createElement("td");
        const v = ohlc ? (b ? b[fld.f] : undefined) : series[i].get(d);
        if (v === undefined) { td.textContent = "#N/A"; td.className = "na"; }
        else td.textContent = fmt(v);
        tr.appendChild(td);
      });
    });
    tr.appendChild(document.createElement("td"));
    tbody.appendChild(tr);
  }

  table.append(thead, tbody);
  gridEl.innerHTML = "";
  gridEl.appendChild(table);
  statusEl.textContent = `${rows.length}日 × ${keys.length}銘柄`;
}

/* ---------------------------------------------------------------

   表もチャートも出したまま、透けた板の上を虫が動くだけ。
   マウスを動かすかキーを押せば消える。
--------------------------------------------------------------- */
const IDLE_MS = 300000;        // 5分
// 出るたびに匹数が増える。5匹の次はまた1匹に戻る
const HOW_MANY = [1, 2, 3, 4, 5];

const saverEl = document.getElementById("saver");
const SVGNS = "http://www.w3.org/2000/svg";

let idleTimer = 0, saverRAF = 0, saverBugs = [], saverT = 0, saverLast = 0;

const rnd = (a, b) => a + Math.random() * (b - a);
const DEG = 180 / Math.PI;

function svgEl(name, attrs) {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* 脚1本。付け根 → 膝 → 先。
   spread は体の軸に対する傾き。前脚は前向き（正）、後脚は後ろ向き（負）。
   ph で前後に振り、上げ下げする。 */
function legPath(ax, ay, side, reach, spread, ph) {
  const sw = Math.sin(ph) * 0.30;                    // 前後の振り
  const lift = Math.max(0, Math.cos(ph)) * 0.15;     // 上げると縮んで見える
  const t1 = spread + sw, t2 = t1 - 0.55;            // 腿と脛で向きが変わる
  const r = reach * (1 - lift) * 0.55;
  const kx = ax + Math.sin(t1) * r, ky = ay + side * Math.cos(t1) * r;
  const fx = kx + Math.sin(t2) * r, fy = ky + side * Math.cos(t2) * r;
  return `M${ax},${ay}L${kx.toFixed(1)},${ky.toFixed(1)}L${fx.toFixed(1)},${fy.toFixed(1)}`;
}

/* ---- 形を作る。どれも右（+X）を向いた姿で描く ---- */

const CENTI_SEGS = 14, CENTI_GAP = 8;

function buildCentipede(g) {
  const segs = [];
  for (let i = CENTI_SEGS - 1; i >= 0; i--) {          // 後ろの節から置いて頭を上にする
    const s = g.appendChild(svgEl("g", {}));
    const legs = [s.appendChild(svgEl("path", { class: "bug" })), s.appendChild(svgEl("path", { class: "bug" }))];
    const r = i === 0 ? 7 : 6.5 - (i / CENTI_SEGS) * 3;
    s.appendChild(svgEl("ellipse", { class: "bug body seg", cx: 0, cy: 0, rx: r, ry: r * 0.9 }));
    segs[i] = { g: s, legs, r };
  }
  const ant = [g.appendChild(svgEl("path", { class: "bug" })), g.appendChild(svgEl("path", { class: "bug" }))];
  return { segs, ant };
}

function drawCentipede(b) {
  b.parts.segs.forEach((s, i) => {
    const p = trailAt(b.trail, i * CENTI_GAP);
    const q = trailAt(b.trail, (i + 1) * CENTI_GAP);
    const ang = Math.atan2(p.y - q.y, p.x - q.x) * DEG;
    s.g.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
    const ph = b.phase - i * 0.7;
    s.legs[0].setAttribute("d", legPath(0, s.r * 0.7, 1, 11, -0.3, ph));
    s.legs[1].setAttribute("d", legPath(0, -s.r * 0.7, -1, 11, -0.3, ph + Math.PI));
  });
  const p = trailAt(b.trail, 0), q = trailAt(b.trail, CENTI_GAP);
  const ang = Math.atan2(p.y - q.y, p.x - q.x);
  b.parts.ant.forEach((A, i) => {
    const s = i ? 1 : -1;
    const w = Math.sin(saverT * 5 + i * 2) * 4;
    const c = Math.cos(ang), sn = Math.sin(ang);
    const pt = (lx, ly) => `${(p.x + lx * c - ly * sn).toFixed(1)},${(p.y + lx * sn + ly * c).toFixed(1)}`;
    A.setAttribute("d", `M${pt(4, s * 2)}Q${pt(14, s * 7 + w)} ${pt(22, s * 4 + w * 1.4)}`);
  });
}

// 通った跡をさかのぼって、後ろへ dist だけ離れた点を返す
function trailAt(trail, dist) {
  if (dist <= 0 || trail.length < 2) return trail[0];
  let acc = 0;
  for (let i = 1; i < trail.length; i++) {
    const dx = trail[i].x - trail[i - 1].x, dy = trail[i].y - trail[i - 1].y;
    const d = Math.hypot(dx, dy);
    if (acc + d >= dist) {
      const t = d === 0 ? 0 : (dist - acc) / d;
      return { x: trail[i - 1].x + dx * t, y: trail[i - 1].y + dy * t };
    }
    acc += d;
  }
  return trail[trail.length - 1];
}

/* ---- 動き ---- */

// 端に寄ったら内側へ向き直る
function steer(b, w, h) {
  const m = 60;
  let tx = 0, ty = 0;
  if (b.x < m) tx = 1; else if (b.x > w - m) tx = -1;
  if (b.y < m) ty = 1; else if (b.y > h - m) ty = -1;
  if (!tx && !ty) return;
  const want = Math.atan2(ty || Math.sin(b.ang), tx || Math.cos(b.ang));
  let d = want - b.ang;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  b.ang += d * 0.10;
}

function moveBug(b, dt, w, h) {
  // ゆっくり波打って進む
  b.ang += Math.sin(saverT * 1.1 + b.seed) * 1.2 * dt;
  b.phase += 9 * dt;
  const v = b.speed;

  steer(b, w, h);
  b.x += Math.cos(b.ang) * v * dt;
  b.y += Math.sin(b.ang) * v * dt;
  b.x = Math.min(Math.max(b.x, -30), w + 30);
  b.y = Math.min(Math.max(b.y, -30), h + 30);

  b.trail.unshift({ x: b.x, y: b.y });
  if (b.trail.length > 400) b.trail.pop();
}

/* ---- 出す・消す ---- */

function buildBugs(howMany) {
  const svg = svgEl("svg", {});
  const w = window.innerWidth, h = window.innerHeight;
  saverBugs = [];

  for (let i = 0; i < howMany; i++) {
    const g = svg.appendChild(svgEl("g", {}));
    const b = {
      g,
      x: rnd(60, w - 60), y: rnd(60, h - 60),
      ang: rnd(0, Math.PI * 2), speed: rnd(45, 80), phase: rnd(0, 6.3),
      seed: rnd(0, 6.3), trail: []
    };
    b.parts = buildCentipede(g);
    for (let k = 0; k < 260; k++) {              // 最初から体がつながって見えるように
      b.trail.push({ x: b.x - Math.cos(b.ang) * k * 0.6, y: b.y - Math.sin(b.ang) * k * 0.6 });
    }
    saverBugs.push(b);
  }

  saverEl.innerHTML = "";
  saverEl.appendChild(svg);
}

function stepSaver(now) {
  const dt = Math.min((now - saverLast) / 1000, 0.05);
  saverLast = now;
  saverT += dt;
  const w = window.innerWidth, h = window.innerHeight;

  saverBugs.forEach((b) => {
    moveBug(b, dt, w, h);
    drawCentipede(b);                           // 節ごとに置くので群そのものは動かさない
  });

  saverRAF = requestAnimationFrame(stepSaver);
}

function startSaver() {
  if (!saverEl.classList.contains("hidden")) return;
  const howMany = HOW_MANY[settings.bugIndex % HOW_MANY.length];
  settings.bugIndex = (settings.bugIndex + 1) % HOW_MANY.length;   // 次は1匹増える
  saveSettings();

  buildBugs(howMany);
  saverEl.classList.remove("hidden");
  saverT = 0;
  saverLast = performance.now();
  saverRAF = requestAnimationFrame(stepSaver);
}

function stopSaver() {
  cancelAnimationFrame(saverRAF);
  saverRAF = 0;
  saverBugs = [];
  saverEl.innerHTML = "";
  saverEl.classList.add("hidden");
}

// 何か触ったら消す。そこから測り直す
const STOPPABLE = new Set(["mousedown", "pointerdown", "keydown", "touchstart"]);

function pokeSaver(e) {
  if (!saverEl.classList.contains("hidden")) {
    stopSaver();
    // 虫を消すための一押し。下の画面までは届かせない
    if (e && STOPPABLE.has(e.type)) {
      e.stopPropagation();
      if (e.cancelable) e.preventDefault();
    }
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startSaver, IDLE_MS);
}
// 押した・叩いたものは止められるように（passive にしない）
["mousedown", "pointerdown", "keydown", "touchstart"]
  .forEach((n) => window.addEventListener(n, pokeSaver, true));
// 動かしただけのものは止めようがない。時間を巻き直すだけ
["mousemove", "wheel", "touchmove"]
  .forEach((n) => window.addEventListener(n, pokeSaver, { capture: true, passive: true }));
pokeSaver();
</script>
