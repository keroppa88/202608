      if (i === j) td.textContent = "1.000";
      else {
        const pair = pairByKey.get(corrPairKey(a, b));
        const v = pair ? pair.analysis.current[period] : null;
        td.textContent = fmtCorr(v);
        if (v === null) td.className = "na";
        else td.addEventListener("click", () => openPairDetail(pair));
      }
      tr.appendChild(td);
    });
    mb.appendChild(tr);
  });
  mt.appendChild(mb); matrixScroll.appendChild(mt); matrix.body.appendChild(matrixScroll);
  blocks.set("matrix", matrix.block);

  let pairChart = null;
  if (corrSelectedPair) {
    const pair = pairs.find((p) => p.key === corrSelectedPair);
    if (pair) {
      const pairName = `${labelOf(pair.a, catalog)} × ${labelOf(pair.b, catalog)}`;
      pairChart = makeCorrelationChart(
        `${pairName}　ローリング相関`,
        CORR_PERIODS.map((n) => ({ label: `${pairName} ${n}日`, data: pair.analysis.rolling[n] })),
        "pairTrend", { blockKey: "pairChart", onClose: closePairDetail }
      );
      pairChart.id = "corr-detail";
    }
  }

  const pairBox = makeCorrBlock("相関ペア一覧", "pairChanges", { blockKey: "pairs" });
  const pairScroll = document.createElement("div"); pairScroll.className = "corr-scroll";
  const pt = document.createElement("table"); pt.className = "corr-table corr-pairs";
  const cols = [["a", "銘柄A"], ["b", "銘柄B"], ["r20", "20日"], ["r60", "60日"], ["r120", "120日"], ["d2060", "Δ20-60"], ["d20120", "Δ20-120"]];
  const ph = document.createElement("thead"), phr = document.createElement("tr");
  cols.forEach(([key, label]) => {
    const th = document.createElement("th"); th.className = "corr-sort";
    th.textContent = label + (corrSort.key === key ? (corrSort.dir > 0 ? " ▲" : " ▼") : "");
    th.addEventListener("click", () => {
      corrSort = corrSort.key === key ? { key, dir: -corrSort.dir } : { key, dir: key === "a" || key === "b" ? 1 : -1 };
      drawCorrelationResults();
    });
    phr.appendChild(th);
  });
  ph.appendChild(phr); pt.appendChild(ph);
  const pairRows = pairs.map((p) => {
    const c = p.analysis.current;
    return { p, a: labelOf(p.a, catalog), b: labelOf(p.b, catalog), r20: c[20], r60: c[60], r120: c[120],
      d2060: c[20] === null || c[60] === null ? null : c[20] - c[60],
      d20120: c[20] === null || c[120] === null ? null : c[20] - c[120],
      d60120: c[60] === null || c[120] === null ? null : c[60] - c[120] };
  });
  pairRows.sort((x, y) => {
    const a = x[corrSort.key], b = y[corrSort.key];
    if (a === null) return 1; if (b === null) return -1;
    return (typeof a === "string" ? a.localeCompare(b, "ja") : a - b) * corrSort.dir;
  });
  const pb = document.createElement("tbody");
  pairRows.forEach((r) => {
    const tr = document.createElement("tr");
    [r.a, r.b, fmtCorr(r.r20), fmtCorr(r.r60), fmtCorr(r.r120), fmtCorr(r.d2060, true), fmtCorr(r.d20120, true)]
      .forEach((v) => { const td = document.createElement("td"); td.textContent = v; if (v === "N/A") td.className = "na"; tr.appendChild(td); });
    tr.addEventListener("click", () => openPairDetail(r.p)); pb.appendChild(tr);
  });
  pt.appendChild(pb); pairScroll.appendChild(pt); pairBox.body.appendChild(pairScroll); blocks.set("pairs", pairBox.block);
  if (pairChart) blocks.set("pairChart", pairChart);

  const cent = makeCorrBlock(`中心性ランキング（${period}日順）`, "centrality", { blockKey: "centrality" });
  const ct = document.createElement("table"); ct.className = "corr-table";
  ct.innerHTML = "<thead><tr><th>順位</th><th>銘柄</th><th>20日</th><th>60日</th><th>120日</th></tr></thead>";
  const cb = document.createElement("tbody");
  [...centrality].sort((a, b) => (b.values[period].v ?? -Infinity) - (a.values[period].v ?? -Infinity)).forEach((r, i) => {
    const tr = document.createElement("tr");
    const vals = [String(i + 1), labelOf(r.key, catalog), ...CORR_PERIODS.map((n) => {
      const x = r.values[n]; return `${fmtCorr(x.v)} (${x.used}/${x.total})`;
    })];
    vals.forEach((v) => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); }); cb.appendChild(tr);
  });
  ct.appendChild(cb); cent.body.appendChild(ct);

  const conc = makeCorrBlock("相関集中度", "concentration", { blockKey: "concentration" });
  const cards = document.createElement("div"); cards.className = "corr-cards";
  CORR_PERIODS.forEach((n) => {
    const c = concentration[n], card = document.createElement("div"); card.className = "corr-card";
    card.textContent = `${n}日　${c.used}/${c.total}ペア`;
    const v = document.createElement("span"); v.className = "v"; v.textContent = fmtCorr(c.v); card.appendChild(v); cards.appendChild(card);
  });
  conc.body.appendChild(cards); blocks.set("concentration", conc.block);
  blocks.set("centrality", cent.block);
  blocks.set("concentrationChart", makeCorrelationChart("相関集中度　長期推移",
    CORR_PERIODS.map((n) => ({ label: `相関集中度 ${n}日`, data: concentrationTimeline[n] })),
    "concentrationTrend", { blockKey: "concentrationChart" }));
  blocks.set("securitiesChart", makeSecuritiesChart(keys, catalog, prices));
  appendCorrelationBlocks(blocks);
}

/* ---------------------------------------------------------------
   AI分析。メイン1銘柄とサブ最大10銘柄について、判断の材料になる数字を
   こちらで作ってから送る。表の数値そのものは送らない。
   中継先（Cloudflare Worker）の宛先はここに書く。worker/ の中身を配って
   から、その宛先を貼る。空のままなら押しても送らずに、その旨を出す。
--------------------------------------------------------------- */
const AI_ENDPOINT = "https://soba-ai.kaikai9984.workers.dev";

const AI_PERIODS = [20, 60, 120];
const AI_REGIME_WINDOW = 20;   // 局面を分ける窓
const AI_FORWARD = 20;         // その後どうなったかを見る長さ
const AI_LEAD_SHIFTS = [-5, -1, 0, 1, 5];   // 0 は同時。ずらした値と比べる元になる
const AI_PATH_POINTS = 12;     // 相関の推移として渡す点の数

function aiRound(v, digits) {
  return (v === null || v === undefined || !Number.isFinite(v)) ? null : Number(v.toFixed(digits));
}
// 騰落率は%に直す。金利など前日差の系列はそのままの単位で渡す
function aiScale(v, unit, digits) {
  if (v === null || v === undefined || !Number.isFinite(v)) return null;
  return Number((unit === "pt" ? v : v * 100).toFixed(digits));
}
function aiUnit(meta) {
  return meta.calcType === "diff" ? "pt" : "%";
}

function aiSidePercent(side, unit) {
  return { main: aiScale(side.main, unit, 3), win: aiScale(side.win, "%", 1), n: side.n };
}

// 初めて開いたときは、表で選んでいる銘柄からメインとサブを埋めておく
function setCorrAiDefaults(catalog) {
  const has = (key) => catalog.some((c) => c.key === key);
  const pool = settings.corrColumns.filter(has);
  if (!settings.corrAiMain || !has(settings.corrAiMain)) {
    settings.corrAiMain = pool[0] || (catalog[0] ? catalog[0].key : "");
  }
  settings.corrAiSubs = [...new Set(settings.corrAiSubs)]
    .filter((key) => has(key) && key !== settings.corrAiMain).slice(0, MAX_AI_SUBS);
  if (!settings.corrAiSubs.length) {
    settings.corrAiSubs = pool.filter((key) => key !== settings.corrAiMain).slice(0, 2);
  }
  saveSettings();
}

async function buildCorrAiPayload(catalog, progress) {
  const mainKey = settings.corrAiMain;
  const subKeys = settings.corrAiSubs.filter((k) => k && k !== mainKey).slice(0, MAX_AI_SUBS);
  const keys = [...new Set([mainKey, ...subKeys, CORR_CALENDAR.JP, CORR_CALENDAR.KR])];
  const prices = await loadCorrelationPrices(keys, progress);
  const metas = new Map(keys.map((key) => [key, corrMeta(key, catalog)]));
  const changes = new Map(keys.map((key) => [key,
    correlationChanges(key, prices.get(key), metas.get(key))]));
  const calendars = {
    JP: [...prices.get(CORR_CALENDAR.JP).keys()].sort(),
    KR: [...prices.get(CORR_CALENDAR.KR).keys()].sort()
  };

  const mainMeta = metas.get(mainKey);
  const mainUnit = aiUnit(mainMeta);
  const series = [...prices.get(mainKey)].sort((a, b) => a[0].localeCompare(b[0]))
    .map(([d, v]) => ({ d, v }));
  const s = CorrelationEngine.summarizeSeries(series, mainMeta.calcType);
  if (!s) throw new Error(`${mainMeta.label} の値が1つも無い`);

  const main = {
    name: mainMeta.label, unit: mainUnit, asOf: s.date, close: aiRound(s.close, 4), n: s.n,
    ret: {
      "5": aiScale(s.ret[5], mainUnit, 2), "20": aiScale(s.ret[20], mainUnit, 2),
      "60": aiScale(s.ret[60], mainUnit, 2), "250": aiScale(s.ret[250], mainUnit, 2),
      ytd: aiScale(s.ret.ytd, mainUnit, 2)
    },
    hv20: aiScale(s.hv20, "%", 1),
    ma200Gap: aiScale(s.ma200Gap, mainUnit, 2),
    drawdown: aiScale(s.drawdown, "%", 2),
    rangePos: aiScale(s.rangePos, "%", 0),
    high250: aiRound(s.high250, 4), low250: aiRound(s.low250, 4)
  };

  const subs = [];
  for (const key of subKeys) {
    const meta = metas.get(key);
    const unit = aiUnit(meta);
    const points = CorrelationEngine.alignPair(
      changes.get(mainKey), changes.get(key), mainMeta, meta, calendars);
    if (points.length < 40) {
      subs.push({ name: meta.label, unit, n: points.length, note: "対応する観測が40に満たないため計算しない" });
      continue;
    }
    const rolling = {};
    const r = {};
    AI_PERIODS.forEach((n) => {
      rolling[n] = CorrelationEngine.rollingCorrelation(points, n);
      const last = rolling[n][rolling[n].length - 1];
      r[String(n)] = aiRound(last ? last.v : null, 3);
    });
    const roll60 = rolling[60];
    const recent = roll60.slice(-250).map((x) => x.v);
    const ago = roll60.length > 250 ? roll60[roll60.length - 251].v : null;
    const regime = CorrelationEngine.regimeCorrelation(points, AI_REGIME_WINDOW, mainMeta.calcType);
    const cond = CorrelationEngine.conditionalReturns(points);
    const fwd = CorrelationEngine.forwardAfterExtreme(
      points, AI_REGIME_WINDOW, AI_FORWARD, meta.calcType, mainMeta.calcType);

    subs.push({
      name: meta.label, unit, n: points.length,
      from: points[0].d, to: points[points.length - 1].d,
      r,
      r60Ago: aiRound(ago, 3),
      r60Rank: roll60.length ? aiScale(
        CorrelationEngine.quantileRank(recent, roll60[roll60.length - 1].v), "%", 0) : null,
      r60Path: CorrelationEngine.sampleEvenly(roll60, AI_PATH_POINTS)
        .map((x) => [x.d.slice(0, 7), aiRound(x.v, 2)]),
      regime: {
        up: aiRound(regime.up, 3), down: aiRound(regime.down, 3),
        upDays: regime.upDays, downDays: regime.downDays
      },
      cond: {
        subUp: aiSidePercent(cond.subUp, mainUnit),
        subDown: aiSidePercent(cond.subDown, mainUnit),
        base: { main: aiScale(cond.base.main, mainUnit, 3), n: cond.base.n }
      },
      fwd: fwd ? {
        high: aiSidePercent(fwd.high, mainUnit),
        low: aiSidePercent(fwd.low, mainUnit),
        base: { main: aiScale(fwd.base.main, mainUnit, 3), n: fwd.base.n }
      } : null,
      lead: CorrelationEngine.leadLag(points, AI_LEAD_SHIFTS)
        .map((x) => [x.shift, aiRound(x.r, 3)])
    });
  }

  return {
    asOf: main.asOf,
    regimeWindow: AI_REGIME_WINDOW,
    forward: AI_FORWARD,
    main,
    subs
  };
}

/* ---------------------------------------------------------------
   AIコメント。テクニカル指標と相関を、ひとつの文章にまとめて返す。

   数字はすべてこちら側で作る。AIは文章にするだけ。

   指標は2通りで出す。
     既定  … よくある数字（5/25/75 など）での移動平均と乖離
     自動  … その銘柄・その期間で成績のいちばん良かった数字での指標一式
   両方を渡すのは、「普通に見たらこう、その銘柄に合わせて見たらこう」を
   突き合わせて述べさせるため。自動は押していなくても、ここで走らせる。

   期間は10年。足りなければあるだけ。何年ぶんで見たかは payload に入れて、
   文章の中で触れさせる。

   似た局面は、指標を z 化した状態ベクトルの距離で探す。銘柄ごとの癖を
   打ち消すため、平均と標準偏差はその銘柄自身の分布から取る。
--------------------------------------------------------------- */
const techAiEl = document.getElementById("techai");
const taiBtn = document.getElementById("tai");
// 帯の吹き出し。作っている間・出来た後は別の文言に差し替わる
const AI_COMMENT_TITLE = taiBtn.title;

const AI_TECH_YEARS = 10;          // 読みにいく年数。足りなければあるだけ
const AI_TECH_RECENT = 10;         // 中継へ送るとき、直近何日ぶんを渡すか
const AI_TEXT_RECENT = 120;        // テキスト出力のとき。中継の上限が無いので長く取る
const AI_TECH_BACK = [20, 40, 60, 80, 100, 150, 200];   // 経緯として見る「何日前」

// 送る指標。値段そのものは送らない。比べられる形の数字だけ
const AI_TECH_FIELDS = [
  "c",
  "chg5", "chg10", "chg20", "chg60", "chg100", "chg200", "run",
  "dev0", "dev1", "dev2", "slope0", "slope1", "slope2", "order",
  "bbB", "bbW", "pos52", "posDay", "fromHi", "fromLo",
  "rsi", "stK", "stD", "rci0", "rci1",
  "macd", "macdS", "macdH", "macdHR",
  "atr", "hv", "gap", "range", "volR",
  "dMaS", "dMaL", "dMacd", "dSar", "dStoch", "dRsi"
];

// 既定の数字で見るのは移動平均と乖離だけ
const AI_BASE_FIELDS = ["ma0", "ma1", "ma2", "dev0", "dev1", "dev2"];

// 似た局面を探すときの状態ベクトル
const AI_LIKE_SHORT = ["dev0", "rsi", "stK", "stD", "macdHR"];
const AI_LIKE_LONG = ["dev2", "pos52", "chg200", "slope2"];
const AI_LIKE_SKIP = 60;      // 直近この日数は「似ている」に決まっているので外す
const AI_LIKE_GAP = 20;       // 選んだ日の前後この日数は同じ局面とみなす
const AI_LIKE_TOP = 10;       // 上位何件を渡すか
const AI_LIKE_PER_YEAR = 3;   // 同じ年から取るのはここまで
const AI_LIKE_FWD = [5, 10, 20, 60];   // その後の騰落率を見る日数

let techAiBusy = false;

// 1日ぶんを送る形に切り出す
function aiTechRow(ind, rows, i, fields) {
  const out = { d: rows[i].d };
  fields.forEach((k) => {
    const v = (ind[k] || [])[i];
    out[k] = (v === null || v === undefined || !isFinite(v)) ? null : aiRound(v, 2);
  });
  return out;
}

function aiMedian(v) {
  const a = v.filter((x) => x !== null && isFinite(x)).sort((x, y) => x - y);
  if (!a.length) return null;
  const at = (a.length - 1) / 2;
  return aiRound(a.length % 2 ? a[at] : (a[Math.floor(at)] + a[Math.ceil(at)]) / 2, 2);
}

/* 似た局面を探す。
   平均と標準偏差はその銘柄自身の分布から取り、z 化して距離を測る。
   近すぎる日は同じ局面なので間引く。その後どうなったかも一緒に返す */
function aiLike(ind, rows, keys, at) {
  const stats = keys.map((k) => {
    const v = (ind[k] || []).filter((x) => x !== null && isFinite(x));
    if (v.length < 60) return null;
    const m = v.reduce((a, b) => a + b, 0) / v.length;
    const sd = Math.sqrt(v.reduce((a, b) => a + (b - m) * (b - m), 0) / v.length);
    return sd > 0 ? { m, sd } : null;
  });
  if (stats.some((x) => !x)) return null;

  const z = (i) => keys.map((k, j) => {
    const v = (ind[k] || [])[i];
    return (v === null || v === undefined || !isFinite(v)) ? null : (v - stats[j].m) / stats[j].sd;
  });
  const now = z(at);
  if (now.some((x) => x === null)) return null;

  const all = [];
  for (let i = 0; i < at - AI_LIKE_SKIP; i++) {
    const p = z(i);
    if (p.some((x) => x === null)) continue;
    let q = 0;
    for (let j = 0; j < now.length; j++) q += (now[j] - p[j]) * (now[j] - p[j]);
    all.push({ i, dist: Math.sqrt(q / now.length) });
  }
  all.sort((a, b) => a.dist - b.dist);

  // 近すぎる日は同じ局面。年ごとの数も抑える。そうしないと、直近の相場が
  // 似ているのは当たり前なので、10年から探したつもりで去年ばかりになる
  const picked = [];
  const perYear = new Map();
  for (const h of all) {
    if (picked.some((p) => Math.abs(p.i - h.i) < AI_LIKE_GAP)) continue;
    const y = rows[h.i].d.slice(0, 4);
    if ((perYear.get(y) || 0) >= AI_LIKE_PER_YEAR) continue;
    perYear.set(y, (perYear.get(y) || 0) + 1);
    picked.push(h);
    if (picked.length >= AI_LIKE_TOP) break;
  }
  if (!picked.length) return null;

  const hits = picked.map((h) => {
    const fwd = {};
    AI_LIKE_FWD.forEach((n) => {
      const to = rows[h.i + n];
      fwd[n] = (to && rows[h.i].c > 0) ? aiRound((to.c / rows[h.i].c - 1) * 100, 2) : null;
    });
    return {
      d: rows[h.i].d,
      dist: aiRound(h.dist, 2),
      state: Object.fromEntries(keys.map((k) => [k, aiRound((ind[k] || [])[h.i], 2)])),
      fwd
    };
  });

  const after = {};
  AI_LIKE_FWD.forEach((n) => {
    const v = hits.map((h) => h.fwd[n]).filter((x) => x !== null);
    after[n] = {
      n: v.length,
      median: aiMedian(v),
      win: v.length ? aiRound((v.filter((x) => x > 0).length / v.length) * 100, 0) : null
    };
  });

  return {
    keys,
    now: Object.fromEntries(keys.map((k) => [k, aiRound((ind[k] || [])[at], 2)])),
    hits,
    after
  };
}

// 送る数字をぜんぶ作る
async function buildTechAiPayload(progress, recentDays) {
  const key = settings.techKey;
  const endYear = Number(settings.techYear);

  progress("価格を読んでいます…");
  const rows = await techRows(key, endYear, AI_TECH_YEARS);
  if (rows.length < 250) throw new Error(`足が ${rows.length}日しかない`);
  const at = rows.length - 1;

  const catalog = await buildCatalog(String(endYear));
  const name = labelOf(key, catalog);

  // 助走ぶんを外したところから最適化する。頭の250日は指標が出そろわない
  const from = Math.min(250, Math.floor(rows.length / 4));

  progress("既定の数字で見ています…");
  const base = JSON.parse(JSON.stringify(DEFAULT_TECH_PARAMS));
  const indBase = techIndicators(rows, base);

  progress("いちばん合う数字を探しています…");
  const tuned = techAutoFit(rows, from, rows.length - 1, base);
  const indTuned = techIndicators(rows, tuned);

  progress("似た局面を探しています…");
  const like = {
    short: aiLike(indTuned, rows, AI_LIKE_SHORT, at),
    long: aiLike(indTuned, rows, AI_LIKE_LONG, at)
  };

  const backRow = (ind, fields) => {
    const out = {};
    AI_TECH_BACK.forEach((n) => {
      const i = at - n;
      out[n] = i >= 0 ? aiTechRow(ind, rows, i, fields) : null;
    });
    return out;
  };

  const recent = [];
  const nRecent = recentDays === undefined ? AI_TECH_RECENT : recentDays;
  for (let i = Math.max(0, at - nRecent + 1); i <= at; i++) {
    recent.push(aiTechRow(indTuned, rows, i, AI_TECH_FIELDS));
  }

  progress("相関を計算しています…");
  // 相関のメイン銘柄はテクニカルの銘柄。サブは比較に出している銘柄
  settings.corrAiMain = key;
  settings.corrAiSubs = techCompKeys().filter((k) => k !== key).slice(0, MAX_AI_SUBS);
  saveSettings();
  let corr = null;
  try {
    corr = await buildCorrAiPayload(catalog, progress);
  } catch (e) {
    corr = { error: String(e && e.message ? e.message : e) };
  }

  return {
    kind: "tech",
    name,
    asOf: rows[at].d,
    span: {
      from: rows[0].d,
      to: rows[at].d,
      rows: rows.length,
      years: aiRound((rows.length / 250), 1)
    },
    params: { base, tuned },
    base: {
      now: aiTechRow(indBase, rows, at, AI_BASE_FIELDS),
      back: backRow(indBase, AI_BASE_FIELDS)
    },
    tuned: {
      recent,
      back: backRow(indTuned, AI_TECH_FIELDS)
    },
    like,
    corr
  };
}

/* ---- ボタンと窓 ---- */

// いまの銘柄のコメントが出来ているか
function techAiReady() {
  const a = settings.techAi;
  return !!(a && a.text && a.key === settings.techKey);
}

function drawTechAiButton() {
  const ready = techAiReady();
  taiBtn.classList.toggle("blink", techAiBusy);      // 作っている間は点滅
  taiBtn.classList.toggle("on", !techAiBusy && ready);   // 出来たら点灯
  taiBtn.disabled = techAiBusy;
  taiBtn.textContent = techAiBusy ? "思考中…" : "AIコメント";
  taiBtn.title = techAiBusy ? "数字を作って中継へ送っている"
    : ready ? "出来ている。押すと出る"
      : AI_COMMENT_TITLE;
}

function openTechAi() {
  const a = settings.techAi || {};
  techAiEl.querySelector(".body").textContent = a.text || "";
  techAiEl.querySelector(".when").textContent =
    a.at ? `${a.name || ""}　${a.at}　${a.span || ""}` : "";
  techAiEl.classList.remove("hidden");
}
function closeTechAi() {
  techAiEl.classList.add("hidden");
}

async function runTechAi() {
  if (techAiBusy || !techState) return;
  techAiBusy = true;
  drawTechAiButton();
  const note = (t) => { tstatusEl.textContent = t; };
  const was = tstatusEl.textContent;
  try {
    const payload = await buildTechAiPayload(note);
    const body = JSON.stringify(payload);
    note(`送信 ${(body.length / 1024).toFixed(1)}KB`);
    if (!AI_ENDPOINT) {
      note("AIの中継先が設定されていない（index.html の AI_ENDPOINT）");
      return;
    }
    const res = await fetch(AI_ENDPOINT, {
      method: "POST", headers: { "content-type": "application/json" }, body
    });
    const text = await res.text();
    if (!res.ok) {
      // 返ってきたものをそのまま出す。それらしい文章で埋めない
      note(`AIが失敗（HTTP ${res.status}）`);
      settings.techAi = {
        key: settings.techKey, name: payload.name,
        at: new Date().toISOString().slice(0, 16).replace("T", " "),
        span: `${payload.span.from} 〜 ${payload.span.to}`,
        text: `失敗（HTTP ${res.status}）\n${text}`
      };
      saveSettings();
      return;
    }
    let answer = text;
    try {
      const j = JSON.parse(text);
      answer = j.text || j.error || text;
    } catch (_) { /* JSONで返らなければ本文をそのまま出す */ }
    settings.techAi = {
      key: settings.techKey, name: payload.name,
      at: new Date().toISOString().slice(0, 16).replace("T", " "),
      span: `${payload.span.from} 〜 ${payload.span.to}（${payload.span.years}年）`,
      text: answer
    };
    saveSettings();
    note(was);
  } catch (e) {
    note(`AIコメントを作れなかった: ${e && e.message ? e.message : e}`);
  } finally {
    techAiBusy = false;
    drawTechAiButton();
  }
}

// 出来ていれば見せる。無ければ作る
taiBtn.addEventListener("click", () => {
  if (techAiReady()) openTechAi();
  else runTechAi();
});
document.getElementById("taiclose").addEventListener("click", closeTechAi);
document.getElementById("tairun").addEventListener("click", () => {
  closeTechAi();
  runTechAi();
});
techAiEl.addEventListener("click", (e) => {
  if (e.target === techAiEl) closeTechAi();
});

/* テキスト出力。AIコメントが中継へ送るのと同じものを、そのまま .txt に落とす。
   中継は通らないので、手元のAIに貼って好きに読ませられる。

   中身は「プロンプト、空行、JSON」。中継が Gemini に渡している形と同じ。
   プロンプトは中継の /prompt から読む。中継が Gemini に渡している文面
   そのものなので、文面は1箇所にしかない。読めなければ、読めなかったと
   書いてJSONだけを落とす。それらしい文面で埋めない */
const ttxtBtn = document.getElementById("ttxt");
let techTxtBusy = false;

/* ファイル名は英数字だけにする。銘柄名をそのまま使うと、環境によっては
   名前が落ちて download になる（Chromium で確かめた）。銘柄名は JSON の
   name に入っているので、ファイル名からは落としてよい。
   英数字が1つも残らない銘柄（日経半導体株指数など）は、取り違えないよう
   数字を添える */
function fileBase(key) {
  const [src, id] = splitKey(key);
  const a = id.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  if (a) return `${src}_${a}`;
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0xffff;
  return `${src}_${h.toString(16).padStart(4, "0")}`;
}

function saveText(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function runTechText() {
  if (techTxtBusy || techAiBusy || !techState) return;
  techTxtBusy = true;
  ttxtBtn.disabled = true;
  ttxtBtn.textContent = "作成中…";
  const note = (t) => { tstatusEl.textContent = t; };
  const was = tstatusEl.textContent;
  try {
    const payload = await buildTechAiPayload(note, AI_TEXT_RECENT);
    note("プロンプトを読んでいます…");
    let prompt = "";
    if (!AI_ENDPOINT) {
      prompt = "（プロンプトを読めなかった: AIの中継先が設定されていない）";
    } else {
      try {
        const r = await fetch(`${AI_ENDPOINT}/prompt`);
        if (r.ok) prompt = (await r.text()).trim();
        else prompt = `（プロンプトを読めなかった: /prompt HTTP ${r.status}）`;
      } catch (e) {
        prompt = `（プロンプトを読めなかった: ${e && e.message ? e.message : e}）`;
      }
    }
    const body = `${prompt}\n\n${JSON.stringify(payload)}`;
    const file = `${fileBase(settings.techKey)}_${payload.asOf}.txt`;
    saveText(file, body);
    note(`${file} を落とした（${(body.length / 1024).toFixed(1)}KB）`);
  } catch (e) {
    note(`テキストを作れなかった: ${e && e.message ? e.message : e}`);
  } finally {
    techTxtBusy = false;
    ttxtBtn.disabled = false;
    ttxtBtn.textContent = "テキスト出力";
  }
}

ttxtBtn.addEventListener("click", runTechText);

function drawCorrelationPicks(catalog) {
  corrPicksEl.innerHTML = "";
  settings.corrColumns.forEach((key, i) => {
    const one = document.createElement("div"); one.className = "one";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = labelOf(key, catalog);
    const del = document.createElement("button"); del.textContent = "×"; del.title = "分析対象から外す";
    del.addEventListener("click", () => { settings.corrColumns.splice(i, 1); saveSettings(); renderCorrelations(); });
    const sel = document.createElement("select"); sel.title = "銘柄を変える"; fillPicker(sel, catalog, key, true);
    sel.addEventListener("change", () => {
      if (sel.value === DEL_VALUE) settings.corrColumns.splice(i, 1);
      else if (!settings.corrColumns.includes(sel.value)) settings.corrColumns[i] = sel.value;
      saveSettings(); renderCorrelations();
    });
    one.append(nm, del, sel); corrPicksEl.appendChild(one);
  });
  const add = document.createElement("button"); add.className = "add"; add.textContent = "＋";
  const full = settings.corrColumns.length >= MAX_CORR_COLUMNS;
  add.disabled = full;
  add.title = full ? `${MAX_CORR_COLUMNS}銘柄まで。足すには×でどれか外す` : "分析対象を足す";
  add.addEventListener("click", () => {
    if (settings.corrColumns.length >= MAX_CORR_COLUMNS) return;
    const first = catalog.find((c) => !settings.corrColumns.includes(c.key));
    if (first) { settings.corrColumns.push(first.key); saveSettings(); renderCorrelations(); }
  });
  corrPicksEl.appendChild(add);
}

async function renderCorrelations() {
  const mine = ++corrRendering;
  corrMainEl.innerHTML = '<div id="loading">全期間データを読み込み中…</div>';
  corrStatusEl.textContent = "";
  corrCatalog = corrCatalog || await buildCatalog("2026");
  settings.corrColumns = [...new Set(settings.corrColumns)].filter(Boolean).slice(0, MAX_CORR_COLUMNS);
  setCorrAiDefaults(corrCatalog);
  drawCorrelationPicks(corrCatalog);
  if (settings.corrColumns.length < 1) {
    corrMainEl.innerHTML = '<div id="loading">銘柄を1つ以上選んでください</div>';
    return;
  }
  const signature = settings.corrColumns.join("\n");
  if (corrState && corrStateSignature === signature) {
    drawCorrelationResults();
    const usable = corrState.pairs.filter((p) => p.analysis.current[settings.corrPeriod] !== null).length;
    corrStatusEl.textContent = `${corrState.keys.length}銘柄　${corrState.pairs.length}ペア（有効 ${usable}）`;
    return;
  }
  corrState = null; corrSelectedPair = null;
  const progress = (s) => { if (mine === corrRendering) corrStatusEl.textContent = s; };
  const state = await calculateCorrelations(settings.corrColumns, corrCatalog, progress);
  if (mine !== corrRendering) return;
  corrState = state;
  corrStateSignature = signature;
  drawCorrelationResults();
  const usable = state.pairs.filter((p) => p.analysis.current[settings.corrPeriod] !== null).length;
  corrStatusEl.textContent = `${state.keys.length}銘柄　${state.pairs.length}ペア（有効 ${usable}）`;
}

document.querySelectorAll("#rperiods button").forEach((b) => b.addEventListener("click", () => {
  settings.corrPeriod = Number(b.dataset.period); saveSettings();
  if (corrState) {
    drawCorrelationResults();
    const usable = corrState.pairs.filter((p) => p.analysis.current[settings.corrPeriod] !== null).length;
    corrStatusEl.textContent = `${corrState.keys.length}銘柄　${corrState.pairs.length}ペア（有効 ${usable}）`;
  }
}));

/* ---------------------------------------------------------------
   擬似スクリーンセーバー。しばらく触らないと生き物が出てくる。
   表もチャートも出したまま、透けた板の上を動くだけ。
   マウスを動かすかキーを押せば消える。
--------------------------------------------------------------- */
const IDLE_MS = 5 * 60 * 1000; // 5分
const SAVER_CYCLE = [
  { kind: "centipede", count: 1 },
  { kind: "ball", count: 1 },
  { kind: "butterfly", count: 1 },
  { kind: "centipede", count: 2 },
  { kind: "ball", count: 2 },
  { kind: "butterfly", count: 2 },
  { kind: "centipede", count: 3 },
  { kind: "ball", count: 3 },
  { kind: "butterfly", count: 4 }
];

const saverEl = document.getElementById("saver");
const SVGNS = "http://www.w3.org/2000/svg";

let idleTimer = 0, saverRAF = 0, saverBugs = [], saverT = 0, saverLast = 0;

const rnd = (a, b) => a + Math.random() * (b - a);
const DEG = 180 / Math.PI;

function svgEl(name, attrs) {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* 脚1本。付け根 → 膝 → 先。
   spread は体の軸に対する傾き。前脚は前向き（正）、後脚は後ろ向き（負）。
   ph で前後に振り、上げ下げする。 */
function legPath(ax, ay, side, reach, spread, ph) {
  const sw = Math.sin(ph) * 0.30;                    // 前後の振り
  const lift = Math.max(0, Math.cos(ph)) * 0.15;     // 上げると縮んで見える
  const t1 = spread + sw, t2 = t1 - 0.55;            // 腿と脛で向きが変わる
  const r = reach * (1 - lift) * 0.55;
  const kx = ax + Math.sin(t1) * r, ky = ay + side * Math.cos(t1) * r;
  const fx = kx + Math.sin(t2) * r, fy = ky + side * Math.cos(t2) * r;
  return `M${ax},${ay}L${kx.toFixed(1)},${ky.toFixed(1)}L${fx.toFixed(1)},${fy.toFixed(1)}`;
}

/* ---- 形を作る。どれも右（+X）を向いた姿で描く ---- */

const CENTI_SEGS = 14, CENTI_GAP = 8;

function buildCentipede(g) {
  const segs = [];
  for (let i = CENTI_SEGS - 1; i >= 0; i--) {          // 後ろの節から置いて頭を上にする
    const s = g.appendChild(svgEl("g", {}));
    const legs = [s.appendChild(svgEl("path", { class: "bug" })), s.appendChild(svgEl("path", { class: "bug" }))];
    const r = i === 0 ? 7 : 6.5 - (i / CENTI_SEGS) * 3;
    s.appendChild(svgEl("ellipse", { class: "bug body seg", cx: 0, cy: 0, rx: r, ry: r * 0.9 }));
    segs[i] = { g: s, legs, r };
  }
  const ant = [g.appendChild(svgEl("path", { class: "bug" })), g.appendChild(svgEl("path", { class: "bug" }))];
  return { segs, ant };
}

function drawCentipede(b) {
  b.parts.segs.forEach((s, i) => {
    const p = trailAt(b.trail, i * CENTI_GAP);
    const q = trailAt(b.trail, (i + 1) * CENTI_GAP);
    const ang = Math.atan2(p.y - q.y, p.x - q.x) * DEG;
    s.g.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
    const ph = b.phase - i * 0.7;
    s.legs[0].setAttribute("d", legPath(0, s.r * 0.7, 1, 11, -0.3, ph));
    s.legs[1].setAttribute("d", legPath(0, -s.r * 0.7, -1, 11, -0.3, ph + Math.PI));
  });
  const p = trailAt(b.trail, 0), q = trailAt(b.trail, CENTI_GAP);
  const ang = Math.atan2(p.y - q.y, p.x - q.x);
  b.parts.ant.forEach((A, i) => {
    const s = i ? 1 : -1;
    const w = Math.sin(saverT * 5 + i * 2) * 4;
    const c = Math.cos(ang), sn = Math.sin(ang);
    const pt = (lx, ly) => `${(p.x + lx * c - ly * sn).toFixed(1)},${(p.y + lx * sn + ly * c).toFixed(1)}`;
    A.setAttribute("d", `M${pt(4, s * 2)}Q${pt(14, s * 7 + w)} ${pt(22, s * 4 + w * 1.4)}`);
  });
}

// 通った跡をさかのぼって、後ろへ dist だけ離れた点を返す
function trailAt(trail, dist) {
  if (dist <= 0 || trail.length < 2) return trail[0];
  let acc = 0;
  for (let i = 1; i < trail.length; i++) {
    const dx = trail[i].x - trail[i - 1].x, dy = trail[i].y - trail[i - 1].y;
    const d = Math.hypot(dx, dy);
    if (acc + d >= dist) {
      const t = d === 0 ? 0 : (dist - acc) / d;
      return { x: trail[i - 1].x + dx * t, y: trail[i - 1].y + dy * t };
    }
    acc += d;
  }
  return trail[trail.length - 1];
}

/* ボール。枠に当たると跳ね返る */
const BALL_R = 66;

function buildBall(g) {
  g.appendChild(svgEl("circle", { class: "bug body", cx: 0, cy: 0, r: BALL_R }));
  return {};
}

/* 選択した生成画像を透明化した蝶シルエット */
const BUTTERFLY_ASSET = "assets/butterfly-silhouette.png";
let butterflyAssetId = 0;

function buildButterfly(g) {
  const assetId = ++butterflyAssetId;
  const defs = g.appendChild(svgEl("defs", {}));
  const makeClip = (id, x, width) => {
    const clip = defs.appendChild(svgEl("clipPath", { id }));
    clip.appendChild(svgEl("rect", { x, y: 0, width, height: 100 }));
  };
  const leftClip = `butterfly-left-${assetId}`;
  const bodyClip = `butterfly-body-${assetId}`;
  const rightClip = `butterfly-right-${assetId}`;
  const shapeMask = `butterfly-shape-${assetId}`;
  makeClip(leftClip, 0, 73);
  makeClip(bodyClip, 73, 17);
  makeClip(rightClip, 90, 72);

  // 画像は輪郭（アルファ）だけ使い、色はムカデ・丸と同じテーマ色で塗る。
  const mask = defs.appendChild(svgEl("mask", {
    id: shapeMask, x: 0, y: 0, width: 162, height: 100,
    maskUnits: "userSpaceOnUse", style: "mask-type:alpha"
  }));
  mask.appendChild(svgEl("image", {
    href: BUTTERFLY_ASSET, x: 0, y: 0, width: 162, height: 100,
    preserveAspectRatio: "none"
  }));
  const attrs = { x: 0, y: 0, width: 162, height: 100, fill: "var(--fg)", mask: `url(#${shapeMask})` };
  const left = g.appendChild(svgEl("rect", {
    ...attrs, "clip-path": `url(#${leftClip})`
  }));
  const right = g.appendChild(svgEl("rect", {
    ...attrs, "clip-path": `url(#${rightClip})`
  }));
  const body = g.appendChild(svgEl("rect", {
    ...attrs, "clip-path": `url(#${bodyClip})`
  }));
  // 頭の先から左右へ伸びる2本の触角。胴体と一緒に固定しておく。
  g.appendChild(svgEl("path", { class: "bug", d: "M78,29 Q72,18 65,12" }));
  g.appendChild(svgEl("path", { class: "bug", d: "M84,29 Q90,18 97,12" }));
  return { left, right, body };
}

function drawButterfly(b) {
  // 円形の頭と太い胴体は固定し、左右の翼だけを中心線へ寄せて羽ばたかせる
  const flap = 0.78 + 0.22 * Math.abs(Math.sin(b.phase));
  const wingTransform = `translate(81,0) scale(${flap.toFixed(3)},1) translate(-81,0)`;
  b.parts.left.setAttribute("transform", wingTransform);
  b.parts.right.setAttribute("transform", wingTransform);
  b.g.setAttribute(
    "transform",
    `translate(${b.x.toFixed(1)},${b.y.toFixed(1)}) rotate(${(b.ang * DEG + 90).toFixed(1)}) scale(0.70) translate(-81,-50)`
  );
}

/* ---- 動き ---- */

// 端に寄ったら内側へ向き直る
function steer(b, w, h, k, margin) {
  const m = margin || 60;
  let tx = 0, ty = 0;
  if (b.x < m) tx = 1; else if (b.x > w - m) tx = -1;
  if (b.y < m) ty = 1; else if (b.y > h - m) ty = -1;
  if (!tx && !ty) return;
  const want = Math.atan2(ty || Math.sin(b.ang), tx || Math.cos(b.ang));
  let d = want - b.ang;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  b.ang += d * (k || 0.10);
}

function moveBug(b, dt, w, h) {
  if (b.kind === "ball") {
    // まっすぐ飛んで、枠に当たったら跳ね返る
    b.x += Math.cos(b.ang) * b.speed * dt;
    b.y += Math.sin(b.ang) * b.speed * dt;
    if (b.x < BALL_R) { b.x = BALL_R; b.ang = Math.PI - b.ang; }
    else if (b.x > w - BALL_R) { b.x = w - BALL_R; b.ang = Math.PI - b.ang; }
    if (b.y < BALL_R) { b.y = BALL_R; b.ang = -b.ang; }
    else if (b.y > h - BALL_R) { b.y = h - BALL_R; b.ang = -b.ang; }
    return;
  }

  if (b.kind === "butterfly") {
    b.ang += Math.sin(saverT * 0.72 + b.seed) * 0.65 * dt;
    b.phase += 6.2 * dt;
    steer(b, w, h, 0.055, 100);
    b.x += Math.cos(b.ang) * b.speed * dt;
    b.y += Math.sin(b.ang) * b.speed * dt;
    b.y += Math.sin(b.phase * 0.5 + b.seed) * 10 * dt;
    b.x = Math.min(Math.max(b.x, -90), w + 90);
    b.y = Math.min(Math.max(b.y, -90), h + 90);
    return;
  }

  // ムカデ。ゆっくり波打って進む
  b.ang += Math.sin(saverT * 1.1 + b.seed) * 1.2 * dt;
  b.phase += 9 * dt;
  steer(b, w, h);

  b.x += Math.cos(b.ang) * b.speed * dt;
  b.y += Math.sin(b.ang) * b.speed * dt;
  b.x = Math.min(Math.max(b.x, -40), w + 40);
  b.y = Math.min(Math.max(b.y, -40), h + 40);

  b.trail.unshift({ x: b.x, y: b.y });
  if (b.trail.length > 400) b.trail.pop();
}

/* ---- 出す・消す ---- */

function buildBugs(entry) {
  const svg = svgEl("svg", {});
  const w = window.innerWidth, h = window.innerHeight;
  saverBugs = [];

  const cols = Math.ceil(Math.sqrt(entry.count));
  const rows = Math.ceil(entry.count / cols);
  for (let i = 0; i < entry.count; i++) {
    const kind = entry.kind;
    const col = i % cols, row = Math.floor(i / cols);
    const g = svg.appendChild(svgEl("g", {}));
    const b = {
      kind, g,
      x: w * ((col + 1) / (cols + 1)), y: h * ((row + 1) / (rows + 1)),
      ang: rnd(0, Math.PI * 2), phase: rnd(0, 6.3), seed: rnd(0, 6.3),
      timer: rnd(0, 2), turn: rnd(-0.5, 0.5)
    };
    if (kind === "ball") {
      // 真横や真上に飛ぶと単調なので、その向きは外す
      b.ang = rnd(0.4, 1.2) + Math.floor(rnd(0, 4)) * (Math.PI / 2);
      b.speed = rnd(260, 430);
      b.parts = buildBall(g);
    } else if (kind === "butterfly") {
      b.speed = rnd(28, 42);
      b.parts = buildButterfly(g);
    } else {
      b.speed = rnd(45, 80);
      b.trail = [];
      b.parts = buildCentipede(g);
      for (let k = 0; k < 260; k++) {            // 最初から体がつながって見えるように
        b.trail.push({ x: b.x - Math.cos(b.ang) * k * 0.6, y: b.y - Math.sin(b.ang) * k * 0.6 });
      }
    }
    saverBugs.push(b);
  }

  saverEl.innerHTML = "";
  saverEl.appendChild(svg);
}

function stepSaver(now) {
  const dt = Math.min((now - saverLast) / 1000, 0.05);
  saverLast = now;
  saverT += dt;
  const w = window.innerWidth, h = window.innerHeight;

  saverBugs.forEach((b) => {
    moveBug(b, dt, w, h);
    if (b.kind === "ball") {
      b.g.setAttribute("transform", `translate(${b.x.toFixed(1)},${b.y.toFixed(1)})`);
    } else if (b.kind === "butterfly") {
      drawButterfly(b);
    } else {
      drawCentipede(b);                     // 節ごとに置くので群そのものは動かさない
    }
  });

  saverRAF = requestAnimationFrame(stepSaver);
}

function startSaver() {
  if (!saverEl.classList.contains("hidden")) return;
  const index = settings.saverIndex % SAVER_CYCLE.length;
  buildBugs(SAVER_CYCLE[index]);
  settings.saverIndex = (index + 1) % SAVER_CYCLE.length;
  saveSettings();
  saverEl.classList.remove("hidden");
  saverT = 0;
  saverLast = performance.now();
  saverRAF = requestAnimationFrame(stepSaver);
}

function stopSaver() {
  cancelAnimationFrame(saverRAF);
  saverRAF = 0;
  saverBugs = [];
  saverEl.innerHTML = "";
  saverEl.classList.add("hidden");
}

// 何か触ったら消す。そこから測り直す
const STOPPABLE = new Set(["mousedown", "pointerdown", "keydown", "touchstart"]);

function pokeSaver(e) {
  if (!saverEl.classList.contains("hidden")) {
    stopSaver();
    // 虫を消すための一押し。下の画面までは届かせない
    if (e && STOPPABLE.has(e.type)) {
      e.stopPropagation();
      if (e.cancelable) e.preventDefault();
    }
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startSaver, IDLE_MS);
}
// 押した・叩いたものは止められるように（passive にしない）
["mousedown", "pointerdown", "keydown", "touchstart"]
  .forEach((n) => window.addEventListener(n, pokeSaver, true));
// 動かしただけのものは止めようがない。時間を巻き直すだけ
["mousemove", "wheel", "touchmove"]
  .forEach((n) => window.addEventListener(n, pokeSaver, { capture: true, passive: true }));
pokeSaver();
</script>
</body>
