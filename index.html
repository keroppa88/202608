let rendering = 0;
// いま表に並べている銘柄。終値と四本値で別々に覚える
function curColumns() {
  return settings.sheetMode === "ohlc" ? settings.ohlcColumns : settings.columns;
}

async function render() {
  const mine = ++rendering;
  const year = String(settings.year);
  const ohlc = settings.sheetMode === "ohlc";
  modeEl.textContent = ohlc ? "四本値" : "終値";
  gridEl.innerHTML = '<div id="loading">読み込み中…</div>';
  statusEl.textContent = "";

  // 四本値のときは、四本値の揃っている銘柄だけを候補にする
  const all = await buildCatalog(year);
  const catalog = ohlc ? all.filter((c) => c.ohlc) : all;

  const keys = curColumns();
  const series = [];                 // 終値。チャートと移動平均に使う
  const bars = [];                   // 四本値
  for (const key of keys) {
    if (ohlc) {
      const b = await barsOf(key, year);
      bars.push(b);
      series.push(new Map([...b].map(([d, v]) => [d, v.close])));
    } else {
      series.push(await seriesOf(key, year));
    }
  }
  if (mine !== rendering) return;                 // 途中で年が変わったら捨てる

  const dates = new Set();
  series.forEach((m) => m.forEach((_, d) => dates.add(d)));
  const rows = [...dates].sort();                 // 上が過去、下が現在

  const table = document.createElement("table");

  // 幅は colgroup で決める（table-layout: fixed）
  const colgroup = document.createElement("colgroup");
  const addCol = (key) => {
    const c = document.createElement("col");
    c.style.width = widthOf(key) + "px";
    colgroup.appendChild(c);
    return c;
  };
  const dateCol = addCol(DATE_COL);
  // 四本値は1銘柄で4列。4列とも同じ幅で動かす
  const groupCols = keys.map((key) =>
    ohlc ? OHLC_FIELDS.map(() => addCol(ohlcWidthKey(key))) : [addCol(key)]
  );
  addCol("__plus__");
  table.appendChild(colgroup);

  const thead = document.createElement("thead");
  const htr = document.createElement("tr");
  const corner = document.createElement("th");
  corner.className = "corner";
  corner.textContent = "日付";
  corner.appendChild(makeGrip(DATE_COL, dateCol));
  htr.appendChild(corner);

  keys.forEach((key, i) => {
    const name = labelOf(key, all);

    // 四本値は 銘柄名 / 始値・高値・安値・終値 の2行。名前は4列とも出す
    const fields = ohlc ? OHLC_FIELDS : [null];
    fields.forEach((fld, j) => {
      const th = document.createElement("th");
      const wrap = document.createElement("div");
      wrap.className = "colhead";

      const sel = document.createElement("select");
      sel.className = "picker";
      sel.title = "銘柄を変える";
      {
        // 指で押すと × に当てにくいので、候補の筆頭にも削除を置く
        const kill = document.createElement("option");
        kill.value = DEL_VALUE;
        kill.textContent = "× 削除";
        sel.appendChild(kill);
      }
      // その年に値が無い銘柄も選び続けられるようにしておく
      if (!catalog.some((c) => c.key === key)) {
        const keep = document.createElement("option");
        keep.value = key;
        keep.textContent = name;
        sel.appendChild(keep);
      }
      // 分野ごとに見出しを付けて区切る
      let box = null, cur = null;
      catalog.forEach((c) => {
        if (c.group !== cur) {
          cur = c.group;
          box = document.createElement("optgroup");
          box.label = cur;
          sel.appendChild(box);
        }
        const o = document.createElement("option");
        o.value = c.key;
        o.textContent = c.label;
        box.appendChild(o);
      });
      sel.value = key;
      sel.addEventListener("change", () => {
        if (sel.value === DEL_VALUE) curColumns().splice(i, 1);
        else curColumns()[i] = sel.value;
        saveSettings();
        render();
      });

      const del = document.createElement("button");
      del.textContent = "×";
      del.title = "この列を消す";
      del.addEventListener("click", () => {
        curColumns().splice(i, 1);
        saveSettings();
        render();
      });

      const arrow = document.createElement("button");
      arrow.textContent = "▼";
      arrow.title = "銘柄を変える";

      // ▼ と選択を重ねる。▼を押すと候補が開く
      const pick = document.createElement("div");
      pick.className = "pickwrap";
      pick.append(arrow, sel);

      const ops = document.createElement("div");
      ops.className = "ops" + (j ? " blank" : "");   // 出すのは左端の1列だけ
      ops.append(del, pick);        // 名前の下に横並びで置く

      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = name;
      nameEl.title = "押すとチャート";
      // 名前を押すと、いま画面に出ている分のチャートを出す
      nameEl.addEventListener("click", () => openChartAt(i));

      wrap.appendChild(nameEl);
      if (fld) {
        const f = document.createElement("div");
        f.className = "field";
        f.textContent = fld.label;
        wrap.appendChild(f);
      }
      wrap.appendChild(ops);
      th.appendChild(wrap);
      // 取っ手は銘柄の右端に置く。掴むと4列とも同じ幅で動く
      if (j === fields.length - 1) {
        th.appendChild(makeGrip(ohlc ? ohlcWidthKey(key) : key, groupCols[i]));
      }
      htr.appendChild(th);
    });
  });

  const addTh = document.createElement("th");
  const add = document.createElement("button");
  add.className = "addcol";
  add.textContent = "＋";
  add.title = "列を足す";
  add.addEventListener("click", () => {
    const first = catalog.find((c) => !curColumns().includes(c.key));
    if (!first) return;
    curColumns().push(first.key);
    saveSettings();
    render();
  });
  addTh.appendChild(add);
  htr.appendChild(addTh);
  thead.appendChild(htr);

  const tbody = document.createElement("tbody");
  for (const d of rows) {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = d;
    tr.appendChild(th);
    keys.forEach((key, i) => {
      const b = ohlc ? bars[i].get(d) : null;
      (ohlc ? OHLC_FIELDS : [null]).forEach((fld) => {
        const td = document.createElement("td");
        const v = ohlc ? (b ? b[fld.f] : undefined) : series[i].get(d);
        if (v === undefined) { td.textContent = "#N/A"; td.className = "na"; }
        else td.textContent = fmt(v);
        tr.appendChild(td);
      });
    });
    tr.appendChild(document.createElement("td"));
    tbody.appendChild(tr);
  }

  table.append(thead, tbody);
  gridEl.innerHTML = "";
  gridEl.appendChild(table);
  statusEl.textContent = `${rows.length}日 × ${keys.length}銘柄`;
}

/* ---------------------------------------------------------------
   テクニカル画面。銘柄をひとつ選び、価格とそこから出した指標を
   表に並べる。同じものをチャートにする。

   表の作りは「表」の画面に合わせる。縦が日付で上が過去、見出しは
   上に指標の名前・下に細目、幅は取っ手で変えられる、無い値は #N/A。

   出すのは5年ぶん。指標はそれより前の価格も読んでから計算する。
   長期の移動平均は、助走が無いと年の頭が空になるため。
--------------------------------------------------------------- */
const techEl = document.getElementById("technical");
const tgridEl = document.getElementById("tgrid");
const tpickEl = document.getElementById("tpick");
const tyearEl = document.getElementById("tyear");
const tstatusEl = document.getElementById("tstatus");
const tparamsEl = document.getElementById("tparams");
const technicalWorkspaceEl = document.getElementById("technical-workspace");
const technicalTopEl = document.getElementById("technical-top");
const technicalSplitterEl = document.getElementById("technical-splitter");
let technicalSplitDrag = null;

function setTechnicalSplit(value, persist) {
  const available = Math.max(1, technicalWorkspaceEl.clientHeight - technicalSplitterEl.offsetHeight);
  const minPct = Math.max(20, Math.min(50, (120 / available) * 100));
  const maxPct = Math.min(80, Math.max(50, 100 - (150 / available) * 100));
  const pct = Math.max(minPct, Math.min(maxPct, Number(value) || 50));
  settings.technicalSplit = pct;
  technicalTopEl.style.flexBasis = `${pct}%`;
  technicalSplitterEl.setAttribute("aria-valuenow", String(Math.round(pct)));
  if (persist) saveSettings();
}

function moveTechnicalSplit(clientY) {
  const rect = technicalWorkspaceEl.getBoundingClientRect();
  const available = Math.max(1, rect.height - technicalSplitterEl.offsetHeight);
  setTechnicalSplit(((clientY - rect.top) / available) * 100, false);
}

technicalSplitterEl.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  technicalSplitDrag = e.pointerId;
  technicalSplitterEl.setPointerCapture(e.pointerId);
  moveTechnicalSplit(e.clientY);
  e.preventDefault();
});
technicalSplitterEl.addEventListener("pointermove", (e) => {
  if (technicalSplitDrag === e.pointerId) moveTechnicalSplit(e.clientY);
});
function finishTechnicalSplit(e) {
  if (technicalSplitDrag !== e.pointerId) return;
  if (technicalSplitterEl.hasPointerCapture(e.pointerId)) technicalSplitterEl.releasePointerCapture(e.pointerId);
  technicalSplitDrag = null;
  setTechnicalSplit(settings.technicalSplit, true);
}
technicalSplitterEl.addEventListener("pointerup", finishTechnicalSplit);
technicalSplitterEl.addEventListener("pointercancel", finishTechnicalSplit);
technicalSplitterEl.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  setTechnicalSplit(settings.technicalSplit + (e.key === "ArrowDown" ? 2 : -2), true);
  e.preventDefault();
});

const TECH_SPAN = 5;     // 表に出す年数
const TECH_WARM = 2;     // そのさらに前。指標の助走に使うだけで表には出さない

// 比べられる形に直した数字の設定値
const TECH_CHG = [5, 10, 20, 60, 100, 200];   // 騰落率を出す日数
const TECH_SLOPE = 5;                          // 移動平均の傾きは何日前と比べるか
const TECH_HV = 20;                            // ヒストリカルボラティリティの日数
const TECH_YEAR_N = 250;                       // 1年ぶんの営業日。高安の幅に使う
const TECH_YEAR_DAYS = 252;                    // 年率に直すときの営業日数

/* 数字の欄。名前・道筋・刻み・上下限。
   道筋は settings.techParams の中の場所 */
const TECH_FIELDS = [
  { g: "移動平均",     items: [["ma.0", "短期"], ["ma.1", "中期"], ["ma.2", "長期"]], min: 2, max: 400, int: true },
  { g: "ボリンジャー", items: [["bb.n", "期間"]], min: 2, max: 400, int: true,
    more: { items: [["bb.k1", "σ内"], ["bb.k2", "σ外"]], min: 0.1, max: 5, step: 0.1 } },
  { g: "パラボリック", items: [["sar.step", "刻み"], ["sar.max", "上限"]], min: 0.001, max: 1, step: 0.005 },
  { g: "RSI",          items: [["rsi", "期間"]], min: 2, max: 200, int: true },

/* ---- 指標の計算 ----------------------------------------------
   どれも配列で受けて配列で返す。出せない日は null。
   値が欠けている日をまたいだら、そこで助走をやり直す */

// 単純移動平均
function sma(v, n) {
  const out = new Array(v.length).fill(null);
  let s = 0, run = 0;
  for (let i = 0; i < v.length; i++) {
    const x = v[i];
    if (x === null || !isFinite(x)) { s = 0; run = 0; continue; }
    s += x; run++;
    if (run > n) s -= v[i - n];
    if (run >= n) out[i] = s / n;
  }
  return out;
}

// 指数移動平均。頭の n 本は単純平均で始める
function ema(v, n) {
  const out = new Array(v.length).fill(null);
  const k = 2 / (n + 1);
  let prev = null, run = 0;
  for (let i = 0; i < v.length; i++) {
    const x = v[i];
    if (x === null || !isFinite(x)) { prev = null; run = 0; continue; }
    run++;
    if (prev === null) {
      if (run < n) continue;
      let s = 0;
      for (let j = i - n + 1; j <= i; j++) s += v[j];
      prev = s / n;
    } else prev = x * k + prev * (1 - k);
    out[i] = prev;
  }
  return out;
}

// 標準偏差（母集団）
function stdevArr(v, n) {
  const out = new Array(v.length).fill(null);
  let run = 0;
  for (let i = 0; i < v.length; i++) {
    const x = v[i];
    if (x === null || !isFinite(x)) { run = 0; continue; }
    run++;
    if (run < n) continue;
    let s = 0;
    for (let j = i - n + 1; j <= i; j++) s += v[j];
    const m = s / n;
    let q = 0;
    for (let j = i - n + 1; j <= i; j++) q += (v[j] - m) * (v[j] - m);
    out[i] = Math.sqrt(q / n);
  }
  return out;
}

// RSI。値幅の平均はワイルダー式でならす
function rsiArr(v, n) {
  const out = new Array(v.length).fill(null);
  let up = 0, dn = 0, run = 0, ready = false;
  for (let i = 1; i < v.length; i++) {
    if (v[i] === null || v[i - 1] === null) { run = 0; ready = false; continue; }
    const d = v[i] - v[i - 1];
    const u = d > 0 ? d : 0, l = d < 0 ? -d : 0;
    run++;
    if (!ready) {
      up += u; dn += l;
      if (run < n) continue;
      up /= n; dn /= n; ready = true;
    } else {
      up = (up * (n - 1) + u) / n;
      dn = (dn * (n - 1) + l) / n;
    }
    out[i] = dn === 0 ? 100 : 100 - 100 / (1 + up / dn);
  }
  return out;
}

// ストキャス。%K は高値安値の幅の中で終値がどこにいるか。%D はその平均
function stochArr(rows, n, m) {
  const k = new Array(rows.length).fill(null);
  for (let i = n - 1; i < rows.length; i++) {
    let hh = -Infinity, ll = Infinity, ok = true;
    for (let j = i - n + 1; j <= i; j++) {
      const r = rows[j];
      if (r.h === null || r.l === null) { ok = false; break; }
      if (r.h > hh) hh = r.h;
      if (r.l < ll) ll = r.l;
    }
    if (!ok) continue;
    k[i] = hh === ll ? 100 : ((rows[i].c - ll) / (hh - ll)) * 100;
  }
  return { k, d: sma(k, m) };
}

// RCI。日付の順位と値段の順位のずれ。新しい日ほど順位が1
function rciArr(v, n) {
  const out = new Array(v.length).fill(null);
  const idx = new Array(n);
  for (let i = n - 1; i < v.length; i++) {
    let ok = true;
    for (let j = i - n + 1; j <= i; j++) if (v[j] === null) { ok = false; break; }
    if (!ok) continue;
    for (let j = 0; j < n; j++) idx[j] = i - n + 1 + j;
    const byPrice = idx.slice().sort((a, b) => v[b] - v[a]);
    let d = 0;
    byPrice.forEach((pos, rank) => {
      const t = i - pos + 1;            // 新しい日が1
      const e = t - (rank + 1);
      d += e * e;
    });
    out[i] = (1 - (6 * d) / (n * n * n - n)) * 100;
  }
  return out;
}

// パラボリック。上げの向きと下げの向きを、当たったところで入れ替える
function sarArr(rows, step, max) {
  const out = new Array(rows.length).fill(null);
  let up = true, sar = null, ep = 0, af = step;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (r.h === null || r.l === null) { sar = null; continue; }
    if (sar === null) {
      const p = rows[i - 1];
      if (!p || p.h === null || p.l === null) continue;   // 助走に前の日が要る
      up = r.c >= p.c;
      sar = up ? p.l : p.h;
      ep = up ? r.h : r.l;
      af = step;
      out[i] = sar;
      continue;
    }
    sar = sar + af * (ep - sar);
    const p1 = rows[i - 1], p2 = rows[i - 2];
    if (up) {
      let lo = p1.l;
      if (p2 && p2.l !== null && p2.l < lo) lo = p2.l;
      if (sar > lo) sar = lo;
      if (r.l < sar) { up = false; sar = ep; ep = r.l; af = step; }
      else if (r.h > ep) { ep = r.h; af = Math.min(max, af + step); }
    } else {
      let hi = p1.h;
      if (p2 && p2.h !== null && p2.h > hi) hi = p2.h;
      if (sar < hi) sar = hi;
      if (r.h > sar) { up = true; sar = ep; ep = r.h; af = step; }
      else if (r.l < ep) { ep = r.l; af = Math.min(max, af + step); }
    }
    out[i] = sar;
  }
  return out;
}

// パラボリックの向き。売買の成績を測るときに使う。1が上げ、-1が下げ
function sarSide(rows, step, max) {
  const out = new Array(rows.length).fill(0);
  let up = true, sar = null, ep = 0, af = step;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (r.h === null || r.l === null) { sar = null; continue; }
    if (sar === null) {
      const p = rows[i - 1];
      if (!p || p.h === null || p.l === null) continue;
      up = r.c >= p.c; sar = up ? p.l : p.h; ep = up ? r.h : r.l; af = step;
      out[i] = up ? 1 : -1;
      continue;
    }
    sar = sar + af * (ep - sar);
    const p1 = rows[i - 1], p2 = rows[i - 2];
    if (up) {
      let lo = p1.l;
      if (p2 && p2.l !== null && p2.l < lo) lo = p2.l;
      if (sar > lo) sar = lo;
      if (r.l < sar) { up = false; sar = ep; ep = r.l; af = step; }
      else if (r.h > ep) { ep = r.h; af = Math.min(max, af + step); }
    } else {
      let hi = p1.h;
      if (p2 && p2.h !== null && p2.h > hi) hi = p2.h;
      if (sar < hi) sar = hi;
      if (r.h > sar) { up = true; sar = ep; ep = r.h; af = step; }
      else if (r.l < ep) { ep = r.l; af = Math.min(max, af + step); }
    }
    out[i] = up ? 1 : -1;
  }
  return out;
}

// ATR をパーセントで。値幅の平均はワイルダー式
function atrArr(rows, n) {
  const out = new Array(rows.length).fill(null);
  let a = null, run = 0;
  const tr = new Array(rows.length).fill(null);
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (r.h === null || r.l === null) continue;
    if (i === 0) { tr[i] = r.h - r.l; continue; }
    const pc = rows[i - 1].c;
    tr[i] = Math.max(r.h - r.l, Math.abs(r.h - pc), Math.abs(r.l - pc));
  }
  for (let i = 0; i < tr.length; i++) {
    if (tr[i] === null) { a = null; run = 0; continue; }
    run++;
    if (a === null) {
      if (run < n) continue;
      let s = 0;
      for (let j = i - n + 1; j <= i; j++) s += tr[j];
      a = s / n;
    } else a = (a * (n - 1) + tr[i]) / n;
    if (rows[i].c) out[i] = (a / rows[i].c) * 100;
  }
  return out;
}

// 日数や向き、出来高は整数。小数は出さない
function fmtInt(v) {
  const n = Number(v);
  if (!isFinite(n)) return v;
  return Math.round(n).toLocaleString("ja-JP");
}

/* ---- 比べられる形に直した数字 ---------------------------------
   値段の桁は銘柄ごとに違う。%・比・日数・±1 にそろえておくと、
   桁の違う銘柄を並べたまま読める */

// n日前と比べて何%動いたか
function chgPct(v, n) {
  return v.map((x, i) => {
    const p = v[i - n];
    return (i < n || x === null || p === null || !p) ? null : (x / p - 1) * 100;
  });
}

// 連騰・連落。上げ続けなら +、下げ続けなら −
function runLength(v) {
  const out = new Array(v.length).fill(null);
  let n = 0;
  for (let i = 1; i < v.length; i++) {
    if (v[i] === null || v[i - 1] === null) { n = 0; out[i] = null; continue; }
    const d = Math.sign(v[i] - v[i - 1]);
    if (d === 0) n = 0;
    else if (Math.sign(n) === d) n += d;
    else n = d;
    out[i] = n;
  }
  return out;
}

// 向きが変わってから何日たったか。上向きなら +、下向きなら −
function sinceFlip(side) {
  const out = new Array(side.length).fill(null);
  let cur = 0, n = 0;
  for (let i = 0; i < side.length; i++) {
    const s = side[i];
    if (!s) { out[i] = null; continue; }
    if (s !== cur) { cur = s; n = 0; }
    n++;
    out[i] = cur * n;
  }
  return out;
}

// 2本の線のどちらが上か。上なら +1、下なら −1、出せない日は 0
function sideOf(a, b) {
  return a.map((v, i) => (v === null || b[i] === null) ? 0 : (v > b[i] ? 1 : -1));
}

// 上下のしきい値で向きを決め、次のしきい値まで持ち越す
function sideHold(v, lo, hi) {
  const out = new Array(v.length).fill(0);
  let s = 0;
  for (let i = 0; i < v.length; i++) {
    if (v[i] !== null) {
      if (v[i] <= lo) s = 1;
      else if (v[i] >= hi) s = -1;
    }
    out[i] = s;
  }
  return out;
}

// n日の高値・安値。終値で見る。四本値の無い銘柄でも出せる
function rollHi(v, n) {
  const out = new Array(v.length).fill(null);
  for (let i = n - 1; i < v.length; i++) {
    let hi = -Infinity, ok = true;
    for (let j = i - n + 1; j <= i; j++) {
      if (v[j] === null) { ok = false; break; }
      if (v[j] > hi) hi = v[j];
    }
    if (ok) out[i] = hi;
  }
  return out;
}
function rollLo(v, n) {
  const out = new Array(v.length).fill(null);
  for (let i = n - 1; i < v.length; i++) {
    let lo = Infinity, ok = true;
    for (let j = i - n + 1; j <= i; j++) {
      if (v[j] === null) { ok = false; break; }
      if (v[j] < lo) lo = v[j];
    }
    if (ok) out[i] = lo;
  }
  return out;
}

// ヒストリカルボラティリティ。日々の値動きのばらつきを年率の%にする
function hvPct(v, n) {
  const r = v.map((x, i) => (i === 0 || x === null || v[i - 1] === null || x <= 0 || v[i - 1] <= 0)
    ? null : Math.log(x / v[i - 1]));
  const out = new Array(v.length).fill(null);
  let run = 0;
  for (let i = 0; i < r.length; i++) {
    if (r[i] === null) { run = 0; continue; }
    run++;
    if (run < n) continue;
    let s = 0;
    for (let j = i - n + 1; j <= i; j++) s += r[j];
    const m = s / n;
    let q = 0;
    for (let j = i - n + 1; j <= i; j++) q += (r[j] - m) * (r[j] - m);
    out[i] = Math.sqrt(q / (n - 1)) * Math.sqrt(TECH_YEAR_DAYS) * 100;
  }
  return out;
}

// 全部まとめて出す
function techIndicators(rows, p) {
  const c = rows.map((r) => r.c);
  const out = {
    o: rows.map((r) => r.o), h: rows.map((r) => r.h),
    l: rows.map((r) => r.l), c,
    vol: rows.map((r) => r.v)
  };

  // 出来高。20日平均と比べる
  {
    const av = sma(out.vol, 20);
    out.volR = out.vol.map((v, i) => (v === null || av[i] === null || !av[i]) ? null : (v / av[i]) * 100);
  }

  // 騰落率と連騰連落
  TECH_CHG.forEach((n) => { out["chg" + n] = chgPct(c, n); });
  out.run = runLength(c);

  // 移動平均・乖離・傾き・並び
  p.ma.forEach((n, j) => {
    const m = sma(c, n);
    out["ma" + j] = m;
    out["dev" + j] = m.map((v, i) => (v === null || !v) ? null : ((c[i] - v) / v) * 100);
    out["slope" + j] = chgPct(m, TECH_SLOPE);
  });
  out.order = c.map((_, i) => {
    const a = out.ma0[i], b = out.ma1[i], d = out.ma2[i];
    if (a === null || b === null || d === null) return null;
    if (a > b && b > d) return 1;
    if (a < b && b < d) return -1;
    return 0;
  });

  // ボリンジャー。帯そのものと、帯の中の位置・帯の広さ
  const mid = sma(c, p.bb.n), sd = stdevArr(c, p.bb.n);
  const band = (k) => mid.map((m, i) => (m === null || sd[i] === null) ? null : m + k * sd[i]);
  out.bbMid = mid;
  out.bbU2 = band(p.bb.k2); out.bbU1 = band(p.bb.k1);
  out.bbL1 = band(-p.bb.k1); out.bbL2 = band(-p.bb.k2);
  out.bbB = c.map((v, i) => {
    const u = out.bbU2[i], d = out.bbL2[i];
    return (u === null || d === null || u === d) ? null : ((v - d) / (u - d)) * 100;
  });
  out.bbW = mid.map((m, i) => {
    const u = out.bbU2[i], d = out.bbL2[i];
    return (m === null || u === null || d === null || !m) ? null : ((u - d) / m) * 100;
  });

  out.sar = sarArr(rows, p.sar.step, p.sar.max);
  out.rsi = rsiArr(c, p.rsi);
  const st = stochArr(rows, p.stoch.k, p.stoch.d);
  out.stK = st.k; out.stD = st.d;
  out.rci0 = rciArr(c, p.rci[0]);
  out.rci1 = rciArr(c, p.rci[1]);

  const ef = ema(c, p.macd.fast), es = ema(c, p.macd.slow);
  const line = c.map((_, i) => (ef[i] === null || es[i] === null) ? null : ef[i] - es[i]);
  const sig = ema(line, p.macd.sig);
  out.macd = line;
  out.macdS = sig;
  out.macdH = line.map((v, i) => (v === null || sig[i] === null) ? null : v - sig[i]);
  out.macdHR = out.macdH.map((v, i) => (v === null || !c[i]) ? null : (v / c[i]) * 100);

  // ばらつき
  out.atr = atrArr(rows, p.atr);
  out.hv = hvPct(c, TECH_HV);

  // 位置。1年の高安の中でどこにいるか、その日の高安の中でどこで引けたか
  const hi = rollHi(c, TECH_YEAR_N), lo = rollLo(c, TECH_YEAR_N);
  out.pos52 = c.map((v, i) => (hi[i] === null || lo[i] === null || hi[i] === lo[i])
    ? null : ((v - lo[i]) / (hi[i] - lo[i])) * 100);
  out.fromHi = c.map((v, i) => (hi[i] === null || !hi[i]) ? null : (v / hi[i] - 1) * 100);
  out.fromLo = c.map((v, i) => (lo[i] === null || !lo[i]) ? null : (v / lo[i] - 1) * 100);
  out.posDay = rows.map((r) => (r.h === null || r.l === null || r.h === r.l)
    ? null : ((r.c - r.l) / (r.h - r.l)) * 100);

  // その日の形
  out.gap = rows.map((r, i) => (r.o === null || i === 0 || !rows[i - 1].c)
    ? null : (r.o / rows[i - 1].c - 1) * 100);
  out.range = rows.map((r) => (r.h === null || r.l === null || !r.c)
    ? null : ((r.h - r.l) / r.c) * 100);

  // 向きが変わってからの日数。上向きが +、下向きが −
  out.dMaS = sinceFlip(sideOf(out.ma0, out.ma1));
  out.dMaL = sinceFlip(sideOf(out.ma1, out.ma2));
  out.dMacd = sinceFlip(sideOf(out.macd, out.macdS));
  out.dSar = sinceFlip(sarSide(rows, p.sar.step, p.sar.max));
  out.dStoch = sinceFlip(sideOf(out.stK, out.stD));
  out.dRsi = sinceFlip(sideHold(out.rsi, 30, 70));
  return out;
}

/* ---- 自動で数字を選ぶ ------------------------------------------
   出ている5年で総当たりして、成績のいちばん良かった数字を入れる。
   成績は「その日の持ち方 × 次の日までの値動き」の積み上げ（対数）。
   過去に当てはめた数字であって、先を当てるものではない */

// 持ち方（1が買い持ち、-1が売り持ち、0が何もしない）から成績を出す
function score(side, ret, from, to) {
  let s = 0;
  for (let i = from; i < to; i++) {
    const p = side[i];
    if (p && ret[i] !== null) s += p * ret[i];
  }
  return s;
}

// 上と下のしきい値で入って出る形。逆張り
function sideBand(v, lo, hi) {
  const out = new Array(v.length).fill(0);
  let pos = 0;
  for (let i = 0; i < v.length; i++) {
    if (v[i] !== null) {
      if (v[i] <= lo) pos = 1;
      else if (v[i] >= hi) pos = 0;
    }
    out[i] = pos;
  }
  return out;
}

function techAutoFit(rows, from, to, p) {
  const c = rows.map((r) => r.c);
  const ret = c.map((v, i) => (i + 1 < c.length && c[i + 1] > 0 && v > 0) ? Math.log(c[i + 1] / v) : null);
  const best = (list, make) => {
    let top = null;
    for (const a of list) {
      const s = score(make(a), ret, from, to);
      if (top === null || s > top.s) top = { s, a };
    }
    return top ? top.a : null;
  };
  const range = (a, b, st) => {
    const out = [];
    for (let v = a; v <= b + 1e-9; v += st) out.push(Math.round(v * 1000) / 1000);
    return out;
  };
  const next = JSON.parse(JSON.stringify(p));

  // 移動平均。短期・中期・長期の3つを、それぞれの持ち場で探す
  //   終値が線の上なら買い持ち、下なら売り持ち
  const maSide = (n) => {
    const m = sma(c, n);
    return m.map((v, i) => v === null ? 0 : (c[i] > v ? 1 : -1));
  };
  next.ma = [
    best(range(3, 30, 1), maSide),
    best(range(20, 100, 2), maSide),
    best(range(60, 250, 5), maSide)
  ];

  // ボリンジャー。下の帯に触れたら買い、上の帯まで持つ
  {
    let top = null;
    for (const n of range(5, 100, 5)) {
      const m = sma(c, n), sd = stdevArr(c, n);
      for (const k of range(1, 3, 0.1)) {
        const side = new Array(c.length).fill(0);
        let pos = 0;
        for (let i = 0; i < c.length; i++) {
          if (m[i] !== null && sd[i] !== null) {
            if (c[i] <= m[i] - k * sd[i]) pos = 1;
            else if (c[i] >= m[i] + k * sd[i]) pos = 0;
          }
          side[i] = pos;
        }
        const s = score(side, ret, from, to);
        if (top === null || s > top.s) top = { s, n, k };
      }
    }
    if (top) { next.bb.n = top.n; next.bb.k2 = top.k; next.bb.k1 = Math.round(top.k * 50) / 100; }
  }

  // パラボリック。向きが変わるたびに入れ替える
  {
    let top = null;
    for (const st of range(0.005, 0.05, 0.005)) {
      for (const mx of range(0.1, 0.5, 0.05)) {
        const s = score(sarSide(rows, st, mx), ret, from, to);
        if (top === null || s > top.s) top = { s, st, mx };
      }
    }
    if (top) { next.sar.step = top.st; next.sar.max = top.mx; }
  }

  // RSI。30割れで買い、70超えで手仕舞い
  next.rsi = best(range(2, 60, 1), (n) => sideBand(rsiArr(c, n), 30, 70));

  // ストキャス。20割れで買い、80超えで手仕舞い
  {
    let top = null;
    for (const k of range(3, 30, 1)) {
      const st = stochArr(rows, k, 3);
      for (const d of range(2, 10, 1)) {
        const line = d === 3 ? st.d : sma(st.k, d);
        const s = score(sideBand(line, 20, 80), ret, from, to);
        if (top === null || s > top.s) top = { s, k, d };
      }
    }
    if (top) { next.stoch.k = top.k; next.stoch.d = top.d; }
  }

  // RCI。-80割れで買い、+80超えで手仕舞い。短期と長期を別々に探す
  next.rci = [
    best(range(5, 30, 1), (n) => sideBand(rciArr(c, n), -80, 80)),
    best(range(26, 120, 2), (n) => sideBand(rciArr(c, n), -80, 80))
  ];

  // MACD。シグナルの上なら買い持ち、下なら売り持ち
  {
    const memo = new Map();
    const emaOf = (n) => {
      if (!memo.has(n)) memo.set(n, ema(c, n));
      return memo.get(n);
    };
    let top = null;
    for (const f of range(5, 20, 1)) {
      for (const sl of range(20, 60, 2)) {
        if (sl <= f) continue;
        const ef = emaOf(f), es = emaOf(sl);
        const line = c.map((_, i) => (ef[i] === null || es[i] === null) ? null : ef[i] - es[i]);
        for (const g of range(5, 15, 1)) {
          const sig = ema(line, g);
          const side = line.map((v, i) => (v === null || sig[i] === null) ? 0 : (v > sig[i] ? 1 : -1));
          const s = score(side, ret, from, to);
          if (top === null || s > top.s) top = { s, f, sl, g };
        }
      }
    }
    if (top) { next.macd.fast = top.f; next.macd.slow = top.sl; next.macd.sig = top.g; }
  }

  // ATR% は売買の形にならないので、ここでは動かさない
  return next;
}

/* ---- 数字の欄 ------------------------------------------------- */
function paramGet(p, path) {
  return path.split(".").reduce((o, k) => o[k], p);
}
function paramSet(p, path, v) {
  const ks = path.split(".");
  const last = ks.pop();
  ks.reduce((o, k) => o[k], p)[last] = v;
}

function drawTechParams() {
  tparamsEl.innerHTML = "";
  const p = settings.techParams;
  TECH_FIELDS.forEach((g) => {
    const box = document.createElement("div");
    box.className = "tp";
    const lab = document.createElement("span");
    lab.className = "tpname";
    lab.textContent = g.g;
    box.appendChild(lab);
    const add = (items, min, max, step, int) => {
      items.forEach(([path, name]) => {
        const one = document.createElement("label");
        one.className = "tpone";
        one.title = name;
        const inp = document.createElement("input");
        inp.type = "number";
        inp.min = String(min);
        inp.max = String(max);
        inp.step = String(step);
        inp.value = String(paramGet(p, path));
        inp.addEventListener("change", () => {
          let v = Number(inp.value);
          if (!isFinite(v)) v = paramGet(p, path);
          if (int) v = Math.round(v);
          v = Math.min(max, Math.max(min, v));
          inp.value = String(v);
          paramSet(settings.techParams, path, v);
          saveSettings();
          drawTechnical();
        });
        one.append(document.createTextNode(name), inp);
        box.appendChild(one);
      });
    };
    add(g.items, g.min, g.max, g.step || 1, g.int);
    if (g.more) add(g.more.items, g.more.min, g.more.max, g.more.step, false);
    tparamsEl.appendChild(box);
  });
}

/* ---- 読み込み ------------------------------------------------- */
// 表に出す5年と、その前の助走ぶんをまとめて読む
async function techRows(key, endYear, span) {
  const seen = new Map();
  const years = span === undefined ? TECH_SPAN : span;
  for (let y = Number(endYear) - years - TECH_WARM + 1; y <= Number(endYear); y++) {
    const ys = String(y);
    const close = await seriesOf(key, ys);
    const bars = await barsOf(key, ys);
    const vols = await volumeOf(key, ys);
    const days = [...new Set([...close.keys(), ...bars.keys()])];
    for (const d of days) {
      if (!d.startsWith(ys)) continue;
      const b = bars.get(d);
      const c = b ? Number(b.close) : Number(close.get(d));
      if (!isFinite(c)) continue;
      seen.set(d, {
        d, c,
        o: b ? Number(b.open) : null,
        h: b ? Number(b.high) : null,
        l: b ? Number(b.low) : null,
        v: vols.has(d) ? vols.get(d) : null
      });
    }
  }
  return [...seen.values()].sort((a, b) => a.d < b.d ? -1 : 1);
}

function drawTechTable(at, days, ind, p) {

  corner.textContent = "日付";
  corner.appendChild(makeGrip(DATE_COL, dateCol));
  htr.appendChild(corner);

  cols.forEach((c, i) => {

    th.appendChild(wrap);

    });

  tbody.innerHTML = html.join("");

  table.append(thead, tbody);
  tgridEl.innerHTML = "";
  tgridEl.appendChild(table);
}

/* ---- チャートの部品 -------------------------------------------
   枚数が変わっても横軸はそろえてある */
/* 横軸の目盛。5年ぶんに月の数字を並べると潰れるので、線は月ごと・
   数字は年の変わり目だけにする。年が2つまでなら月の数字を出す */
function techAxis(days, x, T, ih) {
  const out = [];
  const years = new Set(days.map((d) => d.slice(0, 4))).size;
  let pm = "", py = "";
  days.forEach((d, i) => {
    const m = d.slice(0, 7);
    if (m === pm) return;
    pm = m;
    const px = x(i);
    out.push(`<line x1="${px}" y1="${T}" x2="${px}" y2="${T + ih}" class="vline"/>`);
    if (years > 2) {
      const yy = d.slice(0, 4);
      if (yy === py) return;
      py = yy;
      out.push(`<text x="${px}" y="${T + ih + 18}" class="lab" text-anchor="middle">${yy}</text>`);
    } else {
      out.push(`<text x="${px}" y="${T + ih + 18}" class="lab" text-anchor="middle">${Number(d.slice(5, 7))}</text>`);
    }
  });
  return out;
}

function techLegend(cap, items) {
  const tail = items.map((t) => `<span style="color:${t[1]}">${t[0]}</span>`).join("　");
  if (!tail) return cap;
  return cap ? `${cap}　${tail}` : tail;
}

function techPanel(cap, days, spec, size) {
  const { iw, ih, T, B, R } = size;
  const vals = [];
  const push = (v) => { if (v !== null && v !== undefined && isFinite(v)) vals.push(v); };
  (spec.lines || []).forEach((ln) => ln.vals.forEach(push));
  (spec.dots || []).forEach(push);
  (spec.hist || []).forEach(push);
  (spec.bars || []).forEach((b) => { if (b) { push(b.h); push(b.l); } });
  if (!vals.length) return null;
  if (spec.hist) vals.push(0);
  (spec.guides || []).forEach(push);

  const sc = spec.fix || scaleOf(Math.min(...vals), Math.max(...vals));
  const W = iw + AXIS_L + R, H = ih + T + B;
  const x = (i) => AXIS_L + (days.length === 1 ? iw / 2 : (iw * i) / (days.length - 1));
  const y = (v) => T + ih - (ih * (v - sc.bottom)) / (sc.top - sc.bottom);

  const parts = techAxis(days, x, T, ih).concat(priceLines(sc, y, iw));
  (spec.guides || []).forEach((g) => {
    const py = y(g).toFixed(1);
    parts.push(`<line x1="${AXIS_L}" y1="${py}" x2="${AXIS_L + iw}" y2="${py}" class="tguide"/>`);
  });
  parts.push(`<rect x="${AXIS_L}" y="${T}" width="${iw}" height="${ih}" class="axis"/>`);

  if (spec.hist) {
    const cw = Math.max(1, Math.min(9, (iw / days.length) * 0.7));
    const y0 = y(0);
    spec.hist.forEach((v, i) => {
      if (v === null || !isFinite(v)) return;
      const py = y(v);
      parts.push(`<rect x="${(x(i) - cw / 2).toFixed(1)}" y="${Math.min(py, y0).toFixed(1)}"`
        + ` width="${cw.toFixed(1)}" height="${Math.max(0.6, Math.abs(py - y0)).toFixed(1)}" class="thist"/>`);
    });
  }

  if (spec.bars) {
    const cw = Math.max(1, Math.min(9, (iw / days.length) * 0.7));
    spec.bars.forEach((b, i) => {
      if (!b) return;
      const px = x(i);
      parts.push(`<line x1="${px.toFixed(1)}" y1="${y(b.h).toFixed(1)}" x2="${px.toFixed(1)}" y2="${y(b.l).toFixed(1)}" class="cs"/>`);
      const top = y(Math.max(b.o, b.c));
      const hgt = Math.max(1, Math.abs(y(b.o) - y(b.c)));
      parts.push(`<rect x="${(px - cw / 2).toFixed(1)}" y="${top.toFixed(1)}"`
        + ` width="${cw.toFixed(1)}" height="${hgt.toFixed(1)}" class="cs${b.c < b.o ? " dn" : ""}"/>`);
    });
  }

  (spec.lines || []).forEach((ln) => {
    let d = "", pen = false;
    ln.vals.forEach((v, i) => {
      if (v === null || v === undefined || !isFinite(v)) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    if (d) {
      parts.push(`<path d="${d}" class="plot" stroke="${ln.color}"`
        + (ln.dash ? ` stroke-dasharray="${ln.dash}"` : "") + "/>");
    }
  });

  const r = days.length > 600 ? 0.8 : 1.4;      // 日数が多いと点が潰れる
  (spec.dots || []).forEach((v, i) => {
    if (v === null || !isFinite(v)) return;
    parts.push(`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${r}"`
      + ` class="tdot" fill="${spec.dotColor || "var(--fg2)"}"/>`);
  });

  const box = document.createElement("div");
  box.className = "one-chart";
  box.innerHTML = (cap ? `<div class="cap">${cap}</div>` : "")
    + `<svg width="${W}" height="${H}">${parts.join("")}</svg>`;
  return box;
}

/* ---- チャート（ポップアップ）----------------------------------
   画面に出ているのは表だけ。見出しを押すとここが開く。

   価格を押すとローソク足だけ。終値しか無い銘柄は折れ線。
   ほかの指標を押すと、その指標とローソク足。
   枠の上の箱にチェックを入れれば、ほかの指標も足せる。

   描く場所は 1 : 1.62。下に付く指標の枠はその4割の高さで、
   横幅は価格とそろえる */
const techChartEl = document.getElementById("techchart");

// 指標のまとまり。over は価格に重ねる、panel は下に別の枠で置く
const TECH_SHOWS = [
  { id: "ma",     name: "移動平均",      kind: "over" },
  { id: "bb",     name: "ボリンジャー",  kind: "over" },
  { id: "sar",    name: "パラボリック",  kind: "over" },
  { id: "volume", name: "出来高",        kind: "panel" },
  { id: "chg",    name: "騰落率%",       kind: "panel" },
  { id: "dev",    name: "移動平均乖離%", kind: "panel" },
  { id: "rsi",    name: "RSI",           kind: "panel" },
  { id: "stoch",  name: "ストキャス",    kind: "panel" },
  { id: "rci",    name: "RCI",           kind: "panel" },
  { id: "macd",   name: "MACD",          kind: "panel" },
  { id: "risk",   name: "ばらつき%",     kind: "panel" },
  { id: "pos",    name: "位置",          kind: "panel" },
  { id: "hilo",   name: "高安から%",     kind: "panel" },
  { id: "days",   name: "経過日数",      kind: "panel" },
  { id: "day",    name: "その日",        kind: "panel" }
];

// いま出している指標。開くたびに、押した指標ひとつだけに戻す
let techShow = new Set();

// チャートの箱は指標と比較で使い回す。どちらを出しているか
let techChartMode = "ind";

function redrawTechChart() {
  if (techChartMode === "comp") drawTechCompChart();
  else drawTechChart();
}

function openTechChart(id) {
  if (!techState) return;
  techChartMode = "ind";
  techShow = new Set(id && id !== "price" ? [id] : []);
  drawTechChart();
  techChartEl.classList.remove("hidden");
}
function closeTechChart() {
  techChartEl.classList.add("hidden");
  techChartEl.innerHTML = "";
}

function drawTechChart() {
  if (!techState) return;
  const { at, days, rows, ind, p, name } = techState;
  const cut = (arr) => at.map((i) => arr[i]);
  const dim = "var(--dim)";
  const subs = TECH_SHOWS.filter((s) => s.kind === "panel" && techShow.has(s.id));

  // 価格の描画部分を 1 : 1.62 にして、下の枠はその4割。
  // 全部が画面に収まる高さから割り出す。ホイールで伸び縮みする
  const T = 8, B = 24, R = 6, RATIO = 1.62, SUB = 0.4;
  // 上の名前と箱の並び、枠ごとの見出しのぶんを先に取っておく
  const avail = window.innerHeight - 190 - subs.length * 30;
  // 枠が増えても価格のチャートは痩せさせない。入りきらない分は箱を動かす
  let ih = Math.round((avail - (subs.length + 1) * (T + B)) / (1 + subs.length * SUB));
  ih = Math.max(260, Math.round(ih * settings.techZoom));
  let iw = Math.round(ih * RATIO);
  const maxIW = Math.round(window.innerWidth * 0.94) - AXIS_L - R - 20;
  if (iw > maxIW && settings.techZoom <= 1) { iw = maxIW; ih = Math.round(iw / RATIO); }
  const base = { iw, ih, T, B, R };
  const small = { iw, ih: Math.max(70, Math.round(ih * SUB)), T, B, R };

  const body = document.createElement("div");
  body.className = "canvas tcbody";
  const put = (el) => { if (el) body.appendChild(el); };

  /* 価格。四本値が全部そろっていればローソク足だけ。
     1日でも欠けていると足が飛び飛びになって形が読めないので、
     そのときは終値の線を通す。足のある日はその上に重ねる。
     四本値が1日も無ければ線だけ */
  const bars = at.map((i) => rows[i].h === null ? null
    : { o: rows[i].o, h: rows[i].h, l: rows[i].l, c: rows[i].c });
  const have = bars.reduce((n, b) => b ? n + 1 : n, 0);
  const over = [], tags = [];
  if (have < days.length) over.push({ vals: cut(ind.c), color: "var(--fg)" });
  if (techShow.has("ma")) {
    p.ma.forEach((n, j) => {
      over.push({ vals: cut(ind["ma" + j]), color: seriesColor(j) });
      tags.push([`${n}MA`, seriesColor(j)]);
    });
  }
  if (techShow.has("bb")) {
    ["bbU2", "bbU1", "bbL1", "bbL2"].forEach((k, j) => {
      over.push({ vals: cut(ind[k]), color: dim, dash: j === 1 || j === 2 ? "2 4" : "4 3" });
    });
    tags.push([`ボリンジャー${p.bb.n} ±${p.bb.k1}σ ±${p.bb.k2}σ`, dim]);
  }
  const sar = techShow.has("sar");
  if (sar) tags.push([`パラボリック ${p.sar.step}/${p.sar.max}`, seriesColor(3)]);
  put(techPanel(techLegend("", tags), days, {
    lines: over,
    bars: have ? bars : null,
    dots: sar ? cut(ind.sar) : null,
    dotColor: seriesColor(3)
  }, base));

  // 下に付く枠。押した順ではなく、いつも同じ並びで出す
  const line = (k, j) => ({ vals: cut(ind[k]), color: seriesColor(j) });
  const many = (cap, keys, names, more) => {
    const spec = { lines: keys.map(line) };
    Object.assign(spec, more || {});
    return techPanel(techLegend(cap, names.map((n, j) => [n, seriesColor(j)])), days, spec, small);
  };
  const PANEL = {
    volume: () => techPanel("出来高", days, { hist: cut(ind.vol) }, small),
    chg: () => many("騰落率%", TECH_CHG.map((n) => "chg" + n), TECH_CHG.map(String), { guides: [0] }),
    dev: () => many("移動平均乖離%", ["dev0", "dev1", "dev2"], p.ma.map(String), { guides: [0] }),
    rsi: () => techPanel(`RSI ${p.rsi}`, days, {
      lines: [line("rsi", 0)], guides: [30, 70], fix: { bottom: 0, top: 100, step: 20 }
    }, small),
    stoch: () => many(`ストキャス ${p.stoch.k}/${p.stoch.d}`, ["stK", "stD"], ["%K", "%D"],
      { guides: [20, 80], fix: { bottom: 0, top: 100, step: 20 } }),
    rci: () => many("RCI", ["rci0", "rci1"], p.rci.map(String),
      { guides: [-80, 0, 80], fix: { bottom: -100, top: 100, step: 50 } }),
    macd: () => many(`MACD ${p.macd.fast}/${p.macd.slow}/${p.macd.sig}`, ["macd", "macdS"],
      ["MACD", "シグナル"], { hist: cut(ind.macdH), guides: [0] }),
    risk: () => many("ばらつき%", ["atr", "hv", "bbW"],
      [`ATR${p.atr}`, `HV${TECH_HV}`, "バンド幅"]),
    pos: () => many("位置", ["bbB", "pos52", "posDay"],
      ["%B", `${TECH_YEAR_N}日レンジ`, "その日"], { guides: [0, 50, 100] }),
    hilo: () => many("高安から%", ["fromHi", "fromLo"],
      [`${TECH_YEAR_N}日高値`, `${TECH_YEAR_N}日安値`], { guides: [0] }),
    days: () => many("経過日数", ["dMaS", "dMaL", "dMacd", "dSar", "dStoch", "dRsi"],
      [`移動平均${p.ma[0]}×${p.ma[1]}`, `移動平均${p.ma[1]}×${p.ma[2]}`,
       "MACD", "パラボリック", "ストキャス", "RSI"], { guides: [0] }),
    day: () => many("その日", ["gap", "range"], ["ギャップ%", "値幅%"], { guides: [0] })
  };
  subs.forEach((s) => put(PANEL[s.id]()));

  const picks = TECH_SHOWS.map((s) =>
    `<label><input type="checkbox" data-show="${s.id}"${techShow.has(s.id) ? " checked" : ""}>`
    + `<span class="bx"></span>${s.name}</label>`).join("");

  const box = document.createElement("div");
  box.className = "box";
  box.style.width = (iw + AXIS_L + R + 8 * 2 + 2 * 2) + "px";
  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML = `<div class="left"><span class="nm">${name}</span>`
    + `<span class="sub">${days[0]} 〜 ${days[days.length - 1]}　${days.length}日</span></div>`
    + `<div class="pick">${picks}</div>`;
  box.append(head, body);
  techChartEl.innerHTML = "";
  techChartEl.appendChild(box);

  box.querySelectorAll("input[data-show]").forEach((el) => {
    el.addEventListener("change", () => {
      if (el.checked) techShow.add(el.dataset.show);
      else techShow.delete(el.dataset.show);
      drawTechChart();
    });
  });
}

/* ---- 銘柄を選ぶ窓 ----------------------------------------------

   並びが変わったときだけ true を返す（変わらなければ引き直さない） */
function corrPutFirst(key) {
  if (!key) return false;
  const was = settings.corrColumns.join("\n");

  settings.corrAiMain = key;

}

/* ---- 相関係数表 ------------------------------------------------
   主要指数などとの相関を出す。日次で並べる。相関は窓の長さぶんを
   まとめた数字なので、隣り合う日は似た値が続く。それでも間引かないのは、
   どこで変わったかを日付で追えるようにするため。間引きたくなったら
   TECH_STEP を戻す。

   相関の計算は相関画面と同じ CorrelationEngine を使う。突き合わせは
   両方に値のある日だけ。休みの日は埋めない。
--------------------------------------------------------------- */
const techCompEl = document.getElementById("techcomp");

// いつも出す銘柄。ここは外せない
const TECH_BASE = [
  "yahoo:^N225",                  // 日経平均
  "jpx:TOPIX",
  "nikkei:日経半導体株指数",
  "yahoo:^DJI",                   // NYダウ
  "yahoo:^IXIC",                  // ナスダック総合
  "yahoo:^GSPC",                  // S&P500
  "yahoo:^SOX",
  "yahoo:USDJPY=X"                // ドル円
];
const MAX_TECH_COMP = 5;          // これに足せる数

const TECH_CORR_N = [20, 40, 60, 100, 200];   // 相関を取る日数
const TECH_GAP_N = [20, 60, 200];             // 騰落率の差を取る日数
const TECH_RS_MA = 25;                        // 相対力の移動平均
const TECH_BETA_N = 60;                       // βを取る日数
const TECH_STEP = 1;                          // 何営業日ごとに出すか（1で日次）

// 表の列。銘柄ごとにこれだけ並ぶ
function techCompCols() {
  const out = [];
  TECH_CORR_N.forEach((n) => out.push({ f: `相関${n}`, d: 3, at: (s, r) => s.corr[n][r] }));
  TECH_GAP_N.forEach((n) => out.push({ f: `乖離%${n}`, d: 2, at: (s, r) => s.gap[n][r] }));
  out.push({ f: "相対力乖離%", d: 2, at: (s, r) => s.rs[r] });
  out.push({ f: `β${TECH_BETA_N}`, d: 2, at: (s, r) => s.beta[r] });
  return out;
}

function fmtN(v, d) {
  const n = Number(v);
  if (!isFinite(n)) return v;
  return n.toLocaleString("ja-JP", { minimumFractionDigits: d, maximumFractionDigits: d });
}

// 比較に出す銘柄。主銘柄と同じものは外す（自分との相関は always 1）
function techCompKeys() {
  const out = [];
  for (const k of TECH_BASE.concat(settings.techComp)) {
    if (k !== settings.techKey && !out.includes(k)) out.push(k);
  }
  return out;
}

// 比較銘柄の「日付 → 終値」。主銘柄と同じ年数ぶん読む
const techCompCache = new Map();
async function techCompCloses(key, endYear) {
  const id = `${key}|${endYear}`;
  if (techCompCache.has(id)) return techCompCache.get(id);
  const map = new Map();
  for (let y = Number(endYear) - TECH_SPAN - TECH_WARM + 1; y <= Number(endYear); y++) {
    const one = await seriesOf(key, String(y));
    one.forEach((v, d) => {
      if (!d.startsWith(String(y))) return;
      const n = Number(v);
      if (isFinite(n)) map.set(d, n);
    });
  }
  const sorted = new Map([...map].sort((a, b) => a[0] < b[0] ? -1 : 1));
  techCompCache.set(id, sorted);
  return sorted;
}

// β。比較銘柄が1動いたとき主銘柄がどれだけ動いたか
function betaAt(pts, i, n) {
  if (i - n + 1 < 0) return null;
  let sx = 0, sy = 0, syy = 0, sxy = 0;
  for (let k = i - n + 1; k <= i; k++) {
    const p = pts[k];
    sx += p.x; sy += p.y; syy += p.y * p.y; sxy += p.x * p.y;
  }
  const vy = n * syy - sy * sy;
  if (!(vy > 0)) return null;
  return (n * sxy - sx * sy) / vy;
}

// 主銘柄と1銘柄ぶんの突き合わせ。出すのは標本の日だけ
function techPairStats(mainRows, subMap, sampleDates) {
  const E = CorrelationEngine;
  const mc = new Map(mainRows.map((r) => [r.d, r.c]));
  const pts = E.sameDay(
    E.priceChanges(mainRows.map((r) => [r.d, r.c])),
    E.priceChanges([...subMap])
  );
  const out = { corr: {}, gap: {}, rs: [], beta: [], n: pts.length };
  TECH_CORR_N.forEach((n) => { out.corr[n] = []; });
  TECH_GAP_N.forEach((n) => { out.gap[n] = []; });

  // 相対力（主÷比）と、その移動平均
  const rs = pts.map((p) => {
    const a = mc.get(p.d), b = subMap.get(p.d);
    return (a && b) ? a / b : null;
  });
  const rsMa = sma(rs, TECH_RS_MA);

  let j = 0;
  sampleDates.forEach((d) => {
    while (j + 1 < pts.length && pts[j + 1].d <= d) j++;
    const i = (pts.length && pts[j].d <= d) ? j : -1;
    if (i < 0) {
      TECH_CORR_N.forEach((n) => out.corr[n].push(null));
      TECH_GAP_N.forEach((n) => out.gap[n].push(null));
      out.rs.push(null);
      out.beta.push(null);
      return;
    }
    TECH_CORR_N.forEach((n) => {
      out.corr[n].push(i - n + 1 >= 0 ? E.pearson(pts.slice(i - n + 1, i + 1)) : null);
    });
    TECH_GAP_N.forEach((n) => {
      const k = i - n;
      if (k < 0) { out.gap[n].push(null); return; }
      const m1 = mc.get(pts[i].d), m0 = mc.get(pts[k].d);
      const s1 = subMap.get(pts[i].d), s0 = subMap.get(pts[k].d);
      out.gap[n].push((m1 && m0 && s1 && s0)
        ? ((m1 / m0 - 1) - (s1 / s0 - 1)) * 100 : null);
    });
    out.rs.push((rs[i] !== null && rsMa[i]) ? (rs[i] / rsMa[i] - 1) * 100 : null);
    out.beta.push(betaAt(pts, i, TECH_BETA_N));
  });
  // チャートで使う。頭を100にそろえた線も標本の日で拾う
  out.pts = pts;
  out.mc = mc;
  out.sub = subMap;
  return out;
}

// 最新日を起点に TECH_STEP 営業日ごと。返すのは古い順
function techSampleDates(days) {
  const out = [];
  for (let i = days.length - 1; i >= 0; i -= TECH_STEP) out.push(days[i]);
  return out.reverse();
}

/* ---- 比較の枠 ---- */
let techCompShown = null;      // いま出している中身。チャートで使い回す

function openTechCompare() {
  if (!techState) return;
  techCompEl.classList.remove("hidden");
  drawTechCompare();
}
function closeTechCompare() {
  techCompEl.classList.add("hidden");
  techCompEl.innerHTML = "";
}

let tcRendering = 0;
async function drawTechCompare() {
  if (!techState) return;
  const mine = ++tcRendering;
  const { rows, days, name } = techState;
  const endYear = Number(settings.techYear);
  const keys = techCompKeys();
  const dates = techSampleDates(days);

  if (!techCompEl.querySelector(".box")) {
    techCompEl.innerHTML = '<div class="box"><div id="loading">読み込み中…</div></div>';
  }

  const stats = [];
  for (const key of keys) {
    const sub = await techCompCloses(key, endYear);
    if (mine !== tcRendering) return;
    stats.push(techPairStats(rows, sub, dates));
  }
  const catalog = await buildCatalog(String(endYear));
  if (mine !== tcRendering) return;
  techCompShown = { keys, dates, stats, catalog };

  const cols = techCompCols();
  const box = document.createElement("div");
  box.className = "box";

  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML = `<div class="left"><span class="nm">${name}</span>`
    + `<span class="sub">${dates[0]} 〜 ${dates[dates.length - 1]}　`
    + `${TECH_STEP > 1 ? `${TECH_STEP}営業日ごと ` : "日次 "}${dates.length}日</span></div>`;

  // 足した銘柄の選び直し。既定の8つはここには出さない
  const picks = document.createElement("div");
  picks.className = "picks";
  settings.techComp.forEach((key, i) => {
    const one = document.createElement("div");
    one.className = "one";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = labelOf(key, catalog);
    const del = document.createElement("button");
    del.textContent = "×";
    del.title = "この銘柄を外す";
    del.addEventListener("click", () => {
      settings.techComp.splice(i, 1);
      saveSettings();
      drawTechCompare();
    });
    const sel = document.createElement("select");
    sel.title = "銘柄を変える";
    fillPicker(sel, catalog, key, true);
    sel.addEventListener("change", () => {
      if (sel.value === DEL_VALUE) settings.techComp.splice(i, 1);
      else settings.techComp[i] = sel.value;
      saveSettings();
      drawTechCompare();
    });
    one.append(nm, del, sel);
    picks.appendChild(one);
  });
  if (settings.techComp.length < MAX_TECH_COMP) {

  corner.textContent = "日付";

  keys.forEach((key, ki) => {

      const th = document.createElement("th");
      const wrap = document.createElement("div");
      wrap.className = "colhead";
      wrap.title = "押すとチャート";

      nm.textContent = labelOf(key, catalog);
      const fd = document.createElement("div");
      fd.className = "field";
      fd.textContent = c.f;
      wrap.append(nm, fd);

  const html = [];
  dates.forEach((d, r) => {

/* ---- 比較のチャート ----
   横軸は表と同じ標本の日。数字と線がずれないようにそろえる */
const TECH_COMP_SHOWS = [
  { id: "corr", name: "相関" },
  { id: "gap",  name: "乖離%" },
  { id: "rs",   name: "相対力乖離%" },
  { id: "beta", name: `β${TECH_BETA_N}` }
];
let techCompShow = new Set();
let techCompAt = 0;

function openTechCompChart(ki, field) {
  if (!techCompShown) return;
  techChartMode = "comp";
  techCompAt = ki;
  const id = field.startsWith("相関") ? "corr"
    : field.startsWith("乖離") ? "gap"
    : field.startsWith("相対力") ? "rs" : "beta";
  techCompShow = new Set([id]);
  drawTechCompChart();
  techChartEl.classList.remove("hidden");
}

function drawTechCompChart() {
  if (!techCompShown) return;
  const { keys, dates, stats, catalog } = techCompShown;
  const st = stats[techCompAt];
  const subName = labelOf(keys[techCompAt], catalog);
  const mainName = techState ? techState.name : "";
  const subs = TECH_COMP_SHOWS.filter((s) => techCompShow.has(s.id));

  const T = 8, B = 24, R = 6, RATIO = 1.62, SUB = 0.4;
  const avail = window.innerHeight - 190 - subs.length * 30;
  let ih = Math.round((avail - (subs.length + 1) * (T + B)) / (1 + subs.length * SUB));
  ih = Math.max(260, Math.round(ih * settings.techZoom));
  let iw = Math.round(ih * RATIO);
  const maxIW = Math.round(window.innerWidth * 0.94) - AXIS_L - R - 20;
  if (iw > maxIW && settings.techZoom <= 1) { iw = maxIW; ih = Math.round(iw / RATIO); }
  const base = { iw, ih, T, B, R };
  const small = { iw, ih: Math.max(70, Math.round(ih * SUB)), T, B, R };

  const body = document.createElement("div");
  body.className = "canvas tcbody";
  const put = (el) => { if (el) body.appendChild(el); };

  // 頭を100にそろえた2本。拾うのは表と同じ日
  const pick = (map) => dates.map((d) => (map.get(d) === undefined ? null : Number(map.get(d))));
  const norm = (vals) => {
    const first = vals.find((v) => v !== null && v > 0);
    return first === undefined ? vals : vals.map((v) => v === null ? null : (v / first) * 100);
  };
  put(techPanel(
    techLegend("", [[mainName, seriesColor(0)], [subName, seriesColor(1)]]),
    dates, {
      lines: [
        { vals: norm(pick(st.mc)), color: seriesColor(0) },
        { vals: norm(pick(st.sub)), color: seriesColor(1) }
      ],
      guides: [100]
    }, base));

  const PANEL = {
    corr: () => techPanel(
      techLegend(`${subName}との相関`, TECH_CORR_N.map((n, j) => [String(n), seriesColor(j)])),
      dates, {
        lines: TECH_CORR_N.map((n, j) => ({ vals: st.corr[n], color: seriesColor(j) })),
        guides: [-0.5, 0, 0.5],
        fix: { bottom: -1, top: 1, step: 0.5 }
      }, small),
    gap: () => techPanel(
      techLegend("乖離%", TECH_GAP_N.map((n, j) => [String(n), seriesColor(j)])),
      dates, {
        lines: TECH_GAP_N.map((n, j) => ({ vals: st.gap[n], color: seriesColor(j) })),
        guides: [0]
      }, small),
    rs: () => techPanel("相対力乖離%", dates, {
      lines: [{ vals: st.rs, color: seriesColor(0) }], guides: [0]
    }, small),
    beta: () => techPanel(`β${TECH_BETA_N}`, dates, {
      lines: [{ vals: st.beta, color: seriesColor(0) }], guides: [0, 1]
    }, small)
  };
  subs.forEach((s) => put(PANEL[s.id]()));

  const picks = TECH_COMP_SHOWS.map((s) =>
    `<label><input type="checkbox" data-cshow="${s.id}"${techCompShow.has(s.id) ? " checked" : ""}>`
    + `<span class="bx"></span>${s.name}</label>`).join("");

  const box = document.createElement("div");
  box.className = "box";
  box.style.width = (iw + AXIS_L + R + 8 * 2 + 2 * 2) + "px";
  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML = `<div class="left"><span class="nm">${mainName} と ${subName}</span>`
    + `<span class="sub">${dates[0]} 〜 ${dates[dates.length - 1]}　`
    + `${TECH_STEP > 1 ? `${TECH_STEP}営業日ごと ` : "日次 "}${dates.length}日</span></div>`
    + `<div class="pick">${picks}</div>`;
  box.append(head, body);
  techChartEl.innerHTML = "";
  techChartEl.appendChild(box);

  box.querySelectorAll("input[data-cshow]").forEach((el) => {
    el.addEventListener("change", () => {
      if (el.checked) techCompShow.add(el.dataset.cshow);
      else techCompShow.delete(el.dataset.cshow);
      drawTechCompChart();
    });
  });
}

/* ---------------------------------------------------------------
   相関分析。ここを開いたときだけ全年度を読み、計算結果を再利用する。
--------------------------------------------------------------- */
const corrEl = techEl;
const corrMainEl = document.getElementById("rmain");
const corrPicksEl = document.getElementById("rpicks");
const corrStatusEl = document.getElementById("rstatus");
const CORR_PERIODS = [20, 60, 120];
const CORR_YEARS = Array.from({ length: 2026 - 1999 + 1 }, (_, i) => 1999 + i);
const CORR_CALENDAR = { JP: "yahoo:^N225", KR: "yahoo:^KS11" };
const CORR_BLOCK_ORDER = ["matrix", "pairs", "pairChart", "concentration", "centrality", "concentrationChart", "securitiesChart"];
const corrPriceCache = new Map();
const corrChangeCache = new Map();
const corrPairCache = new Map();
let corrCatalog = null;
let corrState = null;
let corrStateSignature = "";
let corrRendering = 0;
let corrSelectedPair = null;
let corrSort = { key: "r20", dir: -1 };

function corrMeta(key, catalog) {
  const [src, id] = splitKey(key);
  const hit = catalog.find((c) => c.key === key) || {};
  let market = "OTHER", calcType = "return";
  if (["jpx", "nikkei", "yomiuri", "ratio", "stock"].includes(src)) market = "JP";
  if (src === "rates") {
    calcType = "diff";
    if (/^(米|アメリカ)/.test(id)) market = "US";
    else if (id.startsWith("日本")) market = "JP";
    else if (id.startsWith("韓国")) market = "KR";
  }
  if (src === "yahoo") {
    if (id === "^N225" || id.endsWith(".T")) market = "JP";
    else if (id === "^KS11" || id.endsWith(".KS") || id.endsWith(".KQ")) market = "KR";
    else if (US_INDEX.has(id) || ["セクター", "REIT", "ボラティリティ"].includes(hit.category)
      || (hit.category === "個別株" && !id.includes("."))) market = "US";
  }
  return { key, label: labelOf(key, catalog), market, calcType };
}

function appendSelectedYahoo(text, idToKey, maps) {
  const lines = text.split("\n").filter((x) => x.length);
  if (lines.length < 2) return;
  const head = splitLine(lines[0]);
  const di = head.indexOf("trade_date"), si = head.indexOf("symbol"), vi = head.indexOf("close");
  if (di < 0 || si < 0 || vi < 0) return;
  for (let i = 1; i < lines.length; i++) {
    const c = splitLine(lines[i]);
    const key = idToKey.get(c[si]);
    if (!key) continue;
    const v = CorrelationEngine.finiteNumber(c[vi]);
    if (v !== null && c[di]) maps.get(key).set(c[di].slice(0, 10), v);
  }
}

async function loadCorrelationPrices(keys, progress) {
  const wanted = [...new Set(keys)];
  const missing = wanted.filter((key) => !corrPriceCache.has(key));
  if (missing.length) {
    const maps = new Map(missing.map((key) => [key, new Map()]));
    const yahoo = new Map();
    missing.forEach((key) => {
      const [src, id] = splitKey(key);
      if (src === "yahoo") yahoo.set(id, key);
    });
    if (yahoo.size) {
      for (let i = 0; i < CORR_YEARS.length; i++) {
        const year = CORR_YEARS[i];
        if (progress) progress(`全期間データ ${i + 1}/${CORR_YEARS.length}（${year}年）`);
        try {
          const r = await fetch(`data/overseas_${year}.csv`);
          if (r.ok) appendSelectedYahoo(await r.text(), yahoo, maps);
        } catch (_) { /* 無い年は欠損のままにする */ }
      }
    }

    const staticFiles = {
      jpx: ["data/jpx_index.csv", "name", "close"],
      nikkei: ["data/nikkei_ohlc.csv", "name", "close"],
      yomiuri: ["data/yomiuri333.csv", "name", "close"],
      ratio: ["data/ratios.csv", "name", "close"],
      rates: ["data/rates.csv", "name", "value"]
    };
    for (const [src, spec] of Object.entries(staticFiles)) {
      const targets = new Map(missing.filter((key) => splitKey(key)[0] === src)
        .map((key) => [splitKey(key)[1], key]));
      if (!targets.size) continue;
      for (const r of await fetchCsv(spec[0])) {
        const key = targets.get(r[spec[1]]);
        const v = CorrelationEngine.finiteNumber(r[spec[2]]);
        if (key && v !== null && r.trade_date) maps.get(key).set(r.trade_date.slice(0, 10), v);
      }
    }
    // chart0 から写した個別株。1銘柄1ファイルで、全期間がそこに入っている。
    // 列の名前だけ他と違う（Date, Close）
    const stocks = missing.filter((key) => splitKey(key)[0] === "stock");
    for (let i = 0; i < stocks.length; i++) {
      const code = splitKey(stocks[i])[1];
      if (progress) progress(`個別株 ${i + 1}/${stocks.length}（${code}）`);
      for (const r of await fetchCsv(`data/stocks/${code}.csv`)) {
        const v = CorrelationEngine.finiteNumber(r.Close);
        if (v !== null && r.Date) maps.get(stocks[i]).set(r.Date.slice(0, 10), v);
      }
    }

    maps.forEach((map, key) => corrPriceCache.set(key, map));
  }
  return new Map(wanted.map((key) => [key, corrPriceCache.get(key) || new Map()]));
}

function corrPairKey(a, b) {
  return a < b ? `${a}\n${b}` : `${b}\n${a}`;
}

function correlationChanges(key, prices, meta) {
  if (!corrChangeCache.has(key)) {
    corrChangeCache.set(key, CorrelationEngine.priceChanges(prices, meta.calcType));
  }
  return corrChangeCache.get(key);
}

async function calculateCorrelations(keys, catalog, progress) {
  // 読んでいる間に×や＋で並びが動くことがある。渡された配列をそのまま
  // 使うと、途中で増えた銘柄が metas に無いまま組に入って落ちる
  keys = [...keys];
  const allKeys = [...new Set([...keys, CORR_CALENDAR.JP, CORR_CALENDAR.KR])];
  const prices = await loadCorrelationPrices(allKeys, progress);
  const metas = new Map(allKeys.map((key) => [key, corrMeta(key, catalog)]));
  const changes = new Map(allKeys.map((key) => [key,
    correlationChanges(key, prices.get(key), metas.get(key))]));
  const calendars = {
    JP: [...prices.get(CORR_CALENDAR.JP).keys()].sort(),
    KR: [...prices.get(CORR_CALENDAR.KR).keys()].sort()
  };
  const pairs = [];
  for (let i = 0; i < keys.length; i++) {
    for (let j = i + 1; j < keys.length; j++) {
      const a = keys[i], b = keys[j], cacheKey = corrPairKey(a, b);
      let analysis = corrPairCache.get(cacheKey);
      if (!analysis) {
        const first = a < b ? a : b, second = a < b ? b : a;
        analysis = CorrelationEngine.analysePair(
          changes.get(first), changes.get(second), metas.get(first), metas.get(second),
          calendars, CORR_PERIODS
        );
        corrPairCache.set(cacheKey, analysis);
      }
      pairs.push({ a, b, key: cacheKey, analysis });
    }
  }

  const centrality = keys.map((key) => {
    const values = {};
    CORR_PERIODS.forEach((period) => {
      const usable = pairs.filter((p) => p.a === key || p.b === key)
        .map((p) => p.analysis.current[period]).filter((v) => v !== null);
      values[period] = {
        v: usable.length ? usable.reduce((a, b) => a + b, 0) / usable.length : null,
        used: usable.length, total: Math.max(0, keys.length - 1)
      };
    });
    return { key, values };
  });
  const concentration = {};
  CORR_PERIODS.forEach((period) => {
    const usable = pairs.map((p) => p.analysis.current[period]).filter((v) => v !== null);
    concentration[period] = {
      v: usable.length ? usable.reduce((a, b) => a + b, 0) / usable.length : null,
      used: usable.length, total: pairs.length
    };
  });
  if (progress) progress("相関集中度の長期推移を計算中…");
  const concentrationTimeline = CorrelationEngine.concentrationTimeline(
    pairs.map((p) => p.analysis), CORR_PERIODS, 14
  );
  return { keys, catalog, metas, prices, pairs, centrality, concentration, concentrationTimeline };
}

function fmtCorr(v, signed) {
  if (v === null || v === undefined || !Number.isFinite(v)) return "N/A";
  return `${signed && v > 0 ? "+" : ""}${v.toFixed(3)}`;
}

const corrCollapsed = new Set();
const corrTightScale = new Set();
let corrDraggingKey = null;
let corrPointerDrag = null;

function normalizedCorrBlockOrder() {
  const saved = Array.isArray(settings.corrBlockOrder) ? settings.corrBlockOrder : [];
  const kept = saved.filter((key) => CORR_BLOCK_ORDER.includes(key));
  return [...new Set([...kept, ...CORR_BLOCK_ORDER])];
}

function moveCorrBlock(fromKey, toKey, after) {
  const order = normalizedCorrBlockOrder().filter((key) => key !== fromKey);
  let at = order.indexOf(toKey);
  if (at < 0) at = order.length;
  if (after) at++;
  order.splice(at, 0, fromKey);
  settings.corrBlockOrder = order;
  saveSettings();
  drawCorrelationResults();
}

function makeCorrBlock(title, infoKey, options) {
  options = options || {};
  const block = document.createElement("section");
  block.className = "corr-block";
  if (options.blockKey && corrCollapsed.has(options.blockKey)) block.classList.add("collapsed");
  const h = document.createElement("h2");
  if (options.blockKey) {
    block.dataset.blockKey = options.blockKey;
    h.className = "corr-drag-handle";
    h.title = "ドラッグして枠を上下に移動";
    const clearDragMarks = () => document.querySelectorAll(".corr-block")
      .forEach((el) => el.classList.remove("corr-dragging", "corr-drop-before", "corr-drop-after"));
    h.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || e.target.closest("button, select, input, a")) return;
      corrPointerDrag = { key: options.blockKey, pointerId: e.pointerId, startY: e.clientY, started: false, target: null, after: false };
      h.setPointerCapture(e.pointerId);
    });
    h.addEventListener("pointermove", (e) => {
      const drag = corrPointerDrag;
      if (!drag || drag.pointerId !== e.pointerId) return;
      if (!drag.started && Math.abs(e.clientY - drag.startY) < 6) return;
      drag.started = true; corrDraggingKey = drag.key; block.classList.add("corr-dragging");
      clearDragMarks(); block.classList.add("corr-dragging");
      const mainRect = corrMainEl.getBoundingClientRect();
      if (e.clientY < mainRect.top + 48) corrMainEl.scrollTop -= 24;
      else if (e.clientY > mainRect.bottom - 48) corrMainEl.scrollTop += 24;
      const target = document.elementFromPoint(e.clientX, e.clientY)?.closest(".corr-block[data-block-key]");
      if (!target || target.dataset.blockKey === drag.key) { drag.target = null; return; }
      drag.target = target.dataset.blockKey;
      const rect = target.getBoundingClientRect(); drag.after = e.clientY > rect.top + rect.height / 2;
      target.classList.add(drag.after ? "corr-drop-after" : "corr-drop-before");
    });
    const finishPointerDrag = (e) => {
      const drag = corrPointerDrag;
      if (!drag || drag.pointerId !== e.pointerId) return;
      corrPointerDrag = null; corrDraggingKey = null; clearDragMarks();
      if (drag.started && drag.target) { e.preventDefault(); moveCorrBlock(drag.key, drag.target, drag.after); }
    };
    h.addEventListener("pointerup", finishPointerDrag);
    h.addEventListener("pointercancel", (e) => {
      if (corrPointerDrag && corrPointerDrag.pointerId === e.pointerId) {
        corrPointerDrag = null; corrDraggingKey = null; clearDragMarks();
      }
    });
  }
  const dragMark = document.createElement("span"); dragMark.className = "corr-drag-mark"; dragMark.textContent = "↕";
  if (options.blockKey) h.appendChild(dragMark);
  const label = document.createElement("span"); label.className = "corr-head-label"; label.textContent = title; h.appendChild(label);
  if (infoKey) {
    const info = document.createElement("button");
    info.className = "corr-info-btn"; info.textContent = "i";
    info.title = `${CORR_INFO[infoKey].title}の説明`; info.setAttribute("aria-label", info.title);
    info.addEventListener("click", () => openCorrInfo(infoKey)); h.appendChild(info);
  }
  const actions = document.createElement("span");
  actions.className = "corr-head-actions";
  if (options.blockKey) {
    const collapse = document.createElement("button");
    collapse.className = "corr-block-btn corr-collapse";
    collapse.textContent = block.classList.contains("collapsed") ? "＋" : "−";
    collapse.title = block.classList.contains("collapsed") ? "内容を開く" : "題名だけに縮小";
    collapse.setAttribute("aria-label", collapse.title);
    collapse.addEventListener("click", () => {
      const closed = block.classList.toggle("collapsed");
      collapse.textContent = closed ? "＋" : "−";
      collapse.title = closed ? "内容を開く" : "題名だけに縮小";
      collapse.setAttribute("aria-label", collapse.title);
      if (closed) corrCollapsed.add(options.blockKey); else corrCollapsed.delete(options.blockKey);
    });
    actions.appendChild(collapse);
  }
  if (options.onClose) {
    const close = document.createElement("button");
    close.className = "corr-block-btn corr-chart-close"; close.textContent = "×";
    close.title = "チャートを閉じる"; close.setAttribute("aria-label", close.title);
    close.addEventListener("click", options.onClose); actions.appendChild(close);
  }
  if (actions.childNodes.length) h.appendChild(actions);
  const body = document.createElement("div");
  body.className = "corr-body";
  block.append(h, body);
  return { block, body };
}

function makeCorrelationChart(title, sets, infoKey, options) {
  options = options || {};
  const box = makeCorrBlock(title, infoKey, options);
  const wrap = document.createElement("div");
  wrap.className = "corr-chart";
  const range = document.createElement("div");
  range.className = "corr-chart-range";
  const startSelect = document.createElement("select");
  const endSelect = document.createElement("select");
  startSelect.title = "表示開始年"; startSelect.setAttribute("aria-label", "表示開始年");
  endSelect.title = "表示終了年"; endSelect.setAttribute("aria-label", "表示終了年");
  const raw = sets.flatMap((s) => s.data);
  const rawYears = raw.map((p) => Number(p.d.slice(0, 4))).filter(Number.isFinite);
  const thisYear = new Date().getFullYear();
  const firstYear = rawYears.reduce((v, year) => Math.min(v, year), 1999);
  const lastYear = rawYears.reduce((v, year) => Math.max(v, year), thisYear);
  let startYear = Math.max(firstYear, Math.min(lastYear, Number(settings.corrStartYear) || 2000));
  let endYear = Math.max(firstYear, Math.min(lastYear, Number(settings.corrEndYear) || thisYear));
  if (startYear > endYear) startYear = endYear;
  for (let year = firstYear; year <= lastYear; year++) {
    const a = document.createElement("option"); a.value = year; a.textContent = year; startSelect.appendChild(a);
    const b = document.createElement("option"); b.value = year; b.textContent = year; endSelect.appendChild(b);
  }
  startSelect.value = String(startYear); endSelect.value = String(endYear);
  const between = document.createElement("span"); between.textContent = "～";
  const rangeLabel = document.createElement("span"); rangeLabel.textContent = "表示年";
  const changeRange = (fromStart) => {
    let a = Number(startSelect.value), b = Number(endSelect.value);
    if (a > b) { if (fromStart) b = a; else a = b; }
    settings.corrStartYear = a; settings.corrEndYear = b; saveSettings(); drawCorrelationResults();
  };
  startSelect.addEventListener("change", () => changeRange(true));
  endSelect.addEventListener("change", () => changeRange(false));
  range.append(rangeLabel, startSelect, between, endSelect);
  const svg = svgEl("svg", { viewBox: "0 0 1100 330", preserveAspectRatio: "none" });
  const L = 54, R = 18, T = 16, B = 34, W = 1100, H = 330;
  const shownSets = sets.map((set) => ({
    ...set,
    data: set.data.filter((p) => {
      const year = Number(p.d.slice(0, 4));
      return year >= startYear && year <= endYear;
    })
  }));
  const all = shownSets.flatMap((s) => s.data);
  if (!all.length) {
    const empty = document.createElement("div"); empty.textContent = "表示できる相関データがない";
    box.body.append(range, empty);
    return box.block;
  }
  const t0 = Date.UTC(startYear, 0, 1), t1 = Date.UTC(endYear + 1, 0, 1);
  const x = (d) => L + (W - L - R) * (Date.parse(d + "T00:00:00Z") - t0) / Math.max(1, t1 - t0);
  const chartKey = options.blockKey || title;
  const drawPlot = () => {
    svg.replaceChildren();
    const values = all.map((p) => p.v).filter(Number.isFinite);
    const tight = corrTightScale.has(chartKey);
    let lo = tight ? Math.min(...values) - 0.1 : -1;
    let hi = tight ? Math.max(...values) + 0.1 : 1;
    let yTicks = [-1, -0.5, 0, 0.5, 1], tickDecimals = 1;
    let tickLabel = (v) => v.toFixed(tickDecimals);
    if (options.valueMode === "market") {
      let dataLo = Math.min(...values), dataHi = Math.max(...values);
      if (dataLo === dataHi) {
        const pad = Math.abs(dataLo) * 0.01 || 1; dataLo -= pad; dataHi += pad;
      }
      const sc = scaleOf(dataLo, dataHi);
      lo = sc.bottom; hi = sc.top; yTicks = [];
      for (let v = sc.bottom; v <= sc.top + sc.step / 2; v += sc.step) yTicks.push(Math.abs(v) < 1e-12 ? 0 : v);
      tickLabel = (v) => fmtAxis(v, sc.step);
    } else if (tight) {
      const step = niceStep(hi - lo);
      tickDecimals = 0;
      while (tickDecimals < 6 && Math.abs(step * Math.pow(10, tickDecimals) - Math.round(step * Math.pow(10, tickDecimals))) > 1e-9) tickDecimals++;
      const first = Math.ceil((lo - 1e-12) / step) * step;
      yTicks = [];
      for (let v = first; v <= hi + 1e-12; v += step) yTicks.push(Math.abs(v) < 1e-12 ? 0 : v);
    }
    const y = (v) => T + (H - T - B) * (hi - v) / Math.max(0.000001, hi - lo);
    yTicks.forEach((v) => {
      svg.appendChild(svgEl("line", { x1: L, y1: y(v), x2: W - R, y2: y(v), class: Math.abs(v) < 1e-9 ? "zero" : "gridline" }));
      const lab = svg.appendChild(svgEl("text", { x: L - 7, y: y(v) + 4, class: "lab", "text-anchor": "end" }));
      lab.textContent = tickLabel(v);
    });
    const totalMonths = (endYear - startYear + 1) * 12;
    let monthStep = 12;
    [6, 4, 2, 1].forEach((candidate) => {
      if (Math.ceil(totalMonths / candidate) <= 20) monthStep = candidate;
    });
    for (let offset = 0; offset < totalMonths; offset += monthStep) {
      const year = startYear + Math.floor(offset / 12), month = offset % 12;
      const px = x(`${year}-${String(month + 1).padStart(2, "0")}-01`);
      svg.appendChild(svgEl("line", { x1: px, y1: T, x2: px, y2: H - B, class: "gridline" }));
      const lab = svg.appendChild(svgEl("text", { x: px, y: H - 10, class: "lab", "text-anchor": offset === 0 ? "start" : "middle" }));
      lab.textContent = month === 0 ? String(year) : `${month + 1}月`;
    }
    svg.appendChild(svgEl("rect", { x: L, y: T, width: W - L - R, height: H - T - B, class: "axis" }));
    shownSets.forEach((set, i) => {
      const d = set.data.map((p, j) => `${j ? "L" : "M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
      if (d) svg.appendChild(svgEl("path", { d, class: "plot", stroke: set.color || seriesColor(i) }));
    });
    let legendX = L + 8;
    shownSets.forEach((set, i) => {
      const legend = svg.appendChild(svgEl("text", { x: legendX, y: T + 15, class: "lab", style: `fill:${set.color || seriesColor(i)}` }));
      legend.textContent = set.label;
      legendX += textW(set.label, 12) + 24;
    });
  };
  drawPlot();
  const tip = document.createElement("div");
  tip.className = "corr-tip";
  svg.addEventListener("mousemove", (e) => {
    const rect = svg.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const at = t0 + ratio * (t1 - t0);
    const lines = [new Date(at).toISOString().slice(0, 10)];
    shownSets.forEach((set) => {
      let lo = 0, hi = set.data.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (Date.parse(set.data[mid].d + "T00:00:00Z") < at) lo = mid + 1; else hi = mid;
      }
      const p = set.data[Math.min(lo, set.data.length - 1)];
      if (p) lines.push(`${set.label} ${options.valueMode === "market" ? fmt(p.v) : fmtCorr(p.v)}`);
    });
    tip.textContent = lines.join("\n");
    tip.style.display = "block";
    tip.style.left = `${Math.min(wrap.clientWidth - 160, e.clientX - rect.left + 12)}px`;
    tip.style.top = `${Math.max(0, e.clientY - rect.top - 10)}px`;
  });
  svg.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  svg.addEventListener("dblclick", (e) => {
    if (options.valueMode === "market") return;
    e.preventDefault(); corrTightScale.add(chartKey); tip.style.display = "none"; drawPlot();
  });
  if (options.valueMode !== "market") svg.setAttribute("title", "ダブルクリックで縦軸を折れ線の最小値−0.1～最大値＋0.1に合わせる");
  wrap.append(range, svg, tip);
  box.body.appendChild(wrap);
  return box.block;
}

function openPairDetail(pair) {
  corrSelectedPair = pair.key;
  drawCorrelationResults();
  document.getElementById("corr-detail")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

function closePairDetail() {
  corrSelectedPair = null;
  corrCollapsed.delete("pairChart");

}

function makeSecuritiesChart(keys, catalog, prices) {
  const chartKeys = keys.slice(0, 10);
  const hidden = new Set(Array.isArray(settings.corrChartHidden) ? settings.corrChartHidden : []);
  const relative = chartKeys.length >= 2;
  const from = Number(settings.corrStartYear) || 2000;
  const to = Number(settings.corrEndYear) || new Date().getFullYear();
  const sets = chartKeys.map((key, i) => {
    const source = [...(prices.get(key) || new Map())]
      .map(([d, v]) => ({ d, v: Number(v) }))
      .filter((p) => Number.isFinite(p.v) && Number(p.d.slice(0, 4)) >= from && Number(p.d.slice(0, 4)) <= to)
      .sort((a, b) => a.d.localeCompare(b.d));
    if (!relative) return { key, label: labelOf(key, catalog), data: source, color: seriesColor(i) };
    const first = source.length ? source[0].v : null;
    return {
      key,
      label: `${labelOf(key, catalog)} 開始100`,
      data: first === null || first === 0 ? [] : source.map((p) => ({ d: p.d, v: p.v / first * 100 })),
      color: seriesColor(i)
    };
  });
  const mode = relative ? "相対値・開始100" : "絶対値";
  const chart = makeCorrelationChart(`銘柄チャート（${mode}）`, sets.filter((set) => !hidden.has(set.key)), "securitiesChart",
    { blockKey: "securitiesChart", valueMode: "market" });
  const picks = document.createElement("div"); picks.className = "corr-series-picks";
  sets.forEach((set) => {
    const button = document.createElement("button");
    const off = hidden.has(set.key);
    button.className = `corr-series-pick${off ? " off" : ""}`;
    button.textContent = labelOf(set.key, catalog);
    button.style.setProperty("--series-color", set.color);
    button.title = off ? "クリックして線を表示" : "クリックして線を非表示";
    button.setAttribute("aria-pressed", off ? "false" : "true");
    button.addEventListener("click", () => {
      const next = new Set(Array.isArray(settings.corrChartHidden) ? settings.corrChartHidden : []);
      if (next.has(set.key)) next.delete(set.key); else next.add(set.key);
      settings.corrChartHidden = [...next]; saveSettings(); drawCorrelationResults();
    });
    picks.appendChild(button);
  });
  chart.querySelector(".corr-body").prepend(picks);
  return chart;
}

function drawCorrelationResults() {
  if (!corrState) return;
  const { keys, catalog, prices, pairs, centrality, concentration, concentrationTimeline } = corrState;
  const period = settings.corrPeriod;
  const pairByKey = new Map(pairs.map((p) => [p.key, p]));
  const blocks = new Map();
  document.querySelectorAll("#rperiods button").forEach((b) => b.classList.toggle("active", Number(b.dataset.period) === period));
  corrMainEl.innerHTML = "";

  const matrix = makeCorrBlock(`相関マトリクス（${period}日）`, "matrix", { blockKey: "matrix" });
  const matrixScroll = document.createElement("div");
  matrixScroll.className = "corr-scroll";
  const mt = document.createElement("table");
  mt.className = "corr-table corr-matrix";
  const mh = document.createElement("thead"), mhr = document.createElement("tr");
  mhr.appendChild(document.createElement("th"));
  keys.forEach((key) => { const th = document.createElement("th"); th.textContent = labelOf(key, catalog); mhr.appendChild(th); });
  mh.appendChild(mhr); mt.appendChild(mh);
  const mb = document.createElement("tbody");
  keys.forEach((a, i) => {
