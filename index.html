<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>相場データ</title>
<style>
  /* 配色は :root の変数だけで切り替える。全画面に波及する */
  :root {
    --bg:      #000000;
    --fg:      #33ff66;
    --fg2:     #33ff66;
    --line:    #33ff66;
    --panel:   #000000;
    --sel-bg:  #33ff66;
    --sel-fg:  #000000;
    --dim:     #1a7a33;
  }
  html[data-theme="light"] {
    --bg: #ffffff; --fg: #000000; --fg2: #000000; --line: #000000;
    --panel: #ffffff; --sel-bg: #000000; --sel-fg: #ffffff; --dim: #888888;
  }
  /* 以下3つは提案。夜 / 紙 / 熾火 */
  html[data-theme="midnight"] {
    --bg: #14181f; --fg: #d6dee8; --fg2: #7fb2ff; --line: #2c3644;
    --panel: #1a1f28; --sel-bg: #7fb2ff; --sel-fg: #14181f; --dim: #6b7787;
  }
  html[data-theme="paper"] {
    --bg: #f4efe4; --fg: #33302a; --fg2: #7a5c3e; --line: #cabfa9;
    --panel: #ece5d6; --sel-bg: #7a5c3e; --sel-fg: #f4efe4; --dim: #a1957f;
  }
  html[data-theme="ember"] {
    --bg: #1b1a17; --fg: #e6dac4; --fg2: #e0863a; --line: #3d3830;
    --panel: #221f1b; --sel-bg: #e0863a; --sel-fg: #1b1a17; --dim: #7c7263;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "MS Gothic", "Osaka-Mono", "Courier New", monospace;
    font-size: 14px;
  }
  .hidden { display: none !important; }

  /* ---- タイトル画面 ---- */
  #title {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
  }
  #title h1 { font-size: 22px; letter-spacing: .4em; margin: 0 0 8px; font-weight: normal; }
  #title .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .menu { display: flex; flex-direction: column; gap: 14px; }
  .menu button {
    width: 320px; padding: 18px 0;
    background: var(--panel); color: var(--fg);
    border: 2px solid var(--line);
    font: inherit; font-size: 18px; letter-spacing: .3em;
    cursor: pointer;
  }
  .menu button[aria-selected="true"] { background: var(--sel-bg); color: var(--sel-fg); }
  .menu button:disabled { color: var(--dim); border-color: var(--dim); cursor: default; }
  .menu button[aria-selected="true"]:disabled { background: var(--dim); color: var(--bg); }
  #title .hint { color: var(--dim); font-size: 12px; }

  /* ---- 表画面 ---- */
  #sheet { height: 100%; display: flex; flex-direction: column; }
  .bar {
    display: flex; align-items: stretch;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  .bar > * { border-right: 1px solid var(--line); }
  .bar button, .bar select {
    background: var(--panel); color: var(--fg);
    border: 0; font: inherit; padding: 6px 14px; cursor: pointer;
  }
  .bar select { padding-right: 8px; }
  .bar .spacer { flex: 1; border-right: 0; }
  .bar .note { padding: 6px 14px; color: var(--dim); border-right: 0; }

  .grid { flex: 1; overflow: auto; }

  /* スクロールの棒。配色に合わせて自分で描く。
     Firefox はこの2行だけ効く */
  .grid { scrollbar-color: var(--fg) var(--bg); scrollbar-width: thin; }
  .grid::-webkit-scrollbar { width: 13px; height: 13px; }
  .grid::-webkit-scrollbar-track {
    background: var(--bg);
    border-left: 1px solid var(--line);
    border-top: 1px solid var(--line);
  }
  .grid::-webkit-scrollbar-thumb {
    background: var(--fg);
    border: 3px solid var(--bg);   /* 内側を空けて細く見せる */
  }
  .grid::-webkit-scrollbar-thumb:hover { background: var(--fg2); }
  .grid::-webkit-scrollbar-corner { background: var(--bg); }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed; }
  th, td {
    border: 1px solid var(--line);
    padding: 3px 10px;
    white-space: nowrap;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 見出しの右端を掴むと幅を変えられる */
  .grip {
    position: absolute; top: 0; right: -3px; width: 7px; height: 100%;
    cursor: col-resize; user-select: none;
  }
  .grip:hover { background: var(--fg2); opacity: .5; }
  /* sticky は位置指定なので、取っ手はこの中に絶対配置できる */
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--panel); color: var(--fg2);
    text-align: center;
  }
  thead th.corner { left: 0; z-index: 3; }
  tbody th {
    position: sticky; left: 0; z-index: 1;
    background: var(--panel); color: var(--fg2);
    text-align: left; font-weight: normal;
  }
  td.na { color: var(--dim); }
  /* 見出しは幅を狭めると2行3行に折り返す */
  thead th { white-space: normal; }
  /* 名前が横幅を丸ごと使う。× と ▼ はマス目の下辺に貼り付ける。
     横は詰まっているので操作の記号に幅を割かない。
     名前の長さで位置がずれないよう、全列そろえて一番下に置く */
  /* セルの中身を下へ寄せる。行の高さは一番背の高い見出しで決まるので、
     これだけで全列の × ▼ が下辺にそろう */
  thead th { vertical-align: bottom; }
  .colhead { display: block; }
  .colhead .name {
    font-size: 12px; line-height: 1.25;
    word-break: break-all;      /* 銘柄名は途中でも折る */
    text-align: center;
    cursor: pointer;            /* 押すとチャート */
  }
  .colhead .ops {
    display: flex; justify-content: center; gap: 6px;
    line-height: 1; margin-top: 2px;
    flex: none;
  }
  .colhead .ops button {
    background: none; border: 0; color: var(--dim);
    font: inherit; font-size: 11px; cursor: pointer; padding: 0 2px;
    position: relative; z-index: 3;
  }
  /* ▼ の上に重ねた選択。押すと候補が開く。見た目には出さない */
  .pickwrap { position: relative; display: block; }
  .picker {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
    font: inherit; z-index: 4;
  }
  .grip { z-index: 5; }

  /* ---- チャート（ポップアップ） ---- */
  #chart {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, .55);
    display: flex; align-items: center; justify-content: center;
  }
  /* 枠の幅は SVG に合わせて決め打ちする。
     見出しが長くても横に伸ばさない。伸ばすと縦横比（1:1.62）が崩れる */
  #chart .box {
    background: var(--bg); color: var(--fg);
    border: 2px solid var(--line);
    padding: 8px 8px 6px;
  }
  /* チャートの中の字は全部おなじ。表の数字と同じ書体・大きさで、太字 */
  #chart .box, #chart text {
    font-family: "MS Gothic", "Osaka-Mono", "Courier New", monospace;
    font-size: 14px;
    font-weight: bold;
  }
  #chart .head {
    display: flex; justify-content: space-between; gap: 8px 20px;
    flex-wrap: wrap;                 /* 入らなければ行を変える */
    margin-bottom: 4px;
  }
  #chart .head .sub { color: var(--fg); }
  #chart svg { display: block; }
  #chart .axis { stroke: var(--line); fill: none; }
  #chart .vline { stroke: var(--dim); stroke-width: .5; }
  #chart .hline { stroke: var(--dim); stroke-width: .5; }
  #chart .lab { fill: var(--fg); }
  #chart .plot { stroke: var(--fg); fill: none; stroke-width: 1.2; }
  #chart .ma { stroke: var(--fg); fill: none; stroke-width: 1; opacity: .75; }
  #chart .head .left {
    display: flex; align-items: center; gap: 8px 16px;
    flex-wrap: wrap; min-width: 0;
  }
  #chart .head .name { word-break: break-all; }
  #chart .ma-pick { display: flex; gap: 12px; color: var(--fg); flex: none; }
  #chart .ma-pick label {
    cursor: pointer; user-select: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  #chart .ma-pick input { position: absolute; opacity: 0; width: 0; height: 0; }
  #chart .ma-pick .bx {
    display: inline-block; width: 12px; height: 12px;
    border: 1px solid var(--fg);
    background: var(--bg);
  }
  #chart .ma-pick input:checked + .bx { background: var(--fg); }
  .addcol {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    font: inherit; cursor: pointer; padding: 2px 10px;
  }
  #loading { padding: 20px; color: var(--dim); }
</style>
</head>
<body>

<!-- ===================== タイトル画面 ===================== -->
<section id="title">
  <h1>相 場 デ ー タ</h1>
  <div class="sub">1999 - 2026</div>
  <div class="menu" id="titleMenu">
    <button data-go="sheet" aria-selected="true">表</button>
    <button data-go="chart" disabled>チャート</button>
  </div>
  <div class="hint">↑ ↓ で選択　Enter で決定</div>
</section>

<!-- ===================== 表画面 ===================== -->
<section id="sheet" class="hidden">
  <div class="bar">
    <button id="back" title="タイトルへ戻る">← 戻る</button>
    <select id="year" title="表示する年"></select>
    <button id="theme" title="押すたびに配色が変わる">Color</button>
    <div class="spacer"></div>
    <div class="note" id="status"></div>
  </div>
  <div class="grid" id="grid"><div id="loading">読み込み中…</div></div>
</section>

<!-- ===================== チャート（ポップアップ） ===================== -->
<div id="chart" class="hidden"></div>

<script>
"use strict";

/* ---------------------------------------------------------------
   保存する設定。銘柄の並びと配色はブラウザに覚えさせる
--------------------------------------------------------------- */
const STORE = "soba.v2";
const DEFAULT_COLUMNS = [
  "yahoo:^N225",          // 日経平均株価
  "jpx:TOPIX (東証株価指数)",
  "nikkei:日経半導体株指数",
  "yahoo:^DJI",           // NYダウ
  "yahoo:^GSPC",          // S&P500
  "yahoo:^IXIC",          // ナスダック総合
  "yahoo:^SOX"            // SOX
];

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "{}");
    return {
      theme: s.theme || "retro",
      year: s.year || 2026,
      columns: Array.isArray(s.columns) && s.columns.length ? s.columns : DEFAULT_COLUMNS.slice(),
      widths: (s.widths && typeof s.widths === "object") ? s.widths : {},
      ma: (s.ma && typeof s.ma === "object") ? s.ma : { 20: false, 80: false, 200: false }
    };
  } catch (e) {
    return {
      theme: "retro", year: 2026, columns: DEFAULT_COLUMNS.slice(), widths: {},
      ma: { 20: false, 80: false, 200: false }
    };
  }
}
function saveSettings() {
  localStorage.setItem(STORE, JSON.stringify(settings));
}
let settings = loadSettings();

// 押すたびにこの順で回る。先頭が既定
const THEMES = ["retro", "light", "midnight", "paper", "ember"];

function applyTheme(name) {
  if (!THEMES.includes(name)) name = THEMES[0];
  document.documentElement.dataset.theme = name;
  settings.theme = name;
  saveSettings();
}
function nextTheme() {
  const i = THEMES.indexOf(settings.theme);
  applyTheme(THEMES[(i + 1) % THEMES.length]);
}
applyTheme(settings.theme);

/* ---------------------------------------------------------------
   タイトル画面。↑↓ で選び Enter で決める
--------------------------------------------------------------- */
const titleEl = document.getElementById("title");
const sheetEl = document.getElementById("sheet");
const items = [...document.querySelectorAll("#titleMenu button")];
let cursor = 0;

function drawCursor() {
  items.forEach((b, i) => b.setAttribute("aria-selected", String(i === cursor)));
}
function decide() {
  const b = items[cursor];
  if (b.disabled) return;               // チャートはまだ作らない
  if (b.dataset.go === "sheet") openSheet();
}
// 表を矢印で動かす幅。1回押すとこれだけ寄る
const STEP_X = 120;   // 列1つぶんくらい
const STEP_Y = 60;    // 行3つぶんくらい

document.addEventListener("keydown", (e) => {
  if (!titleEl.classList.contains("hidden")) {
    // タイトル画面。↑↓ で選び Enter で決める
    if (e.key === "ArrowDown") { cursor = (cursor + 1) % items.length; drawCursor(); e.preventDefault(); }
    if (e.key === "ArrowUp")   { cursor = (cursor - 1 + items.length) % items.length; drawCursor(); e.preventDefault(); }
    if (e.key === "Enter")     { decide(); e.preventDefault(); }
    return;
  }

  if (e.key === "Escape") {
    if (!chartEl.classList.contains("hidden")) closeChart();
    else backToTitle();
    return;
  }

  // チャートを出している間は表を動かさない
  if (!chartEl.classList.contains("hidden")) return;

  // 表画面。矢印で上下左右へ寄せる
  const move = {
    ArrowLeft:  [-STEP_X, 0],
    ArrowRight: [STEP_X, 0],
    ArrowUp:    [0, -STEP_Y],
    ArrowDown:  [0, STEP_Y],
    PageUp:     [0, -gridEl.clientHeight],
    PageDown:   [0, gridEl.clientHeight],
    Home:       [-gridEl.scrollWidth, 0],
    End:        [gridEl.scrollWidth, 0]
  }[e.key];
  if (!move) return;

  gridEl.scrollBy(move[0], move[1]);
  e.preventDefault();          // 画面ごと動くのを止める
});
items.forEach((b, i) => {
  b.addEventListener("mouseenter", () => { cursor = i; drawCursor(); });
  b.addEventListener("click", () => { cursor = i; drawCursor(); decide(); });
});
drawCursor();

function backToTitle() {
  sheetEl.classList.add("hidden");
  titleEl.classList.remove("hidden");
}
document.getElementById("back").addEventListener("click", backToTitle);

/* ---------------------------------------------------------------
   データの読み込み。CSVはそのまま置いてあるものを読む

     yahoo:{シンボル}  data/overseas_{年}.csv
     jpx:{指数名}      data/jpx_index.csv
     nikkei:{指数名}   data/nikkei_ohlc.csv

   どれも終値を出す。無い日は #N/A
--------------------------------------------------------------- */
const cache = new Map();

async function fetchCsv(path) {
  if (cache.has(path)) return cache.get(path);
  const p = fetch(path).then(async (r) => {
    if (!r.ok) return [];
    return parseCsv(await r.text());
  }).catch(() => []);
  cache.set(path, p);
  return p;
}

function parseCsv(text) {
  const lines = text.split("\n").filter((l) => l.length);
  if (!lines.length) return [];
  const head = splitLine(lines[0]);
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = splitLine(lines[i]);
    const row = {};
    head.forEach((h, j) => { row[h] = cells[j] === undefined ? "" : cells[j]; });
    out.push(row);
  }
  return out;
}

// 引用符つきのカンマ区切りを分ける
function splitLine(line) {
  const out = [];
  let cur = "", quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quoted) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; } else { quoted = false; }
      } else cur += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { out.push(cur); cur = ""; }
    else if (c !== "\r") cur += c;
  }
  out.push(cur);
  return out;
}

// 候補はこの順で並べる
const GROUPS = ["日本株指数", "米国株指数", "海外その他", "為替", "日本個別株", "海外個別株"];

// 米国の株価指数。ここに無い海外指数は「海外その他」へ入れる
const US_INDEX = new Set(["^DJI", "^IXIC", "^NDX", "^GSPC", "^RUT", "^SOX", "^VIX"]);

// symbols.csv の分類 → 画面での分野
function groupOf(category, symbol) {
  if (category === "日本指数" || category === "先物") return "日本株指数";
  if (category === "日本株") return "日本個別株";
  if (category === "個別株") return "海外個別株";
  if (category === "為替") return "為替";
  if (category === "セクター" || category === "REIT" || category === "ボラティリティ") return "米国株指数";
  if (category === "海外指数") return US_INDEX.has(symbol) ? "米国株指数" : "海外その他";
  return "海外その他";           // 商品・金利・通貨指数・暗号資産・ETF
}

// 米国株指数の中の並び。主要なものを先に、残りはサブ指数として後ろへ
const US_MAIN = ["^DJI", "^GSPC", "^IXIC", "^NDX", "^RUT", "^SOX"];

// 日本株指数の中の並び。名前がそのまま一致するものを先頭に置く
const JP_MAIN = [
  "TOPIX (東証株価指数)",
  "日経平均株価",
  "日経半導体株指数",
  "日経平均ボラティリティー・インデックス",
  "日経平均内需株50指数",
  "日経平均外需株50指数"
];

// 東証33業種
const GYOSHU = new Set([
  "水産・農林業", "鉱業", "建設業", "食料品", "繊維製品", "パルプ・紙", "化学",
  "医薬品", "石油・石炭製品", "ゴム製品", "ガラス・土石製品", "鉄鋼", "非鉄金属",
  "金属製品", "機械", "電気機器", "輸送用機器", "精密機器", "その他製品",
  "電気・ガス業", "陸運業", "海運業", "空運業", "倉庫・運輸関連業", "情報・通信業",
  "卸売業", "小売業", "銀行業", "証券、商品先物取引業", "保険業", "その他金融業",
  "不動産業", "サービス業"
]);

// 分野の中の並び
//   日本株指数 … TOPIX → 日経平均 → 日経半導体 → 日経VI → 内需50 → 外需50 →
//                 日経のほか → TOPIX系 → 業種別 → 残り
//   米国株指数 … NYダウ → S&P500 → ナスダック → ラッセル → SOX → サブ指数
function subRank(c) {
  if (c.group === "日本株指数") {
    const j = JP_MAIN.indexOf(c.label);
    if (j >= 0) return j;
    if (c.label.startsWith("日経")) return 10;      // 日経のほか
    if (c.label.includes("TOPIX")) return 11;       // TOPIX系
    if (GYOSHU.has(c.label)) return 12;             // 業種別
    return 13;                                       // REIT・市場区分・規模別など
  }
  if (c.group === "米国株指数") {
    const i = US_MAIN.indexOf(c.sym);
    return i < 0 ? 99 : i;
  }
  return 0;
}

// 同じ指数が2か所から入っているもの。候補には出さない
//   日経平均は Yahoo（^N225）で1985年から揃っているので、そちらに寄せる
const HIDDEN = new Set(["nikkei:日経平均株価"]);

// 選べる銘柄の一覧を作る（その年に値がある銘柄）
async function buildCatalog(year) {
  const cat = [];
  const seen = new Set(HIDDEN);

  // 銘柄名だけを出す。コードを添えるのは個別株だけ。
  // 指数や商品にコードを出しても読む側には意味がない
  const WITH_CODE = new Set(["個別株", "日本株"]);

  for (const r of await fetchCsv(`data/overseas_${year}.csv`)) {
    const key = "yahoo:" + r.symbol;
    if (!seen.has(key)) {
      seen.add(key);
      const code = WITH_CODE.has(r.category) ? `（${r.symbol}）` : "";
      cat.push({ key, label: r.name + code, group: groupOf(r.category, r.symbol), sym: r.symbol });
    }
  }
  for (const r of await fetchCsv("data/jpx_index.csv")) {
    const key = "jpx:" + r.name;
    if (!seen.has(key)) { seen.add(key); cat.push({ key, label: r.name, group: "日本株指数" }); }
  }
  for (const r of await fetchCsv("data/nikkei_ohlc.csv")) {
    const key = "nikkei:" + r.name;
    if (!seen.has(key)) { seen.add(key); cat.push({ key, label: r.name, group: "日本株指数" }); }
  }
  // 分野の順、分野の中は名前順
  cat.sort((a, b) =>
    GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group) ||
    subRank(a) - subRank(b) ||
    a.label.localeCompare(b.label, "ja")
  );
  return cat;
}

// 1銘柄ぶんの「日付 → 終値」を返す
async function seriesOf(key, year) {
  const [src, id] = splitKey(key);
  const map = new Map();
  if (src === "yahoo") {
    for (const r of await fetchCsv(`data/overseas_${year}.csv`)) {
      if (r.symbol === id && r.close !== "") map.set(r.trade_date, r.close);
    }
  } else if (src === "jpx") {
    for (const r of await fetchCsv("data/jpx_index.csv")) {
      if (r.name === id && r.close !== "" && r.trade_date.startsWith(year)) {
        map.set(r.trade_date, r.close);
      }
    }
  } else if (src === "nikkei") {
    for (const r of await fetchCsv("data/nikkei_ohlc.csv")) {
      if (r.name === id && r.close !== "" && r.trade_date.startsWith(year)) {
        map.set(r.trade_date, r.close);
      }
    }
  }
  return map;
}

function splitKey(key) {
  const i = key.indexOf(":");
  return [key.slice(0, i), key.slice(i + 1)];
}

function labelOf(key, catalog) {
  const hit = catalog.find((c) => c.key === key);
  if (hit) return hit.label;
  return splitKey(key)[1];       // その年に無い銘柄は素の名前を出す
}

/* ---------------------------------------------------------------
   列の幅。見出しの右端を掴んで動かす。幅は覚えさせる
--------------------------------------------------------------- */
const DATE_COL = "__date__";
const DEFAULT_W = { [DATE_COL]: 110, __plus__: 44 };

function widthOf(key) {
  return settings.widths[key] || DEFAULT_W[key] || 130;
}

function makeGrip(key, col) {
  const grip = document.createElement("div");
  grip.className = "grip";
  grip.title = "掴んで幅を変える";
  grip.addEventListener("mousedown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    const x0 = e.clientX;
    const w0 = col.getBoundingClientRect ? parseInt(col.style.width, 10) || widthOf(key) : widthOf(key);
    const move = (ev) => {
      const w = Math.max(50, w0 + (ev.clientX - x0));
      col.style.width = w + "px";
      settings.widths[key] = w;
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      saveSettings();
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  // 取っ手を二度押しすると既定の幅へ戻す
  grip.addEventListener("dblclick", (e) => {
    e.stopPropagation();
    delete settings.widths[key];
    col.style.width = widthOf(key) + "px";
    saveSettings();
  });
  return grip;
}

function fmt(v) {
  const n = Number(v);
  if (!isFinite(n)) return v;
  return n.toLocaleString("ja-JP", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// チャートの目盛。3桁区切りは出さない。小数も出さない。
// ただし目盛の幅が1未満のとき（金利や為替）は、整数にすると同じ数字が
// 並んでしまうので、その幅に必要なぶんだけ小数を残す
function fmtAxis(v, step) {
  const n = Number(v);
  if (!isFinite(n)) return v;
  if (!(step < 1)) return String(Math.round(n));
  const d = Math.max(0, Math.ceil(-Math.log10(step)));
  return n.toFixed(d);
}

/* ---------------------------------------------------------------
   チャート。いま表に出ている分をそのまま折れ線にする

   配色は表と同じものを使う（--bg / --fg / --line / --dim）。
   横軸の目盛は1か月ごと。線は日足。
--------------------------------------------------------------- */
const chartEl = document.getElementById("chart");

// 目盛の幅。R÷6 にいちばん近い「きりのいい数」を選ぶ
//   きりのいい数 … 1 / 2 / 2.5 / 5 の 10のべき乗倍。同点なら小さい方
//   R=1000→200  3000→500  4000→500  5000→1000  8000→1000  10000→2000
function niceStep(range) {
  const t = range / 6;
  const k = Math.floor(Math.log10(t));
  let best = null;
  for (const e of [k - 1, k, k + 1]) {
    for (const m of [1, 2, 2.5, 5]) {
      const step = m * Math.pow(10, e);
      if (step <= 0) continue;
      const d = Math.abs(step - t);
      if (!best || d < best.d - 1e-12 || (Math.abs(d - best.d) < 1e-12 && step < best.step)) {
        best = { d, step };
      }
    }
  }
  return best.step;
}

// 目盛の幅と上下端を決める。線は4〜10本に収める
function scaleOf(lo, hi) {
  let step = niceStep(hi - lo || Math.abs(hi) || 1);
  for (let n = 0; n < 8; n++) {
    const bottom = Math.floor(lo / step) * step;
    const top = Math.ceil(hi / step) * step;
    const lines = Math.round((top - bottom) / step) + 1;
    if (lines < 4) { step /= 2; continue; }      // 少なすぎたら細かく
    if (lines > 10) { step *= 2; continue; }     // 多すぎたら粗く
    return { step, bottom, top, lines };
  }
  const bottom = Math.floor(lo / step) * step;
  const top = Math.ceil(hi / step) * step;
  return { step, bottom, top, lines: Math.round((top - bottom) / step) + 1 };
}

// 移動平均。押した分だけ点線で重ねる。線の形で見分ける
const MA_LINES = [
  { n: 20,  dash: "5 3" },
  { n: 80,  dash: "10 4" },
  { n: 200, dash: "2 4" }
];

// 移動平均を出す。前年ぶんも入れた並びで計算し、表に出ている分だけ返す
function movingAverage(all, from, n) {
  const out = new Map();
  let sum = 0;
  for (let i = 0; i < all.length; i++) {
    sum += all[i].v;
    if (i >= n) sum -= all[i - n].v;
    if (i >= n - 1 && all[i].d >= from) out.set(all[i].d, sum / n);
  }
  return out;
}

// いま開いているチャートの中身。押し直しで描き直すために持っておく
let chartState = null;

async function openChart(title, key, map) {
  const days = [...map.keys()].sort();
  if (!days.length) return;

  // 移動平均は前年から続いていないと年初が出ない。前の年も読む
  const prev = await seriesOf(key, String(settings.year - 1));
  const all = [];
  [...prev.keys()].sort().forEach((d) => all.push({ d, v: Number(prev.get(d)) }));
  days.forEach((d) => all.push({ d, v: Number(map.get(d)) }));

  chartState = { title, days, map, all };
  drawChart();
  chartEl.classList.remove("hidden");
}

function drawChart() {
  const { title, days, map, all } = chartState;


  // 押されている移動平均を出す
  const shown = MA_LINES.filter((m) => settings.ma[m.n]).map((m) => ({
    ...m, line: movingAverage(all, days[0], m.n)
  }));

  // 上下の幅は、押しているかに関わらず 200MA を入れて決める。
  // 押すたびに縮尺が動くと、線の傾きが目で比べられなくなる。
  // 目盛の桁数が左の余白を決めるので、大きさより先に出す
  const vals = days.map((d) => Number(map.get(d)));
  movingAverage(all, days[0], 200).forEach((v) => vals.push(v));
  const sc = scaleOf(Math.min(...vals), Math.max(...vals));

  // 縦横 1 : 1.62 にするのは**描画部分**（枠の内側）。
  // 目盛の文字を置く余白は、その外側に必要なぶんだけ足す
  const RATIO = 1.62;

  // 左の余白は目盛の桁数で決める。等幅なので 1文字 ≒ 8.4px
  const widest = Math.max(...[sc.bottom, sc.top].map((v) => fmtAxis(v, sc.step).length));
  const L = Math.ceil(widest * 8.4) + 10;
  const R = 6, T = 8, B = 24;

  let ih = Math.round(gridEl.clientHeight / 2) - T - B;  // 描画部分の高さ
  ih = Math.max(160, Math.min(ih, window.innerHeight - 90 - T - B));
  let iw = Math.round(ih * RATIO);                       // 描画部分の幅
  const maxIW = window.innerWidth - 60 - L - R;
  if (iw > maxIW) { iw = maxIW; ih = Math.round(iw / RATIO); }

  const W = iw + L + R, H = ih + T + B;

  const x = (i) => L + (days.length === 1 ? iw / 2 : (iw * i) / (days.length - 1));
  const y = (v) => T + ih - (ih * (v - sc.bottom)) / (sc.top - sc.bottom);

  const parts = [];

  // 月ごとの細い縦線
  let prevMonth = "";
  days.forEach((d, i) => {
    const m = d.slice(0, 7);
    if (m === prevMonth) return;
    prevMonth = m;
    const px = x(i);
    parts.push(`<line x1="${px}" y1="${T}" x2="${px}" y2="${T + ih}" class="vline"/>`);
    parts.push(`<text x="${px}" y="${T + ih + 18}" class="lab" text-anchor="middle">${Number(d.slice(5, 7))}</text>`);
  });

  // きりのいい価格に横線
  for (let v = sc.bottom; v <= sc.top + sc.step / 2; v += sc.step) {
    const py = y(v);
    parts.push(`<line x1="${L}" y1="${py}" x2="${L + iw}" y2="${py}" class="hline"/>`);
    parts.push(`<text x="${L - 8}" y="${py + 5}" class="lab" text-anchor="end">${fmtAxis(v, sc.step)}</text>`);
  }

  parts.push(`<rect x="${L}" y="${T}" width="${iw}" height="${ih}" class="axis"/>`);

  // 移動平均。抜けている日はつながずに切る
  shown.forEach((m) => {
    let d = "", pen = false;
    days.forEach((day, i) => {
      const v = m.line.get(day);
      if (v === undefined) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    if (d) parts.push(`<path d="${d}" class="ma" stroke-dasharray="${m.dash}"/>`);
  });

  const dpath = days
    .map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(Number(map.get(d))).toFixed(1)}`)
    .join("");
  parts.push(`<path d="${dpath}" class="plot"/>`);

  const boxes = MA_LINES.map((m) =>
    `<label><input type="checkbox" data-ma="${m.n}"${settings.ma[m.n] ? " checked" : ""}><span class="bx"></span>${m.n}MA</label>`
  ).join("");

  const boxW = W + 8 * 2 + 2 * 2;      // padding と枠線のぶん
  chartEl.innerHTML = `
    <div class="box" style="width:${boxW}px">
      <div class="head">
        <div class="left"><span class="name">${title}</span><span class="ma-pick">${boxes}</span></div>
        <div class="sub">${days[0]} 〜 ${days[days.length - 1]}　${days.length}日</div>
      </div>
      <svg width="${W}" height="${H}">${parts.join("")}</svg>
    </div>`;

  chartEl.querySelectorAll("input[data-ma]").forEach((box) => {
    box.addEventListener("change", () => {
      settings.ma[box.dataset.ma] = box.checked;
      saveSettings();
      drawChart();
    });
  });
}

function closeChart() {
  chartEl.classList.add("hidden");
  chartEl.innerHTML = "";
}
// チャート以外を押したら消す
chartEl.addEventListener("click", (e) => {
  if (!e.target.closest(".box")) closeChart();
});

/* ---------------------------------------------------------------
   表を描く。縦は日付（上が過去）、横は銘柄
--------------------------------------------------------------- */
const gridEl = document.getElementById("grid");
const yearEl = document.getElementById("year");
const themeEl = document.getElementById("theme");
const statusEl = document.getElementById("status");

for (let y = 2026; y >= 1999; y--) {
  const o = document.createElement("option");
  o.value = String(y);
  o.textContent = `${y}年`;
  yearEl.appendChild(o);
}
yearEl.value = String(settings.year);

yearEl.addEventListener("change", () => {
  settings.year = Number(yearEl.value);
  saveSettings();
  render();
});
themeEl.addEventListener("click", nextTheme);

function openSheet() {
  titleEl.classList.add("hidden");
  sheetEl.classList.remove("hidden");
  render();
}

let rendering = 0;
async function render() {
  const mine = ++rendering;
  const year = String(settings.year);
  gridEl.innerHTML = '<div id="loading">読み込み中…</div>';
  statusEl.textContent = "";

  const catalog = await buildCatalog(year);
  const series = [];
  for (const key of settings.columns) series.push(await seriesOf(key, year));
  if (mine !== rendering) return;                 // 途中で年が変わったら捨てる

  const dates = new Set();
  series.forEach((m) => m.forEach((_, d) => dates.add(d)));
  const rows = [...dates].sort();                 // 上が過去、下が現在

  const table = document.createElement("table");

  // 幅は colgroup で決める（table-layout: fixed）
  const colgroup = document.createElement("colgroup");
  const cols = [];
  const addCol = (key) => {
    const c = document.createElement("col");
    c.style.width = widthOf(key) + "px";
    colgroup.appendChild(c);
    cols.push(c);
    return c;
  };
  const dateCol = addCol(DATE_COL);
  settings.columns.forEach((key) => addCol(key));
  addCol("__plus__");
  table.appendChild(colgroup);

  const thead = document.createElement("thead");
  const htr = document.createElement("tr");
  const corner = document.createElement("th");
  corner.className = "corner";
  corner.textContent = "日付";
  corner.appendChild(makeGrip(DATE_COL, dateCol));
  htr.appendChild(corner);

  settings.columns.forEach((key, i) => {
    const th = document.createElement("th");
    const wrap = document.createElement("div");
    wrap.className = "colhead";

    const sel = document.createElement("select");
    sel.className = "picker";
    sel.title = "銘柄を変える";
    // その年に値が無い銘柄も選び続けられるようにしておく
    if (!catalog.some((c) => c.key === key)) {
      const keep = document.createElement("option");
      keep.value = key;
      keep.textContent = labelOf(key, catalog);
      sel.appendChild(keep);
    }
    // 分野ごとに見出しを付けて区切る
    let box = null, cur = null;
    catalog.forEach((c) => {
      if (c.group !== cur) {
        cur = c.group;
        box = document.createElement("optgroup");
        box.label = cur;
        sel.appendChild(box);
      }
      const o = document.createElement("option");
      o.value = c.key;
      o.textContent = c.label;
      box.appendChild(o);
    });
    sel.value = key;
    sel.addEventListener("change", () => {
      settings.columns[i] = sel.value;
      saveSettings();
      render();
    });

    const del = document.createElement("button");
    del.textContent = "×";
    del.title = "この列を消す";
    del.addEventListener("click", () => {
      settings.columns.splice(i, 1);
      saveSettings();
      render();
    });

    const arrow = document.createElement("button");
    arrow.textContent = "▼";
    arrow.title = "銘柄を変える";

    // ▼ と選択を重ねる。▼を押すと候補が開く
    const pick = document.createElement("div");
    pick.className = "pickwrap";
    pick.append(arrow, sel);

    const ops = document.createElement("div");
    ops.className = "ops";
    ops.append(del, pick);        // 名前の下に横並びで置く

    const nameEl = document.createElement("div");
    nameEl.className = "name";
    nameEl.textContent = labelOf(key, catalog);
    nameEl.title = "押すとチャート";
    // 名前を押すと、いま画面に出ている分のチャートを出す
    nameEl.addEventListener("click", () => openChart(nameEl.textContent, key, series[i]));

    wrap.append(nameEl, ops);
    th.appendChild(wrap);
    th.appendChild(makeGrip(key, cols[i + 1]));
    htr.appendChild(th);
  });

  const addTh = document.createElement("th");
  const add = document.createElement("button");
  add.className = "addcol";
  add.textContent = "＋";
  add.title = "列を足す";
  add.addEventListener("click", () => {
    const first = catalog.find((c) => !settings.columns.includes(c.key));
    settings.columns.push(first ? first.key : "yahoo:^GSPC");
    saveSettings();
    render();
  });
  addTh.appendChild(add);
  htr.appendChild(addTh);
  thead.appendChild(htr);

  const tbody = document.createElement("tbody");
  for (const d of rows) {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = d;
    tr.appendChild(th);
    series.forEach((m) => {
      const td = document.createElement("td");
      const v = m.get(d);
      if (v === undefined) { td.textContent = "#N/A"; td.className = "na"; }
      else td.textContent = fmt(v);
      tr.appendChild(td);
    });
    tr.appendChild(document.createElement("td"));
    tbody.appendChild(tr);
  }

  table.append(thead, tbody);
  gridEl.innerHTML = "";
  gridEl.appendChild(table);
  statusEl.textContent = `${rows.length}日 × ${settings.columns.length}銘柄`;
}
</script>
