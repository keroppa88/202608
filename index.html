<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>相場データ</title>
<style>
  /* 配色は :root の変数だけで切り替える。全画面に波及する */
  :root {
    --bg:      #000000;
    --fg:      #33ff66;
    --fg2:     #33ff66;
    --line:    #33ff66;
    --panel:   #000000;
    --sel-bg:  #33ff66;
    --sel-fg:  #000000;
    --dim:     #1a7a33;
  }
  html[data-theme="light"] {
    --bg: #ffffff; --fg: #000000; --fg2: #000000; --line: #000000;
    --panel: #ffffff; --sel-bg: #000000; --sel-fg: #ffffff; --dim: #888888;
  }
  /* 以下3つは提案。夜 / 紙 / 熾火 */
  html[data-theme="midnight"] {
    --bg: #14181f; --fg: #d6dee8; --fg2: #7fb2ff; --line: #2c3644;
    --panel: #1a1f28; --sel-bg: #7fb2ff; --sel-fg: #14181f; --dim: #6b7787;
  }
  html[data-theme="paper"] {
    --bg: #f4efe4; --fg: #33302a; --fg2: #7a5c3e; --line: #cabfa9;
    --panel: #ece5d6; --sel-bg: #7a5c3e; --sel-fg: #f4efe4; --dim: #a1957f;
  }
  html[data-theme="ember"] {
    --bg: #1b1a17; --fg: #e6dac4; --fg2: #e0863a; --line: #3d3830;
    --panel: #221f1b; --sel-bg: #e0863a; --sel-fg: #1b1a17; --dim: #7c7263;
  }
  /* ここから5つ。琥珀端末 / 青画面 / 相場端末 / 深緑 / 桜 */
  html[data-theme="amber"] {
    --bg: #000000; --fg: #ffb000; --fg2: #ffb000; --line: #ffb000;
    --panel: #000000; --sel-bg: #ffb000; --sel-fg: #000000; --dim: #7a5400;
  }
  html[data-theme="blue"] {
    --bg: #000080; --fg: #ffffff; --fg2: #ffe066; --line: #5566cc;
    --panel: #0000a8; --sel-bg: #ffffff; --sel-fg: #000080; --dim: #9aa4e0;
  }
  html[data-theme="desk"] {
    --bg: #0a0a0a; --fg: #ededed; --fg2: #ff9d2f; --line: #333333;
    --panel: #161616; --sel-bg: #ff9d2f; --sel-fg: #0a0a0a; --dim: #767676;
  }
  html[data-theme="deep"] {
    --bg: #002b36; --fg: #94a5a5; --fg2: #b58900; --line: #0b3f4c;
    --panel: #073642; --sel-bg: #b58900; --sel-fg: #002b36; --dim: #587680;
  }
  html[data-theme="sakura"] {
    --bg: #fbf0f2; --fg: #3a2b30; --fg2: #b3506b; --line: #e2c4cc;
    --panel: #f4e2e6; --sel-bg: #b3506b; --sel-fg: #fbf0f2; --dim: #a4868e;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "MS Gothic", "Osaka-Mono", "Courier New", monospace;
    font-size: 14px;
  }
  .hidden { display: none !important; }

  /* ---- タイトル画面 ---- */
  #title {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
  }
  #title h1 { font-size: 22px; letter-spacing: .4em; margin: 0 0 8px; font-weight: normal; }
  #title .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .menu { display: flex; flex-direction: column; gap: 14px; }
  .menu button {
    width: 320px; padding: 18px 0;
    background: var(--panel); color: var(--fg);
    border: 2px solid var(--line);
    font: inherit; font-size: 18px; letter-spacing: .3em;
    cursor: pointer;
  }
  .menu button[aria-selected="true"] { background: var(--sel-bg); color: var(--sel-fg); }
  .menu button:disabled { color: var(--dim); border-color: var(--dim); cursor: default; }
  .menu button[aria-selected="true"]:disabled { background: var(--dim); color: var(--bg); }
  #title .hint { color: var(--dim); font-size: 12px; }

  /* ---- 表画面 ---- */
  #sheet { height: 100%; display: flex; flex-direction: column; }
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  /* ひとつずつ枠で囲う */
  .bar button, .bar select {
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); font: inherit;
    padding: 4px 12px; cursor: pointer;
  }
  .bar select { padding-right: 6px; }
  .bar .spacer { flex: 1; }
  .bar .note { padding: 4px 6px; color: var(--dim); }

  .grid { flex: 1; overflow: auto; }

  /* スクロールの棒。配色に合わせて自分で描く。
     Firefox はこの2行だけ効く */
  .grid { scrollbar-color: var(--fg) var(--bg); scrollbar-width: thin; }
  .grid::-webkit-scrollbar { width: 13px; height: 13px; }
  .grid::-webkit-scrollbar-track {
    background: var(--bg);
    border-left: 1px solid var(--line);
    border-top: 1px solid var(--line);
  }
  .grid::-webkit-scrollbar-thumb {
    background: var(--fg);
    border: 3px solid var(--bg);   /* 内側を空けて細く見せる */
  }
  .grid::-webkit-scrollbar-thumb:hover { background: var(--fg2); }
  .grid::-webkit-scrollbar-corner { background: var(--bg); }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed; }
  th, td {
    border: 1px solid var(--line);
    padding: 3px 10px;
    white-space: nowrap;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 見出しの右端を掴むと幅を変えられる */
  .grip {
    position: absolute; top: 0; right: -3px; width: 7px; height: 100%;
    cursor: col-resize; user-select: none;
  }
  .grip:hover { background: var(--fg2); opacity: .5; }
  /* sticky は位置指定なので、取っ手はこの中に絶対配置できる */
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--panel); color: var(--fg2);
    text-align: center;
  }
  thead th.corner { left: 0; z-index: 3; }
  tbody th {
    position: sticky; left: 0; z-index: 1;
    background: var(--panel); color: var(--fg2);
    text-align: left; font-weight: normal;
  }
  td.na { color: var(--dim); }
  /* 見出しは幅を狭めると2行3行に折り返す */
  thead th { white-space: normal; }
  /* 名前が横幅を丸ごと使う。× と ▼ はマス目の下辺に貼り付ける。
     横は詰まっているので操作の記号に幅を割かない。
     名前の長さで位置がずれないよう、全列そろえて一番下に置く */
  /* セルの中身を下へ寄せる。行の高さは一番背の高い見出しで決まるので、
     これだけで全列の × ▼ が下辺にそろう */
  thead th { vertical-align: bottom; }
  .colhead { display: block; }
  .colhead .name {
    font-size: 12px; line-height: 1.25;
    word-break: break-all;      /* 銘柄名は途中でも折る */
    text-align: center;
    cursor: pointer;            /* 押すとチャート */
  }
  .colhead .ops {
    display: flex; justify-content: center; gap: 6px;
    line-height: 1; margin-top: 2px;
    flex: none;
  }
  /* 四本値のとき、× ▼ は4列のうち左端だけに出す。
     残りの3列は同じ高さの空きを置いて、下辺の位置をそろえる */
  .colhead .ops.blank { visibility: hidden; }
  .colhead .field { font-size: 12px; line-height: 1.25; text-align: center; }
  .colhead .ops button {
    background: none; border: 0; color: var(--fg);
    font: inherit; font-size: 11px; cursor: pointer; padding: 0 2px;
    position: relative; z-index: 3;
  }
  /* ▼ の上に重ねた選択。押すと候補が開く。見た目には出さない */
  .pickwrap { position: relative; display: block; }
  .picker {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
    font: inherit; z-index: 4;
  }
  .grip { z-index: 5; }

  /* ---- チャート画面 ---- */
  #charts { height: 100%; display: flex; flex-direction: column; }
  /* 銘柄の選択欄。既定5・最大10 */
  .picks {
    display: flex; flex-wrap: wrap; gap: 6px 10px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  .picks .one {
    display: inline-flex; align-items: center; gap: 3px;
    border: 1px solid var(--line); padding: 1px 4px;
    position: relative;
  }
  .picks .one .nm { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picks .one button {
    background: none; border: 0; color: var(--fg);
    font: inherit; font-size: 11px; cursor: pointer; padding: 0 4px;
    /* 選択は枠いっぱいに透明で重なっている。× はその上に出す */
    position: relative; z-index: 2;
  }
  .picks .one select {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; font: inherit;
  }
  .picks .add {
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); font: inherit; cursor: pointer; padding: 1px 8px;
  }
  .canvas {
    flex: 1; overflow: auto;
    padding: 10px;
    scrollbar-color: var(--fg) var(--bg); scrollbar-width: thin;
  }
  .canvas::-webkit-scrollbar { width: 13px; height: 13px; }
  .canvas::-webkit-scrollbar-track { background: var(--bg); border-left: 1px solid var(--line); }
  .canvas::-webkit-scrollbar-thumb { background: var(--fg); border: 3px solid var(--bg); }
  .canvas::-webkit-scrollbar-corner { background: var(--bg); }
  .canvas .one-chart { margin-bottom: 14px; }
  .canvas .cap { margin-bottom: 3px; }
  .canvas svg { display: block; }
  .canvas .axis { stroke: var(--line); fill: none; }
  .canvas .vline, .canvas .hline { stroke: var(--dim); stroke-width: .5; }
  .canvas .lab { fill: var(--fg); font-size: 14px; font-weight: bold; }
  .canvas .plot { fill: none; stroke-width: 1.2; }

  /* ---- 相関分析画面 ---- */
  #correlations { height: 100%; display: flex; flex-direction: column; }
  .corr-periods { display: inline-flex; gap: 4px; }
  .corr-periods button.active { background: var(--sel-bg); color: var(--sel-fg); }
  .corr-main {
    flex: 1; overflow: auto; padding: 10px;
    scrollbar-color: var(--fg) var(--bg); scrollbar-width: thin;
  }
  .corr-main::-webkit-scrollbar { width: 13px; height: 13px; }
  .corr-main::-webkit-scrollbar-track { background: var(--bg); border: 1px solid var(--line); }
  .corr-main::-webkit-scrollbar-thumb { background: var(--fg); border: 3px solid var(--bg); }
  .corr-block { margin-bottom: 16px; border: 1px solid var(--line); background: var(--panel); }
  .corr-block h2 {
    margin: 0; padding: 6px 9px; border-bottom: 1px solid var(--line);
    font-size: 14px; font-weight: normal; display: flex; align-items: center; gap: 7px;
  }
  .corr-block.collapsed h2 { border-bottom: 0; }
  .corr-block.collapsed .corr-body { display: none; }
  .corr-block.corr-dragging { opacity: .45; }
  .corr-block.corr-drop-before { box-shadow: 0 -3px 0 var(--fg2); }
  .corr-block.corr-drop-after { box-shadow: 0 3px 0 var(--fg2); }
  .corr-block h2.corr-drag-handle { cursor: grab; user-select: none; touch-action: none; }
  .corr-block h2.corr-drag-handle:active { cursor: grabbing; }
  .corr-head-label { min-width: 0; }
  .corr-drag-mark { color: var(--dim); flex: none; }
  .corr-head-actions { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; flex: none; }
  .corr-info-btn {
    width: 18px; height: 18px; padding: 0; border: 1px solid var(--line); border-radius: 50%;
    background: var(--panel); color: var(--fg); font: bold 12px/16px "Courier New", monospace;
    text-align: center; cursor: pointer; flex: none;
  }
  .corr-info-btn:hover, .corr-info-btn:focus { background: var(--sel-bg); color: var(--sel-fg); outline: none; }
  .corr-block-btn {
    min-width: 22px; height: 20px; padding: 0 5px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font: inherit; line-height: 18px; cursor: pointer;
  }
  .corr-block-btn:hover, .corr-block-btn:focus { background: var(--sel-bg); color: var(--sel-fg); outline: none; }
  .corr-body { padding: 8px; }
  .corr-scroll { overflow: auto; max-height: 62vh; }
  .corr-table { table-layout: auto; min-width: 100%; }
  .corr-table th, .corr-table td { padding: 4px 8px; }
  .corr-table thead th { top: 0; z-index: 4; }
  .corr-table tbody th { left: 0; z-index: 3; }
  .corr-matrix td:not(.na), .corr-pairs tbody tr { cursor: pointer; }
  .corr-matrix td:hover, .corr-pairs tbody tr:hover { background: var(--sel-bg); color: var(--sel-fg); }
  .corr-sort { cursor: pointer; user-select: none; }
  .corr-cards { display: flex; flex-wrap: wrap; gap: 8px; }
  .corr-card { border: 1px solid var(--line); padding: 8px 14px; min-width: 130px; }
  .corr-card .v { display: block; margin-top: 3px; font-size: 20px; }
  .corr-chart { position: relative; }
  .corr-chart-range {
    display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-bottom: 6px;
  }
  .corr-chart-range select {
    min-width: 72px; padding: 2px 5px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font: inherit; cursor: pointer;
  }
  .corr-series-picks { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .corr-series-pick {
    padding: 3px 8px; border: 1px solid var(--series-color); background: var(--bg);
    color: var(--series-color); font: inherit; cursor: pointer;
  }
  .corr-series-pick.off { background: var(--series-color); color: var(--bg); }
  .corr-chart svg { display: block; width: 100%; height: auto; cursor: crosshair; }
  .corr-chart .axis { stroke: var(--line); fill: none; }
  .corr-chart .gridline { stroke: var(--dim); stroke-width: .6; }
  .corr-chart .zero { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 4 3; }
  .corr-chart .plot { fill: none; stroke-width: 1.4; }
  .corr-chart .lab { fill: var(--fg); font-size: 12px; }
  .corr-tip {
    position: absolute; display: none; pointer-events: none; white-space: pre;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 5px 7px;
  }
  #corr-info-modal {
    position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(0, 0, 0, .66);
  }
  #corr-info-modal .info-box {
    width: min(760px, 100%); max-height: 86vh; overflow: auto;
    border: 2px solid var(--line); background: var(--bg); color: var(--fg); padding: 12px 16px 16px;
  }
  #corr-info-modal .info-head { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  #corr-info-modal h3 { margin: 0; font-size: 16px; font-weight: normal; flex: 1; }
  #corr-info-modal h4 { margin: 14px 0 5px; font-size: 14px; color: var(--fg2); }
  #corr-info-modal p { margin: 4px 0; line-height: 1.65; white-space: pre-line; }
  #corr-info-modal .formula { border-left: 2px solid var(--line); padding-left: 10px; color: var(--fg2); }
  #corr-info-modal .info-close {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); font: inherit; cursor: pointer; padding: 3px 9px;
  }

  /* ---- チャート（ポップアップ） ---- */
  #chart {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, .55);
    display: flex; align-items: center; justify-content: center;
  }
  /* 枠の幅は SVG に合わせて決め打ちする。
     見出しが長くても横に伸ばさない。伸ばすと縦横比（1:1.62）が崩れる */
  #chart .box {
    background: var(--bg); color: var(--fg);
    border: 2px solid var(--line);
    padding: 8px 8px 6px;
  }
  /* チャートの中の字は全部おなじ。表の数字と同じ書体・大きさで、太字 */
  #chart .box, #chart text {
    font-family: "MS Gothic", "Osaka-Mono", "Courier New", monospace;
    font-size: 14px;
    font-weight: bold;
  }
  #chart .head {
    display: flex; justify-content: space-between; gap: 8px 20px;
    flex-wrap: wrap;                 /* 入らなければ行を変える */
    margin-bottom: 4px;
  }
  #chart .head .sub { color: var(--fg); }
  #chart svg { display: block; }
  #chart .axis { stroke: var(--line); fill: none; }
  #chart .vline { stroke: var(--dim); stroke-width: .5; }
  #chart .hline { stroke: var(--dim); stroke-width: .5; }
  #chart .lab { fill: var(--fg); }
  #chart .plot { stroke: var(--fg); fill: none; stroke-width: 1.2; }
  /* ローソク足。上げた日は枠だけ、下げた日は塗りつぶし */
  #chart .cs { stroke: var(--fg); fill: none; stroke-width: 1; }
  #chart .cs.dn { fill: var(--fg); }
  #chart .ma { stroke: var(--fg); fill: none; stroke-width: 1; opacity: .75; }
  #chart .head .left {
    display: flex; align-items: center; gap: 8px 16px;
    flex-wrap: wrap; min-width: 0;
  }
  #chart .head .name { word-break: break-all; }
  #chart .ma-pick { display: flex; gap: 12px; color: var(--fg); flex: none; }
  #chart .ma-pick label {
    cursor: pointer; user-select: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  #chart .ma-pick input { position: absolute; opacity: 0; width: 0; height: 0; }
  #chart .ma-pick .bx {
    display: inline-block; width: 12px; height: 12px;
    border: 1px solid var(--fg);
    background: var(--bg);
  }
  #chart .ma-pick input:checked + .bx { background: var(--fg); }
  .addcol {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    font: inherit; cursor: pointer; padding: 2px 10px;
  }
  #loading { padding: 20px; color: var(--dim); }

  /* ---- 擬似スクリーンセーバー。画面の上を虫が動くだけ ---- */
  /* 白っぽい地に色の折れ線は飛んで見えにくい。相対チャートだけ太くする */
  html[data-theme="light"] .canvas .plot.rel,
  html[data-theme="paper"] .canvas .plot.rel,
  html[data-theme="sakura"] .canvas .plot.rel { stroke-width: 2; }

  #saver {
    position: fixed; inset: 0; z-index: 90;
    pointer-events: none;               /* 板は素通し。下の操作を邪魔しない */
    overflow: hidden;
  }
  #saver svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #saver .bug {
    fill: none; stroke: var(--fg); stroke-width: 1.3;
    stroke-linecap: round; stroke-linejoin: round;
  }
  /* 体は塗りつぶし。境目は背景色の線で分ける */
  #saver .body { fill: var(--fg); stroke: var(--bg); stroke-width: 1.2; }
  #saver .seam { stroke: var(--bg); }
  #saver .seg { stroke-width: .8; }         /* ムカデの節。切れ目は細く */
  /* 地の色で抜くところ */
  #saver .hollow { fill: var(--bg); stroke: var(--fg); stroke-width: 1.2; }
  /* 飛ぶものもムカデ・丸と同じ配色テーマにそろえる */
  #saver .fly-fill { fill: var(--fg); stroke: var(--fg); stroke-width: 1.2; }
  #saver .fly-line {
    fill: none; stroke: var(--fg); stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  #saver .fly-pattern { fill: none; stroke: var(--fg); stroke-width: 2.4; }
</style>
</head>
<body>

<!-- ===================== タイトル画面 ===================== -->
<section id="title">
  <h1>相 場 デ ー タ</h1>
  <div class="sub">1999 - 2026</div>
  <div class="menu" id="titleMenu">
    <button data-go="sheet" aria-selected="true">表</button>
    <button data-go="chart">チャート</button>
    <button data-go="correlation">相関</button>
  </div>
  <div class="hint">↑ ↓ で選択　Enter で決定</div>
</section>

<!-- ===================== 相関分析画面 ===================== -->
<section id="correlations" class="hidden">
  <div class="bar">
    <button id="rback" title="タイトルへ戻る">戻る</button>
    <div class="corr-periods" id="rperiods" aria-label="相関期間">
      <button data-period="20">20日</button>
      <button data-period="60">60日</button>
      <button data-period="120">120日</button>
    </div>
    <button id="rtheme" title="押すたびに配色が変わる">Color</button>
    <div class="spacer"></div>
    <div class="note" id="rstatus"></div>
  </div>
  <div class="picks" id="rpicks"></div>
  <div class="corr-main" id="rmain"><div id="loading">読み込み中…</div></div>
</section>

<div id="corr-info-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="corr-info-title">
  <div class="info-box">
    <div class="info-head">
      <h3 id="corr-info-title"></h3>
      <button class="info-close" id="corr-info-close" aria-label="説明を閉じる">閉じる</button>
    </div>
    <div id="corr-info-content"></div>
  </div>
</div>

<!-- ===================== 表画面 ===================== -->
<section id="sheet" class="hidden">
  <div class="bar">
    <button id="back" title="タイトルへ戻る">戻る</button>

<script src="correlation.js"></script>
<script>
"use strict";

/* ---------------------------------------------------------------
   保存する設定。銘柄の並びと配色はブラウザに覚えさせる
--------------------------------------------------------------- */
const STORE = "soba.v2";
const DEFAULT_COLUMNS = [
  "yahoo:^N225",          // 日経平均
  "jpx:TOPIX",
  "nikkei:日経半導体株指数",
  "yahoo:^DJI",           // NYダウ
  "yahoo:^GSPC",          // S&P500
  "yahoo:^IXIC",          // ナスダック総合
  "yahoo:^SOX"            // SOX
];
// チャート画面の既定。5銘柄。＋で最大10まで
const MAX_SERIES = 10;
const DEFAULT_CHART_COLUMNS = [
  "yahoo:^N225",          // 日経平均
  "jpx:TOPIX",
  "yahoo:^DJI",           // NYダウ
  "yahoo:^GSPC",          // S&P500
  "yahoo:^SOX"            // SOX
];
// 表の四本値の既定。1銘柄で4列使う
const DEFAULT_OHLC_COLUMNS = DEFAULT_CHART_COLUMNS.slice();
const OHLC_FIELDS = [
  { f: "open", label: "始値" },
  { f: "high", label: "高値" },
  { f: "low", label: "安値" },
  { f: "close", label: "終値" }
];

// 呼び名を変えた銘柄。前に覚えた並びもここで読み替える
const RENAMED = { "jpx:TOPIX (東証株価指数)": "jpx:TOPIX" };

function fixKeys(list, fallback) {
  if (!Array.isArray(list) || !list.length) return fallback.slice();
  return list.map((k) => RENAMED[k] || k);
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "{}");
    return {
      theme: s.theme || "retro",
      year: s.year || 2026,
      columns: fixKeys(s.columns, DEFAULT_COLUMNS),
      widths: (s.widths && typeof s.widths === "object") ? s.widths : {},
      ma: (s.ma && typeof s.ma === "object") ? s.ma : { 20: false, 80: false, 200: false },
      chartType: s.chartType === "abs" ? "abs" : "rel",
      chartYear: s.chartYear || 2026,
      chartJoin: s.chartJoin === true,
      chartColumns: fixKeys(s.chartColumns, DEFAULT_CHART_COLUMNS).slice(0, MAX_SERIES),
      chartZoom: Number(s.chartZoom) > 0 ? Number(s.chartZoom) : 1,
      corrColumns: fixKeys(s.corrColumns, s.columns || DEFAULT_COLUMNS),
      corrPeriod: [20, 60, 120].includes(Number(s.corrPeriod)) ? Number(s.corrPeriod) : 20,
      corrStartYear: Number(s.corrStartYear) || 2000,
      corrEndYear: Number(s.corrEndYear) || new Date().getFullYear(),
      corrBlockOrder: Array.isArray(s.corrBlockOrder) ? s.corrBlockOrder.slice() : [],
      corrChartHidden: Array.isArray(s.corrChartHidden) ? s.corrChartHidden.slice() : [],
      sheetMode: s.sheetMode === "ohlc" ? "ohlc" : "close",
      ohlcColumns: fixKeys(s.ohlcColumns, DEFAULT_OHLC_COLUMNS),
      saverIndex: Number.isInteger(s.saverIndex) && s.saverIndex >= 0 ? s.saverIndex : 0
    };
  } catch (e) {
    return {
      theme: "retro", year: 2026, columns: DEFAULT_COLUMNS.slice(), widths: {},
      ma: { 20: false, 80: false, 200: false },
      chartType: "rel", chartYear: 2026, chartJoin: false,
      chartColumns: DEFAULT_CHART_COLUMNS.slice(),
      chartZoom: 1,
      corrColumns: DEFAULT_COLUMNS.slice(), corrPeriod: 20,
      corrStartYear: 2000, corrEndYear: new Date().getFullYear(),
      corrBlockOrder: [],
      corrChartHidden: [],
      sheetMode: "close", ohlcColumns: DEFAULT_OHLC_COLUMNS.slice(),
      saverIndex: 0
    };
  }
}
function saveSettings() {
  localStorage.setItem(STORE, JSON.stringify(settings));
}
let settings = loadSettings();

// 押すたびにこの順で回る。先頭が既定
const THEMES = ["retro", "light", "midnight", "paper", "ember",
                "amber", "blue", "desk", "deep", "sakura"];

function applyTheme(name) {
  if (!THEMES.includes(name)) name = THEMES[0];
  document.documentElement.dataset.theme = name;
  settings.theme = name;
  saveSettings();
}
function nextTheme() {
  const i = THEMES.indexOf(settings.theme);
  applyTheme(THEMES[(i + 1) % THEMES.length]);
  // 相対チャートの線の色は地の明るさで変わる。出ているなら描き直す
  if (!chartsEl.classList.contains("hidden")) drawCharts();
  if (!corrEl.classList.contains("hidden") && corrState) drawCorrelationResults();
}
applyTheme(settings.theme);

/* ---------------------------------------------------------------
   タイトル画面。↑↓ で選び Enter で決める
--------------------------------------------------------------- */
const titleEl = document.getElementById("title");
const sheetEl = document.getElementById("sheet");
const items = [...document.querySelectorAll("#titleMenu button")];
let cursor = 0;

function drawCursor() {
  items.forEach((b, i) => b.setAttribute("aria-selected", String(i === cursor)));
}
function decide() {
  const b = items[cursor];
  if (b.disabled) return;
  if (b.dataset.go === "sheet") openSheet();
  if (b.dataset.go === "chart") openCharts();
  if (b.dataset.go === "correlation") openCorrelations();
}
// 表を矢印で動かす幅。1回押すとこれだけ寄る
const STEP_X = 120;   // 列1つぶんくらい
const STEP_Y = 60;    // 行3つぶんくらい

document.addEventListener("keydown", (e) => {
  if (!titleEl.classList.contains("hidden")) {
    // タイトル画面。↑↓ で選び Enter で決める
    if (e.key === "ArrowDown") { cursor = (cursor + 1) % items.length; drawCursor(); e.preventDefault(); }
    if (e.key === "ArrowUp")   { cursor = (cursor - 1 + items.length) % items.length; drawCursor(); e.preventDefault(); }
    if (e.key === "Enter")     { decide(); e.preventDefault(); }
    return;
  }

  if (!corrEl.classList.contains("hidden")) {
    if (e.key === "Escape") {
      if (!corrInfoModal.classList.contains("hidden")) closeCorrInfo();
      else backFromCorrelations();
    }
    return;
  }

  // チャート画面。Esc で戻り、上下で年を変え、左右で寄せる
  if (!chartsEl.classList.contains("hidden")) {
    if (e.key === "Escape") { backFromCharts(); return; }
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      const y = stepYear(settings.chartYear, e.key === "ArrowUp" ? 1 : -1);
      if (y !== settings.chartYear) {
        settings.chartYear = y;
        cyearEl.value = String(y);
        saveSettings();
        drawCharts();
      }
      e.preventDefault();
      return;
    }
    const m = {
      ArrowLeft:  [-STEP_X, 0],
      ArrowRight: [STEP_X, 0],
      ArrowUp:    [0, -STEP_Y],
      ArrowDown:  [0, STEP_Y],
      PageUp:     [0, -canvasEl.clientHeight],
      PageDown:   [0, canvasEl.clientHeight]
    }[e.key];
    if (!m) return;
    canvasEl.scrollBy(m[0], m[1]);
    e.preventDefault();
    return;
  }

  if (e.key === "Escape") {
    if (!chartEl.classList.contains("hidden")) closeChart();
    else backToTitle();
    return;
  }

  // チャートを出している間は表を動かさない。
  // 左右で隣の銘柄へ、上下で年を変える。年は表にも効く
  if (!chartEl.classList.contains("hidden")) {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      openChartAt(chartState.index + (e.key === "ArrowRight" ? 1 : -1));
      e.preventDefault();
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      const y = stepYear(settings.year, e.key === "ArrowUp" ? 1 : -1);
      if (y !== settings.year) {
        const at = chartState.index;
        settings.year = y;
        yearEl.value = String(y);
        saveSettings();
        render().then(() => openChartAt(at));
      }
      e.preventDefault();
    }
    return;
  }

  // 表画面。矢印で上下左右へ寄せる
  const move = {
    ArrowLeft:  [-STEP_X, 0],
    ArrowRight: [STEP_X, 0],
    ArrowUp:    [0, -STEP_Y],
    ArrowDown:  [0, STEP_Y],
    PageUp:     [0, -gridEl.clientHeight],
    PageDown:   [0, gridEl.clientHeight],
    Home:       [-gridEl.scrollWidth, 0],
    End:        [gridEl.scrollWidth, 0]
  }[e.key];
  if (!move) return;

  gridEl.scrollBy(move[0], move[1]);
  e.preventDefault();          // 画面ごと動くのを止める
});
items.forEach((b, i) => {
  b.addEventListener("mouseenter", () => { cursor = i; drawCursor(); });
  b.addEventListener("click", () => { cursor = i; drawCursor(); decide(); });
});
drawCursor();

function backToTitle() {
  sheetEl.classList.add("hidden");
  titleEl.classList.remove("hidden");
}
document.getElementById("back").addEventListener("click", backToTitle);

/* ---------------------------------------------------------------
   データの読み込み。CSVはそのまま置いてあるものを読む

     yahoo:{シンボル}  data/overseas_{年}.csv
     jpx:{指数名}      data/jpx_index.csv
     nikkei:{指数名}   data/nikkei_ohlc.csv
     yomiuri:{指数名}  data/yomiuri333.csv
     ratio:{名前}      data/ratios.csv
     rates:{名前}      data/rates.csv

   どれも終値を出す。無い日は #N/A
--------------------------------------------------------------- */
const cache = new Map();

async function fetchCsv(path) {
  if (cache.has(path)) return cache.get(path);
  const p = fetch(path).then(async (r) => {
    if (!r.ok) return [];
    return parseCsv(await r.text());
  }).catch(() => []);
  cache.set(path, p);
  return p;
}

function parseCsv(text) {
  const lines = text.split("\n").filter((l) => l.length);
  if (!lines.length) return [];
  const head = splitLine(lines[0]);
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = splitLine(lines[i]);
    const row = {};
    head.forEach((h, j) => { row[h] = cells[j] === undefined ? "" : cells[j]; });
    out.push(row);
  }
  return out;
}

// 引用符つきのカンマ区切りを分ける
function splitLine(line) {
  const out = [];
  let cur = "", quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quoted) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; } else { quoted = false; }
      } else cur += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { out.push(cur); cur = ""; }
    else if (c !== "\r") cur += c;
  }
  out.push(cur);
  return out;
}

// 候補はこの順で並べる
const GROUPS = ["日本株指数", "米国株指数", "海外その他", "債券", "為替", "日本個別株", "海外個別株"];

// 米国の株価指数。ここに無い海外指数は「海外その他」へ入れる
const US_INDEX = new Set(["^DJI", "^IXIC", "^NDX", "^GSPC", "^RUT", "^SOX", "^VIX"]);

// symbols.csv の分類 → 画面での分野
function groupOf(category, symbol) {
  if (category === "日本指数" || category === "先物") return "日本株指数";
  if (category === "日本株") return "日本個別株";
  if (category === "個別株") return "海外個別株";
  if (category === "為替") return "為替";
  if (category === "セクター" || category === "REIT" || category === "ボラティリティ") return "米国株指数";
  if (category === "金利") return "債券";
  if (category === "海外指数") return US_INDEX.has(symbol) ? "米国株指数" : "海外その他";
  return "海外その他";           // 商品・通貨指数・暗号資産・ETF
}

// 米国株指数の中の並び。主要なものを先に、残りはサブ指数として後ろへ
const US_MAIN = ["^DJI", "^GSPC", "^IXIC", "^NDX", "^RUT", "^SOX"];

// 債券の中の並び。よく見るものを先に
const BOND_MAIN = [
  "日本 10年国債",
  "日本 無担保コール翌日物",
  "日本 公定歩合",
  "米10年債利回り",
  "米30年債利回り",
  "米5年債利回り",
  "米13週Tビル",
  "米国 10年国債",
  "アメリカ フェデラルファンド金利",
  "ドイツ 10年国債",
  "イギリス 10年国債",
  "ユーロ 市場調整金利",
  "中国 10年国債"
];

// 日本株指数の中の並び。名前がそのまま一致するものを先頭に置く
const JP_MAIN = [
  "TOPIX",
  "日経平均",
  "日経半導体株指数",
  "日経VI",
  "日経内需株50",
  "日経外需株50"
];

// 東証33業種
const GYOSHU = new Set([
  "水産・農林業", "鉱業", "建設業", "食料品", "繊維製品", "パルプ・紙", "化学",
  "医薬品", "石油・石炭製品", "ゴム製品", "ガラス・土石製品", "鉄鋼", "非鉄金属",
  "金属製品", "機械", "電気機器", "輸送用機器", "精密機器", "その他製品",
  "電気・ガス業", "陸運業", "海運業", "空運業", "倉庫・運輸関連業", "情報・通信業",
  "卸売業", "小売業", "銀行業", "証券、商品先物取引業", "保険業", "その他金融業",
  "不動産業", "サービス業"
]);

// 分野の中の並び
//   日本株指数 … TOPIX → 日経平均 → 日経半導体 → 日経VI → 内需50 → 外需50 →
//                 日経のほか → TOPIX系 → 業種別 → 残り
//   米国株指数 … NYダウ → S&P500 → ナスダック → ラッセル → SOX → サブ指数
function subRank(c) {
  if (c.group === "日本株指数") {
    const j = JP_MAIN.indexOf(c.label);
    if (j >= 0) return j;
    // 比率は一番後ろにまとめる。指数ではないので分けて置く。
    // 先導株比率は 1-5 → 1-10 → 1-20 → 1-30 の順。名前順だと 1-10 が先に来る
    if (c.label === "ドル建て日経平均") return 13.4;
    if (c.label === "NT倍率") return 13.5;
    const lead = /^東証先導株比率1-(\d+)$/.exec(c.label);
    if (lead) return 14 + Number(lead[1]) / 100;
    if (c.label === "日経/プライム・売買代金比率") return 14.99;
    // PER・PBR。比 → プライム → 日経 の順
    const PB = ["日経予想PER/プライム予想PER", "日経平均PBR/プライムPBR",
                "プライム予想PER", "日経予想PER",
                "プライムPBR", "日経平均PBR",
                "日本株イールドスプレッド"];
    const pb = PB.indexOf(c.label);
    if (pb >= 0) return 15 + pb / 100;
    if (c.label.startsWith("日経")) return 10;      // 日経のほか
    if (c.label.includes("TOPIX")) return 11;       // TOPIX系
    if (GYOSHU.has(c.label)) return 12;             // 業種別
    return 13;                                       // REIT・市場区分・規模別など
  }
  if (c.group === "米国株指数") {
    const i = US_MAIN.indexOf(c.sym);
    return i < 0 ? 99 : i;
  }
  if (c.group === "債券") {
    // 日本 → 米国 → そのほかの国。国ごとに国債利回りが先、政策金利が後
    const i = BOND_MAIN.indexOf(c.label);
    if (i >= 0) return i;
    if (c.label.startsWith("日本")) return 20;
    if (c.label.startsWith("米") || c.label.startsWith("アメリカ")) return 21;
    return 30;
  }
  return 0;
}

// 同じ指数が2か所から入っているもの。候補には出さない
//   日経平均は Yahoo（^N225）で1985年から揃っているので、そちらに寄せる
const HIDDEN = new Set(["nikkei:日経平均"]);

// 選べる銘柄の一覧を作る（その年に値がある銘柄）
// 四本値が4つとも入っているか
function hasOhlc(r) {
  return OHLC_FIELDS.every((x) => (r[x.f] || "").trim() !== "");
}

async function buildCatalog(year) {
  const cat = [];
  const seen = new Set(HIDDEN);

  // 銘柄名だけを出す。コードを添えるのは個別株だけ。
  // 指数や商品にコードを出しても読む側には意味がない
  const WITH_CODE = new Set(["個別株", "日本株"]);

  // その年の一番新しい日に四本値が揃っているかを見ておく。
  // 揃っているものだけが四本値の表に出せる
  const last = new Map();
  const note = (key, r) => {
    const cur = last.get(key);
    if (!cur || r.trade_date > cur.date) last.set(key, { date: r.trade_date, ohlc: hasOhlc(r) });
  };

  for (const r of await fetchCsv(`data/overseas_${year}.csv`)) {
    const key = "yahoo:" + r.symbol;
    note(key, r);
    if (!seen.has(key)) {
      seen.add(key);
      const code = WITH_CODE.has(r.category) ? `（${r.symbol}）` : "";
      cat.push({ key, label: r.name + code, group: groupOf(r.category, r.symbol), sym: r.symbol, category: r.category });
    }
  }
  for (const r of await fetchCsv("data/jpx_index.csv")) {
    const key = "jpx:" + r.name;
    if (r.trade_date.startsWith(year)) note(key, r);
    if (!seen.has(key)) { seen.add(key); cat.push({ key, label: r.name, group: "日本株指数" }); }
  }
  for (const r of await fetchCsv("data/nikkei_ohlc.csv")) {
    const key = "nikkei:" + r.name;
    if (r.trade_date.startsWith(year)) note(key, r);
    if (!seen.has(key)) { seen.add(key); cat.push({ key, label: r.name, group: "日本株指数" }); }
  }
  for (const r of await fetchCsv("data/yomiuri333.csv")) {
    const key = "yomiuri:" + r.name;
    if (r.trade_date.startsWith(year)) note(key, r);
    if (!seen.has(key)) { seen.add(key); cat.push({ key, label: r.name, group: "日本株指数" }); }
  }
  for (const r of await fetchCsv("data/ratios.csv")) {
    const key = "ratio:" + r.name;
    if (r.trade_date.startsWith(year)) note(key, r);
    if (!seen.has(key)) { seen.add(key); cat.push({ key, label: r.name, group: "日本株指数" }); }
  }
  // 国債利回りと政策金利。値の列が close ではなく value
  for (const r of await fetchCsv("data/rates.csv")) {
    const key = "rates:" + r.name;
    if (!seen.has(key)) { seen.add(key); cat.push({ key, label: r.name, group: "債券" }); }
  }
  cat.forEach((c) => { c.ohlc = !!(last.get(c.key) || {}).ohlc; });
  // 分野の順、分野の中は名前順
  cat.sort((a, b) =>
    GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group) ||
    subRank(a) - subRank(b) ||
    a.label.localeCompare(b.label, "ja")
  );
  return cat;
}

// 1銘柄ぶんの「日付 → 終値」を返す
async function seriesOf(key, year) {
  const [src, id] = splitKey(key);
  const map = new Map();
  if (src === "yahoo") {
    for (const r of await fetchCsv(`data/overseas_${year}.csv`)) {
      if (r.symbol === id && r.close !== "") map.set(r.trade_date, r.close);
    }
  } else if (src === "jpx") {
    for (const r of await fetchCsv("data/jpx_index.csv")) {
      if (r.name === id && r.close !== "" && r.trade_date.startsWith(year)) {
        map.set(r.trade_date, r.close);
      }
    }
  } else if (src === "nikkei") {
    for (const r of await fetchCsv("data/nikkei_ohlc.csv")) {
      if (r.name === id && r.close !== "" && r.trade_date.startsWith(year)) {
        map.set(r.trade_date, r.close);
      }
    }
  } else if (src === "yomiuri") {
    for (const r of await fetchCsv("data/yomiuri333.csv")) {
      if (r.name === id && r.close !== "" && r.trade_date.startsWith(year)) {
        map.set(r.trade_date, r.close);
      }
    }
  } else if (src === "ratio") {
    for (const r of await fetchCsv("data/ratios.csv")) {
      if (r.name === id && r.close !== "" && r.trade_date.startsWith(year)) {
        map.set(r.trade_date, r.close);
      }
    }
  } else if (src === "rates") {
    for (const r of await fetchCsv("data/rates.csv")) {
      if (r.name === id && r.value !== "" && r.trade_date.startsWith(year)) {
        map.set(r.trade_date, r.value);
      }
    }
  }
  return map;
}

// 1銘柄ぶんの「日付 → 四本値」を返す。4つとも揃っている日だけ
async function barsOf(key, year) {
  const [src, id] = splitKey(key);
  const map = new Map();
  const take = (rows, hit) => {
    for (const r of rows) {
      if (!hit(r) || !hasOhlc(r)) continue;
      map.set(r.trade_date, {
        open: r.open, high: r.high, low: r.low, close: r.close
      });
    }
  };
  if (src === "yahoo") {
    take(await fetchCsv(`data/overseas_${year}.csv`), (r) => r.symbol === id);
  } else if (src === "jpx") {
    take(await fetchCsv("data/jpx_index.csv"), (r) => r.name === id && r.trade_date.startsWith(year));
  } else if (src === "nikkei") {
    take(await fetchCsv("data/nikkei_ohlc.csv"), (r) => r.name === id && r.trade_date.startsWith(year));
  }
  return map;
}

function splitKey(key) {
  const i = key.indexOf(":");
  return [key.slice(0, i), key.slice(i + 1)];
}

function labelOf(key, catalog) {
  const hit = catalog.find((c) => c.key === key);
  if (hit) return hit.label;
  return splitKey(key)[1];       // その年に無い銘柄は素の名前を出す
}

/* ---------------------------------------------------------------
   列の幅。見出しの右端を掴んで動かす。幅は覚えさせる
--------------------------------------------------------------- */
const DATE_COL = "__date__";
const DEFAULT_W = { [DATE_COL]: 110, __plus__: 44 };

// 四本値の列幅は終値の表とは別に覚える。1銘柄4列ぶんが同じ幅で動く
const OHLC_W = 92;
const ohlcWidthKey = (key) => "ohlc|" + key;

function widthOf(key) {
  return settings.widths[key] || DEFAULT_W[key] ||
    (key.startsWith("ohlc|") ? OHLC_W : 130);
}

// col は1本でも、まとめて動かす複数本でもよい
function makeGrip(key, col) {
  const grip = document.createElement("div");
  grip.className = "grip";
  grip.title = "掴んで幅を変える";
  const cols = Array.isArray(col) ? col : [col];
  grip.addEventListener("mousedown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    const x0 = e.clientX;
    const w0 = parseInt(cols[0].style.width, 10) || widthOf(key);
    const move = (ev) => {
      const w = Math.max(50, w0 + (ev.clientX - x0));
      cols.forEach((c) => { c.style.width = w + "px"; });
      settings.widths[key] = w;
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      saveSettings();
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  // 取っ手を二度押しすると既定の幅へ戻す
  grip.addEventListener("dblclick", (e) => {
    e.stopPropagation();
    delete settings.widths[key];
    cols.forEach((c) => { c.style.width = widthOf(key) + "px"; });
    saveSettings();
  });
  return grip;
}

function fmt(v) {
  const n = Number(v);
  if (!isFinite(n)) return v;
  return n.toLocaleString("ja-JP", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// チャートの目盛。3桁区切りは出さない。小数も出さない。
// ただし目盛の幅が1未満のとき（金利や為替）は、整数にすると同じ数字が
// 並んでしまうので、その幅に必要なぶんだけ小数を残す
function fmtAxis(v, step) {
  const n = Number(v);
  if (!isFinite(n)) return v;
  if (!(step < 1)) return String(Math.round(n));
  const d = Math.max(0, Math.ceil(-Math.log10(step)));
  return n.toFixed(d);
}

/* ---------------------------------------------------------------
   チャート。いま表に出ている分をそのまま折れ線にする

   配色は表と同じものを使う（--bg / --fg / --line / --dim）。
   横軸の目盛は1か月ごと。線は日足。
--------------------------------------------------------------- */
const chartEl = document.getElementById("chart");

// 目盛の幅。R÷6 にいちばん近い「きりのいい数」を選ぶ
//   きりのいい数 … 1 / 2 / 2.5 / 5 の 10のべき乗倍。同点なら小さい方
//   R=1000→200  3000→500  4000→500  5000→1000  8000→1000  10000→2000
function niceStep(range) {
  const t = range / 6;
  const k = Math.floor(Math.log10(t));
  let best = null;
  for (const e of [k - 1, k, k + 1]) {
    for (const m of [1, 2, 2.5, 5]) {
      const step = m * Math.pow(10, e);
      if (step <= 0) continue;
      const d = Math.abs(step - t);
      if (!best || d < best.d - 1e-12 || (Math.abs(d - best.d) < 1e-12 && step < best.step)) {
        best = { d, step };
      }
    }
  }
  return best.step;
}

// 目盛の幅と上下端を決める。線は4〜10本に収める
function scaleOf(lo, hi) {
  let step = niceStep(hi - lo || Math.abs(hi) || 1);
  for (let n = 0; n < 8; n++) {
    const bottom = Math.floor(lo / step) * step;
    const top = Math.ceil(hi / step) * step;
    const lines = Math.round((top - bottom) / step) + 1;
    if (lines < 4) { step /= 2; continue; }      // 少なすぎたら細かく
    if (lines > 10) { step *= 2; continue; }     // 多すぎたら粗く
    return { step, bottom, top, lines };
  }
  const bottom = Math.floor(lo / step) * step;
  const top = Math.ceil(hi / step) * step;
  return { step, bottom, top, lines: Math.round((top - bottom) / step) + 1 };
}

// 移動平均。押した分だけ点線で重ねる。線の形で見分ける
const MA_LINES = [
  { n: 20,  dash: "5 3" },
  { n: 80,  dash: "10 4" },
  { n: 200, dash: "2 4" }
];

// 移動平均を出す。前年ぶんも入れた並びで計算し、表に出ている分だけ返す
function movingAverage(all, from, n) {
  const out = new Map();
  let sum = 0;
  for (let i = 0; i < all.length; i++) {
    sum += all[i].v;
    if (i >= n) sum -= all[i - n].v;
    if (i >= n - 1 && all[i].d >= from) out.set(all[i].d, sum / n);
  }
  return out;
}

// いま開いているチャートの中身。押し直しで描き直すために持っておく
let chartState = null;

async function openChart(title, key, map, bars, index) {
  const days = [...map.keys()].sort();
  if (!days.length) return;

  // 移動平均は前年から続いていないと年初が出ない。前の年も読む
  const prev = await seriesOf(key, String(settings.year - 1));
  const all = [];
  [...prev.keys()].sort().forEach((d) => all.push({ d, v: Number(prev.get(d)) }));
  days.forEach((d) => all.push({ d, v: Number(map.get(d)) }));

  chartState = { title, days, map, all, bars: bars || null, index: index || 0 };
  drawChart();
  chartEl.classList.remove("hidden");
}

function drawChart() {
  const { title, days, map, all, bars } = chartState;


  // 押されている移動平均を出す
  const shown = MA_LINES.filter((m) => settings.ma[m.n]).map((m) => ({
    ...m, line: movingAverage(all, days[0], m.n)
  }));

  // 上下の幅は、押しているかに関わらず 200MA を入れて決める。
  // 押すたびに縮尺が動くと、線の傾きが目で比べられなくなる。
  // 目盛の桁数が左の余白を決めるので、大きさより先に出す
  const vals = days.map((d) => Number(map.get(d)));
  if (bars) bars.forEach((b) => { vals.push(Number(b.high), Number(b.low)); });
  movingAverage(all, days[0], 200).forEach((v) => vals.push(v));
  const sc = scaleOf(Math.min(...vals), Math.max(...vals));

  // 縦横 1 : 1.62 にするのは**描画部分**（枠の内側）。
  // 目盛の文字を置く余白は、その外側に必要なぶんだけ足す
  const RATIO = 1.62;

  // 左の余白は目盛の桁数で決める。等幅なので 1文字 ≒ 8.4px
  const widest = Math.max(...[sc.bottom, sc.top].map((v) => fmtAxis(v, sc.step).length));
  const L = Math.ceil(widest * 8.4) + 10;
  const R = 6, T = 8, B = 24;

  let ih = Math.round(gridEl.clientHeight / 2) - T - B;  // 描画部分の高さ
  ih = Math.round(Math.max(160, ih) * settings.chartZoom);   // ホイールで伸び縮み
  let iw = Math.round(ih * RATIO);                       // 描画部分の幅

  // 画面からはみ出す分は詰める。縦横の比は変えない
  const maxIH = window.innerHeight - 90 - T - B;
  const maxIW = window.innerWidth - 60 - L - R;
  if (ih > maxIH) { ih = maxIH; iw = Math.round(ih * RATIO); }
  if (iw > maxIW) { iw = maxIW; ih = Math.round(iw / RATIO); }
  if (ih < 100) { ih = 100; iw = Math.round(ih * RATIO); }

  const W = iw + L + R, H = ih + T + B;

  const x = (i) => L + (days.length === 1 ? iw / 2 : (iw * i) / (days.length - 1));
  const y = (v) => T + ih - (ih * (v - sc.bottom)) / (sc.top - sc.bottom);

  const parts = [];

  // 月ごとの細い縦線
  let prevMonth = "";
  days.forEach((d, i) => {
    const m = d.slice(0, 7);
    if (m === prevMonth) return;
    prevMonth = m;
    const px = x(i);
    parts.push(`<line x1="${px}" y1="${T}" x2="${px}" y2="${T + ih}" class="vline"/>`);
    parts.push(`<text x="${px}" y="${T + ih + 18}" class="lab" text-anchor="middle">${Number(d.slice(5, 7))}</text>`);
  });

  // きりのいい価格に横線
  for (let v = sc.bottom; v <= sc.top + sc.step / 2; v += sc.step) {
    const py = y(v);
    parts.push(`<line x1="${L}" y1="${py}" x2="${L + iw}" y2="${py}" class="hline"/>`);
    parts.push(`<text x="${L - 8}" y="${py + 5}" class="lab" text-anchor="end">${fmtAxis(v, sc.step)}</text>`);
  }

  parts.push(`<rect x="${L}" y="${T}" width="${iw}" height="${ih}" class="axis"/>`);

  // 移動平均。抜けている日はつながずに切る
  shown.forEach((m) => {
    let d = "", pen = false;
    days.forEach((day, i) => {
      const v = m.line.get(day);
      if (v === undefined) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    if (d) parts.push(`<path d="${d}" class="ma" stroke-dasharray="${m.dash}"/>`);
  });

  if (bars) {
    // ローソク足。ヒゲは細線、実体は箱。陽線は枠だけ、陰線は塗りつぶし
    const cw = Math.max(1, Math.min(11, (iw / days.length) * 0.7));
    days.forEach((d, i) => {
      const b = bars.get(d);
      if (!b) return;
      const o = Number(b.open), h = Number(b.high), l = Number(b.low), c = Number(b.close);
      const px = x(i);
      parts.push(`<line x1="${px.toFixed(1)}" y1="${y(h).toFixed(1)}" x2="${px.toFixed(1)}" y2="${y(l).toFixed(1)}" class="cs"/>`);
      const top = y(Math.max(o, c));
      const hgt = Math.max(1, Math.abs(y(o) - y(c)));
      const cls = c < o ? "cs dn" : "cs";      // 下げた日は塗る
      parts.push(`<rect x="${(px - cw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${cw.toFixed(1)}" height="${hgt.toFixed(1)}" class="${cls}"/>`);
    });
  } else {
    const dpath = days
      .map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(Number(map.get(d))).toFixed(1)}`)
      .join("");
    parts.push(`<path d="${dpath}" class="plot"/>`);
  }

  const boxes = MA_LINES.map((m) =>
    `<label><input type="checkbox" data-ma="${m.n}"${settings.ma[m.n] ? " checked" : ""}><span class="bx"></span>${m.n}MA</label>`
  ).join("");

  const boxW = W + 8 * 2 + 2 * 2;      // padding と枠線のぶん
  chartEl.innerHTML = `
    <div class="box" style="width:${boxW}px">
      <div class="head">
        <div class="left"><span class="name">${title}</span><span class="ma-pick">${boxes}</span></div>
        <div class="sub">${days[0]} 〜 ${days[days.length - 1]}　${days.length}日</div>
      </div>
      <svg width="${W}" height="${H}">${parts.join("")}</svg>
    </div>`;

  chartEl.querySelectorAll("input[data-ma]").forEach((box) => {
    box.addEventListener("change", () => {
      settings.ma[box.dataset.ma] = box.checked;
      saveSettings();
      drawChart();
    });
  });
}

/* 表に出ている i 番目の銘柄でチャートを開く。
   左右の矢印で隣へ移るときも、年を変えたときもここを通る */
async function openChartAt(i) {
  const keys = curColumns();
  if (!keys.length) { closeChart(); return; }
  const at = ((i % keys.length) + keys.length) % keys.length;   // 端で回る
  const key = keys[at];
  const year = String(settings.year);

  const catalog = await buildCatalog(year);
  const bars = settings.sheetMode === "ohlc" ? await barsOf(key, year) : null;
  const map = bars
    ? new Map([...bars].map(([d, v]) => [d, v.close]))
    : await seriesOf(key, year);

  if (!map.size) { closeChart(); return; }   // その年に値が無ければ閉じる
  await openChart(labelOf(key, catalog), key, map, bars, at);
}

// 年の一覧は新しい順。dir が +1 で新しい年、-1 で古い年
function stepYear(cur, dir) {
  const years = [...yearEl.options].map((o) => Number(o.value));
  const at = years.indexOf(Number(cur));
  if (at < 0) return cur;
  const next = years[at - dir];
  return next === undefined ? cur : next;
}

function closeChart() {
  chartEl.classList.add("hidden");
  chartEl.innerHTML = "";
}
// チャート以外を押したら消す
chartEl.addEventListener("click", (e) => {
  if (!e.target.closest(".box")) closeChart();
});

// ホイールで大きさを変える。縦横の比は 1 : 1.62 のまま
const ZOOM_MIN = 0.4, ZOOM_MAX = 4;
chartEl.addEventListener("wheel", (e) => {
  if (chartEl.classList.contains("hidden")) return;
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  settings.chartZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, settings.chartZoom * f));
  saveSettings();
  drawChart();
}, { passive: false });

/* ---------------------------------------------------------------
   チャート画面。相対と絶対をトグルで切り替える

   相対 … 年初を100として全銘柄を1枚に重ねる。折れ線はカラフル
   絶対 … 各銘柄をそのままの値で描き、同じ時系列を上から縦に並べる
--------------------------------------------------------------- */
const chartsEl = document.getElementById("charts");
const canvasEl = document.getElementById("ccanvas");
const picksEl = document.getElementById("cpicks");
const ctypeEl = document.getElementById("ctype");
const cyearEl = document.getElementById("cyear");
const cstatusEl = document.getElementById("cstatus");

/* 相対チャートの色。地の明るさで2組を使い分ける。
   同じ順で同じ系統の色にしてあるので、配色を変えても銘柄の色味は変わらない */
const SERIES_COLORS = [                      // 暗い地。明るく浮く色
  "#ff5555", "#55aaff", "#ffdd33", "#ff9933", "#cc66ff",
  "#33ffaa", "#ff66bb", "#88ff44", "#66ddff", "#ffffff"
];
const SERIES_COLORS_LIGHT = [                // 明るい地。濃く沈む色
  "#cc0000", "#0057c2", "#8a6d00", "#cc5500", "#7b2fbe",
  "#00795c", "#c2185b", "#4a7a00", "#00708f", "#222222"
];
// 地が明るい配色。ここでは濃いほうの色を使う
const LIGHT_THEMES = new Set(["light", "paper", "sakura"]);

function seriesColor(i) {
  const c = LIGHT_THEMES.has(settings.theme) ? SERIES_COLORS_LIGHT : SERIES_COLORS;
  return c[i % c.length];
}

function openCharts() {
  titleEl.classList.add("hidden");
  chartsEl.classList.remove("hidden");
  drawCharts();
}
function backFromCharts() {
  chartsEl.classList.add("hidden");
  titleEl.classList.remove("hidden");
}

for (let y = 2026; y >= 1999; y--) {
  const o = document.createElement("option");
  o.value = String(y);
  o.textContent = `${y}年`;
  cyearEl.appendChild(o);
}

document.getElementById("cback").addEventListener("click", backFromCharts);
document.getElementById("ctheme").addEventListener("click", nextTheme);
ctypeEl.addEventListener("click", () => {
  settings.chartType = settings.chartType === "rel" ? "abs" : "rel";
  saveSettings();
  drawCharts();
});
document.getElementById("cjoin").addEventListener("click", () => {
  settings.chartJoin = !settings.chartJoin;
  saveSettings();
  drawCharts();
});
cyearEl.addEventListener("change", () => {
  settings.chartYear = Number(cyearEl.value);
  saveSettings();
  drawCharts();
});

// 銘柄の選択欄を組み立てる
function drawPicks(catalog) {
  picksEl.innerHTML = "";
  settings.chartColumns.forEach((key, i) => {
    const one = document.createElement("div");
    one.className = "one";

    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = labelOf(key, catalog);
    if (settings.chartType === "rel") nm.style.color = seriesColor(i);

    const del = document.createElement("button");
    del.textContent = "×";
    del.title = "この銘柄を外す";
    del.addEventListener("click", () => {
      settings.chartColumns.splice(i, 1);
      saveSettings();
      drawCharts();
    });

    const sel = document.createElement("select");
    sel.title = "銘柄を変える";
    fillPicker(sel, catalog, key, true);
    sel.addEventListener("change", () => {
      if (sel.value === DEL_VALUE) settings.chartColumns.splice(i, 1);
      else settings.chartColumns[i] = sel.value;
      saveSettings();
      drawCharts();
    });

    one.append(nm, del, sel);
    picksEl.appendChild(one);
  });

  if (settings.chartColumns.length < MAX_SERIES) {
    const add = document.createElement("button");
    add.className = "add";
    add.textContent = "＋";
    add.title = "銘柄を足す";
    add.addEventListener("click", () => {
      const first = catalog.find((c) => !settings.chartColumns.includes(c.key));
      if (first) {
        settings.chartColumns.push(first.key);
        saveSettings();
        drawCharts();
      }
    });
    picksEl.appendChild(add);
  }
}

// 候補を分野ごとに区切って入れる。表の見出しと同じ作り
const DEL_VALUE = "__del__";

function fillPicker(sel, catalog, key, withDelete) {
  if (withDelete) {
    // 指で押すと × に当てにくいので、候補の筆頭にも削除を置く
    const del = document.createElement("option");
    del.value = DEL_VALUE;
    del.textContent = "× 削除";
    sel.appendChild(del);
  }
  if (!catalog.some((c) => c.key === key)) {
    const keep = document.createElement("option");
    keep.value = key;
    keep.textContent = labelOf(key, catalog);
    sel.appendChild(keep);
  }
  let box = null, cur = null;
  catalog.forEach((c) => {
    if (c.group !== cur) {
      cur = c.group;
      box = document.createElement("optgroup");
      box.label = cur;
      sel.appendChild(box);
    }
    const o = document.createElement("option");
    o.value = c.key;
    o.textContent = c.label;
    box.appendChild(o);
  });
  sel.value = key;
}

let cRendering = 0;
async function drawCharts() {
  const mine = ++cRendering;
  const year = String(settings.chartYear);
  cyearEl.value = year;
  ctypeEl.textContent = settings.chartType === "rel" ? "相対" : "絶対";
  document.getElementById("cjoin").textContent =
    settings.chartJoin ? "線補完あり" : "線補完なし";
  canvasEl.innerHTML = '<div id="loading">読み込み中…</div>';

  const catalog = await buildCatalog(year);
  const series = [];
  for (const key of settings.chartColumns) series.push(await seriesOf(key, year));
  if (mine !== cRendering) return;

  drawPicks(catalog);

  // 横軸は全銘柄をそろえる。どれかに値がある日を並べる
  const dates = new Set();
  series.forEach((m) => m.forEach((_, d) => dates.add(d)));
  const days = [...dates].sort();

  if (!days.length) {
    canvasEl.innerHTML = '<div id="loading">この年のデータがない</div>';
    cstatusEl.textContent = "";
    return;
  }

  canvasEl.innerHTML = "";
  if (settings.chartType === "rel") drawRelative(days, series, catalog);
  else drawAbsolute(days, series, catalog);

  cstatusEl.textContent =
    `${days[0]} 〜 ${days[days.length - 1]}　${days.length}日 × ${settings.chartColumns.length}銘柄`;
}

/* 価格の数字を置く左の幅。ここは固定する。
   銘柄によって桁が違っても描画枠の大きさを変えないため、
   5桁までは普段の大きさで書き、それより多い桁は字を縮めて収める。 */
const AXIS_CHARS = 5;
const AXIS_FS = 14;                                  // .lab と同じ大きさ
const AXIS_CW = AXIS_FS * 0.6;                       // 1文字ぶんの幅
const AXIS_L = Math.ceil(AXIS_CHARS * AXIS_CW) + 10;

// 価格の横線と、その左の数字。数字は AXIS_L の幅に収める
function priceLines(sc, y, iw) {
  const labs = [];
  for (let v = sc.bottom; v <= sc.top + sc.step / 2; v += sc.step) labs.push([v, fmtAxis(v, sc.step)]);
  const widest = Math.max(...labs.map(([, s]) => s.length));
  const fs = widest > AXIS_CHARS
    ? Math.floor((AXIS_FS * AXIS_CHARS / widest) * 10) / 10
    : AXIS_FS;

  const out = [];
  labs.forEach(([v, s]) => {
    const py = y(v);
    out.push(`<line x1="${AXIS_L}" y1="${py}" x2="${AXIS_L + iw}" y2="${py}" class="hline"/>`);
    out.push(`<text x="${AXIS_L - 8}" y="${(py + fs * 0.36).toFixed(1)}" class="lab"`
      + ` font-size="${fs}" text-anchor="end">${s}</text>`);
  });
  return out;
}

// 等幅なので文字数で幅が出る。全角は2文字ぶん
function textW(s, fs) {
  let n = 0;
  for (const ch of s) n += ch.charCodeAt(0) < 256 ? 1 : 2;
  return n * fs * 0.6;
}

/* 右横の名札。折れ線の終わりの高さに置くが、近すぎると重なるので
   上から順に押し下げる。下にはみ出したら全体を上へ寄せる */
function stackTags(tags, y, T, ih) {
  const H = AXIS_FS + 3;
  const out = tags.map((t) => ({ ...t, ly: y(t.v) })).sort((a, b) => a.ly - b.ly);
  let prev = -1e9;
  out.forEach((t) => { t.ly = Math.max(t.ly, prev + H); prev = t.ly; });
  const over = out.length ? out[out.length - 1].ly - (T + ih) : 0;
  if (over > 0) out.forEach((t) => { t.ly = Math.max(T + AXIS_FS, t.ly - over); });
  return out;
}

/* 描く場所の大きさ。描画部分が 1 : 1.62。
   縦は画面の縦幅の 2/3 までに抑える。横はそれに合わせて決まる */
function boxSize(rows, rightPad) {
  const RATIO = 1.62;
  const T = 8, B = 24, R = rightPad === undefined ? 6 : rightPad;
  const avail = canvasEl.clientHeight - 20;
  let ih = rows > 1 ? Math.round(avail / 2) - T - B : avail - T - B;

  // 画面の縦幅の 2/3。枠の上下の余白もその中に入れる
  const cap = Math.round(window.innerHeight * 2 / 3) - T - B;
  ih = Math.min(Math.max(150, ih), cap);

  let iw = Math.round(ih * RATIO);
  const maxIW = canvasEl.clientWidth - 34 - AXIS_L - R;
  if (iw > maxIW) { iw = maxIW; ih = Math.round(iw / RATIO); }
  return { iw, ih, T, B, R, RATIO };
}

// 月ごとの縦線と、下の月の数字
function monthLines(days, x, T, ih) {
  const out = [];
  let prev = "";
  days.forEach((d, i) => {
    const m = d.slice(0, 7);
    if (m === prev) return;
    prev = m;
    const px = x(i);
    out.push(`<line x1="${px}" y1="${T}" x2="${px}" y2="${T + ih}" class="vline"/>`);
    out.push(`<text x="${px}" y="${T + ih + 18}" class="lab" text-anchor="middle">${Number(d.slice(5, 7))}</text>`);
  });
  return out;
}

// 相対チャート。年初を100にして重ねる
function drawRelative(days, series, catalog) {
  const rel = series.map((m) => {
    const first = days.map((d) => m.get(d)).find((v) => v !== undefined);
    const out = new Map();
    if (first === undefined) return out;
    days.forEach((d) => {
      const v = m.get(d);
      if (v !== undefined) out.set(d, (Number(v) / Number(first)) * 100);
    });
    return out;
  });

  const vals = [];
  rel.forEach((m) => m.forEach((v) => vals.push(v)));
  if (!vals.length) return;
  const sc = scaleOf(Math.min(...vals), Math.max(...vals));

  // 折れ線の右横に出す銘柄名と最終値。線と同じ色で置く
  const tags = [];
  rel.forEach((m, i) => {
    let last = null;
    for (let j = days.length - 1; j >= 0; j--) {
      const v = m.get(days[j]);
      if (v !== undefined) { last = v; break; }
    }
    if (last === null) return;
    tags.push({
      i, v: last,
      text: `${labelOf(settings.chartColumns[i], catalog)}　${last.toFixed(1)}`
    });
  });

  // 名前のぶんだけ右に余白を取る。取りすぎるとチャートが痩せるので頭を打つ
  const pad = tags.length
    ? Math.min(Math.max(...tags.map((t) => textW(t.text, AXIS_FS))) + 14,
               Math.max(120, canvasEl.clientWidth * 0.34))
    : 6;
  const { iw, ih, T, B, R } = boxSize(1, pad);
  const W = iw + AXIS_L + R, H = ih + T + B;

  const x = (i) => AXIS_L + (days.length === 1 ? iw / 2 : (iw * i) / (days.length - 1));
  const y = (v) => T + ih - (ih * (v - sc.bottom)) / (sc.top - sc.bottom);

  const parts = monthLines(days, x, T, ih).concat(priceLines(sc, y, iw));
  parts.push(`<rect x="${AXIS_L}" y="${T}" width="${iw}" height="${ih}" class="axis"/>`);

  rel.forEach((m, i) => {
    let d = "", pen = false;
    days.forEach((day, j) => {
      const v = m.get(day);
      // 休みの日は値が無い。線補完ありなら切らずにそのまま次の点へつなぐ
      if (v === undefined) { if (!settings.chartJoin) pen = false; return; }
      d += `${pen ? "L" : "M"}${x(j).toFixed(1)},${y(v).toFixed(1)}`;
      pen = true;
    });
    if (d) {
      const c = seriesColor(i);
      parts.push(`<path d="${d}" class="plot rel" stroke="${c}"/>`);
    }
  });

  stackTags(tags, y, T, ih).forEach((t) => {
    const c = seriesColor(t.i);
    // fill は style で書く。class の .lab が fill を持っていて、属性では負ける
    parts.push(`<text x="${AXIS_L + iw + 8}" y="${t.ly.toFixed(1)}" class="lab"`
      + ` style="fill:${c}">${t.text}</text>`);
  });

  const box = document.createElement("div");
  box.className = "one-chart";
  box.innerHTML = `<div class="cap">年初を100とした動き</div><svg width="${W}" height="${H}">${parts.join("")}</svg>`;
  canvasEl.appendChild(box);
}

// 絶対チャート。そのままの値で、同じ時系列を上から縦に並べる
function drawAbsolute(days, series, catalog) {
  const { iw, ih, T, B, R } = boxSize(2);

  settings.chartColumns.forEach((key, i) => {
    const m = series[i];
    const vals = days.map((d) => m.get(d)).filter((v) => v !== undefined).map(Number);
    const box = document.createElement("div");
    box.className = "one-chart";

    if (!vals.length) {
      box.innerHTML = `<div class="cap">${labelOf(key, catalog)}　この年のデータがない</div>`;
      canvasEl.appendChild(box);
      return;
    }

    const sc = scaleOf(Math.min(...vals), Math.max(...vals));
    const W = iw + AXIS_L + R, H = ih + T + B;

    const x = (j) => AXIS_L + (days.length === 1 ? iw / 2 : (iw * j) / (days.length - 1));
    const y = (v) => T + ih - (ih * (v - sc.bottom)) / (sc.top - sc.bottom);

    const parts = monthLines(days, x, T, ih).concat(priceLines(sc, y, iw));
    parts.push(`<rect x="${AXIS_L}" y="${T}" width="${iw}" height="${ih}" class="axis"/>`);

    let d = "", pen = false;
    days.forEach((day, j) => {
      const v = m.get(day);
      if (v === undefined) { if (!settings.chartJoin) pen = false; return; }
      d += `${pen ? "L" : "M"}${x(j).toFixed(1)},${y(Number(v)).toFixed(1)}`;
      pen = true;
    });
    parts.push(`<path d="${d}" class="plot" stroke="var(--fg)"/>`);

    box.innerHTML = `<div class="cap">${labelOf(key, catalog)}</div><svg width="${W}" height="${H}">${parts.join("")}</svg>`;
    canvasEl.appendChild(box);
  });
}

      const th = document.createElement("th");
      const wrap = document.createElement("div");
      wrap.className = "colhead";

      const sel = document.createElement("select");
      sel.className = "picker";
      sel.title = "銘柄を変える";
      {

        const kill = document.createElement("option");
        kill.value = DEL_VALUE;
        kill.textContent = "× 削除";
        sel.appendChild(kill);

        const keep = document.createElement("option");
        keep.value = key;
        keep.textContent = name;
        sel.appendChild(keep);
      }
      // 分野ごとに見出しを付けて区切る
      let box = null, cur = null;
      catalog.forEach((c) => {
        if (c.group !== cur) {
          cur = c.group;
          box = document.createElement("optgroup");
          box.label = cur;
          sel.appendChild(box);
        }
        const o = document.createElement("option");
        o.value = c.key;
        o.textContent = c.label;
        box.appendChild(o);
      });
      sel.value = key;
      sel.addEventListener("change", () => {
        if (sel.value === DEL_VALUE) curColumns().splice(i, 1);
        else curColumns()[i] = sel.value;
        saveSettings();
        render();
      });

      const del = document.createElement("button");
      del.textContent = "×";
      del.title = "この列を消す";
      del.addEventListener("click", () => {
        curColumns().splice(i, 1);
        saveSettings();
        render();
      });

      const arrow = document.createElement("button");
      arrow.textContent = "▼";
      arrow.title = "銘柄を変える";

      // ▼ と選択を重ねる。▼を押すと候補が開く
      const pick = document.createElement("div");
      pick.className = "pickwrap";
      pick.append(arrow, sel);

      const ops = document.createElement("div");
      ops.className = "ops" + (j ? " blank" : "");   // 出すのは左端の1列だけ
      ops.append(del, pick);        // 名前の下に横並びで置く

      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = name;
      nameEl.title = "押すとチャート";
      // 名前を押すと、いま画面に出ている分のチャートを出す
      nameEl.addEventListener("click", () => openChartAt(i));

      wrap.appendChild(nameEl);
      if (fld) {
        const f = document.createElement("div");
        f.className = "field";
        f.textContent = fld.label;
        wrap.appendChild(f);
      }
      wrap.appendChild(ops);

      if (j === fields.length - 1) {
        th.appendChild(makeGrip(ohlc ? ohlcWidthKey(key) : key, groupCols[i]));
      }
      htr.appendChild(th);
    });
  });

  const addTh = document.createElement("th");
  const add = document.createElement("button");
  add.className = "addcol";
  add.textContent = "＋";

  add.addEventListener("click", () => {
    const first = catalog.find((c) => !curColumns().includes(c.key));
    if (!first) return;
    curColumns().push(first.key);
    saveSettings();
    render();
  });
  addTh.appendChild(add);
  htr.appendChild(addTh);
  thead.appendChild(htr);

  const tbody = document.createElement("tbody");
  for (const d of rows) {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = d;
    tr.appendChild(th);
    keys.forEach((key, i) => {

        if (v === undefined) { td.textContent = "#N/A"; td.className = "na"; }
        else td.textContent = fmt(v);
        tr.appendChild(td);
      });
    });
    tr.appendChild(document.createElement("td"));
    tbody.appendChild(tr);
  }

  table.append(thead, tbody);
  gridEl.innerHTML = "";
  gridEl.appendChild(table);
  statusEl.textContent = `${rows.length}日 × ${keys.length}銘柄`;
}

/* ---------------------------------------------------------------
   相関分析。ここを開いたときだけ全年度を読み、計算結果を再利用する。
--------------------------------------------------------------- */
const corrEl = document.getElementById("correlations");
const corrMainEl = document.getElementById("rmain");
const corrPicksEl = document.getElementById("rpicks");
const corrStatusEl = document.getElementById("rstatus");
const CORR_PERIODS = [20, 60, 120];
const CORR_YEARS = Array.from({ length: 2026 - 1999 + 1 }, (_, i) => 1999 + i);
const CORR_CALENDAR = { JP: "yahoo:^N225", KR: "yahoo:^KS11" };
const CORR_BLOCK_ORDER = ["matrix", "pairs", "pairChart", "concentration", "centrality", "concentrationChart", "securitiesChart"];
const corrPriceCache = new Map();
const corrChangeCache = new Map();
const corrPairCache = new Map();
let corrCatalog = null;
let corrState = null;
let corrStateSignature = "";
let corrRendering = 0;
let corrSelectedPair = null;
let corrSort = { key: "r20", dir: -1 };

function corrMeta(key, catalog) {
  const [src, id] = splitKey(key);
  const hit = catalog.find((c) => c.key === key) || {};
  let market = "OTHER", calcType = "return";
  if (["jpx", "nikkei", "yomiuri", "ratio"].includes(src)) market = "JP";
  if (src === "rates") {
    calcType = "diff";
    if (/^(米|アメリカ)/.test(id)) market = "US";
    else if (id.startsWith("日本")) market = "JP";
    else if (id.startsWith("韓国")) market = "KR";
  }
  if (src === "yahoo") {
    if (id === "^N225" || id.endsWith(".T")) market = "JP";
    else if (id === "^KS11" || id.endsWith(".KS") || id.endsWith(".KQ")) market = "KR";
    else if (US_INDEX.has(id) || ["セクター", "REIT", "ボラティリティ"].includes(hit.category)
      || (hit.category === "個別株" && !id.includes("."))) market = "US";
  }
  return { key, label: labelOf(key, catalog), market, calcType };
}

function appendSelectedYahoo(text, idToKey, maps) {
  const lines = text.split("\n").filter((x) => x.length);
  if (lines.length < 2) return;
  const head = splitLine(lines[0]);
  const di = head.indexOf("trade_date"), si = head.indexOf("symbol"), vi = head.indexOf("close");
  if (di < 0 || si < 0 || vi < 0) return;
  for (let i = 1; i < lines.length; i++) {
    const c = splitLine(lines[i]);
    const key = idToKey.get(c[si]);
    if (!key) continue;
    const v = CorrelationEngine.finiteNumber(c[vi]);
    if (v !== null && c[di]) maps.get(key).set(c[di].slice(0, 10), v);
  }
}

async function loadCorrelationPrices(keys, progress) {
  const wanted = [...new Set(keys)];
  const missing = wanted.filter((key) => !corrPriceCache.has(key));
  if (missing.length) {
    const maps = new Map(missing.map((key) => [key, new Map()]));
    const yahoo = new Map();
    missing.forEach((key) => {
      const [src, id] = splitKey(key);
      if (src === "yahoo") yahoo.set(id, key);
    });
    if (yahoo.size) {
      for (let i = 0; i < CORR_YEARS.length; i++) {
        const year = CORR_YEARS[i];
        if (progress) progress(`全期間データ ${i + 1}/${CORR_YEARS.length}（${year}年）`);
        try {
          const r = await fetch(`data/overseas_${year}.csv`);
          if (r.ok) appendSelectedYahoo(await r.text(), yahoo, maps);
        } catch (_) { /* 無い年は欠損のままにする */ }
      }
    }

    const staticFiles = {
      jpx: ["data/jpx_index.csv", "name", "close"],
      nikkei: ["data/nikkei_ohlc.csv", "name", "close"],
      yomiuri: ["data/yomiuri333.csv", "name", "close"],
      ratio: ["data/ratios.csv", "name", "close"],
      rates: ["data/rates.csv", "name", "value"]
    };
    for (const [src, spec] of Object.entries(staticFiles)) {
      const targets = new Map(missing.filter((key) => splitKey(key)[0] === src)
        .map((key) => [splitKey(key)[1], key]));
      if (!targets.size) continue;
      for (const r of await fetchCsv(spec[0])) {
        const key = targets.get(r[spec[1]]);
        const v = CorrelationEngine.finiteNumber(r[spec[2]]);
        if (key && v !== null && r.trade_date) maps.get(key).set(r.trade_date.slice(0, 10), v);
      }
    }
    maps.forEach((map, key) => corrPriceCache.set(key, map));
  }
  return new Map(wanted.map((key) => [key, corrPriceCache.get(key) || new Map()]));
}

function corrPairKey(a, b) {
  return a < b ? `${a}\n${b}` : `${b}\n${a}`;
}

function correlationChanges(key, prices, meta) {
  if (!corrChangeCache.has(key)) {
    corrChangeCache.set(key, CorrelationEngine.priceChanges(prices, meta.calcType));
  }
  return corrChangeCache.get(key);
}

async function calculateCorrelations(keys, catalog, progress) {
  const allKeys = [...new Set([...keys, CORR_CALENDAR.JP, CORR_CALENDAR.KR])];
  const prices = await loadCorrelationPrices(allKeys, progress);
  const metas = new Map(allKeys.map((key) => [key, corrMeta(key, catalog)]));
  const changes = new Map(allKeys.map((key) => [key,
    correlationChanges(key, prices.get(key), metas.get(key))]));
  const calendars = {
    JP: [...prices.get(CORR_CALENDAR.JP).keys()].sort(),
    KR: [...prices.get(CORR_CALENDAR.KR).keys()].sort()
  };
  const pairs = [];
  for (let i = 0; i < keys.length; i++) {
    for (let j = i + 1; j < keys.length; j++) {
      const a = keys[i], b = keys[j], cacheKey = corrPairKey(a, b);
      let analysis = corrPairCache.get(cacheKey);
      if (!analysis) {
        const first = a < b ? a : b, second = a < b ? b : a;
        analysis = CorrelationEngine.analysePair(
          changes.get(first), changes.get(second), metas.get(first), metas.get(second),
          calendars, CORR_PERIODS
        );
        corrPairCache.set(cacheKey, analysis);
      }
      pairs.push({ a, b, key: cacheKey, analysis });
    }
  }

  const centrality = keys.map((key) => {
    const values = {};
    CORR_PERIODS.forEach((period) => {
      const usable = pairs.filter((p) => p.a === key || p.b === key)
        .map((p) => p.analysis.current[period]).filter((v) => v !== null);
      values[period] = {
        v: usable.length ? usable.reduce((a, b) => a + b, 0) / usable.length : null,
        used: usable.length, total: Math.max(0, keys.length - 1)
      };
    });
    return { key, values };
  });
  const concentration = {};
  CORR_PERIODS.forEach((period) => {
    const usable = pairs.map((p) => p.analysis.current[period]).filter((v) => v !== null);
    concentration[period] = {
      v: usable.length ? usable.reduce((a, b) => a + b, 0) / usable.length : null,
      used: usable.length, total: pairs.length
    };
  });
  if (progress) progress("相関集中度の長期推移を計算中…");
  const concentrationTimeline = CorrelationEngine.concentrationTimeline(
    pairs.map((p) => p.analysis), CORR_PERIODS, 14
  );
  return { keys, catalog, metas, prices, pairs, centrality, concentration, concentrationTimeline };
}

function fmtCorr(v, signed) {
  if (v === null || v === undefined || !Number.isFinite(v)) return "N/A";
  return `${signed && v > 0 ? "+" : ""}${v.toFixed(3)}`;
}

const CORR_INFO = {
  matrix: {

const corrInfoModal = document.getElementById("corr-info-modal");
const corrInfoTitle = document.getElementById("corr-info-title");
const corrInfoContent = document.getElementById("corr-info-content");

function openCorrInfo(key) {

  [...info.sections, ...(key === "securitiesChart" ? [] : CORR_COMMON_INFO)].forEach((section) => {

    corrInfoContent.append(h, p);

      const f = document.createElement("p"); f.className = "formula"; f.textContent = section.formula;
      corrInfoContent.appendChild(f);
    }
  });
  corrInfoModal.classList.remove("hidden");
