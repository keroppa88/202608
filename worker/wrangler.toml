name = "soba-ai"
main = "index.js"
compatibility_date = "2026-08-01"

[vars]
# 使うモデル。変えたければここを直す
GEMINI_MODEL = "gemini-3.1-pro-preview"
# 受け付ける送り元。カンマ区切り。空にすると送り元を見ない
ALLOWED_ORIGINS = "https://keroppa88.github.io"
# 個別株の取り寄せを頼む先。owner/repo
GH_REPO = "keroppa88/202608"

# プロンプトの文面は tech_prompt.txt に置き、そのまま文字列として包む。
# ページの「テキスト出力」も同じファイルを読むので、文面は1つしかない
rules = [
  { type = "Text", globs = ["**/*.txt"] }
]
