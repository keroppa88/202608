name = "soba-ai"
main = "index.js"
compatibility_date = "2026-08-19"
preview_urls = false

[observability]
enabled = true

[vars]
# 使うモデル。変えたければここを直す
GEMINI_MODEL = "gemini-3.1-pro-preview"
JEV_MODEL = "jev-1.13.0"
# 受け付ける送り元。カンマ区切り。空にすると送り元を見ない
ALLOWED_ORIGINS = "https://keroppa88.github.io"
# 個別株の取り寄せを頼む先。owner/repo
GH_REPO = "keroppa88/202608"

# 稼働確認後、GitHubのCLOUDFLARE_SCHEDULEと合わせてtrueへ切替
SCHEDULE_ENABLED = "false"

[triggers]
crons = ["*/10 * * * *"]
