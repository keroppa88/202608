name: 松井証券・投資指標取得

# 数値は素のHTMLに入っておらず、Rtoaster が後から流し込む。
# ブラウザで開き、表が埋まるまで待つ必要がある。
#
# ログインなしで見えるのは前営業日更新分なので、朝の枠で取る。
# JST 07:00 = UTC 22:00（前日）。曜日の指定が1日ずれる。
on:
  schedule:
    - cron: "0 22 * * 1-5" # UTC 月〜金 22:00 = JST 火〜土 07:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ブラウザを用意
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: 取得
        run: python3 src/fetch_matsui.py

      - name: コミット
        if: always()
        run: bash .github/scripts/commit.sh "松井証券 投資指標 $(date -u +%Y-%m-%d)"
