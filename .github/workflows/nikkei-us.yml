name: 日経・米国株記事取得

# 日本時間の朝に、前日（米国時間）の大引け記事を取得する。
#
# 米国市場の大引け記事は翌朝 JST 5時台に初出、5時台〜7時の間に最終版になる（SPEC §4B）。
#
# JST 07:00 = UTC 22:00（前日）。曜日が1日戻るため、
# 「JST 火〜土」は UTC では「月〜金」になる。
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取得
        run: python3 src/fetch_nikkei_us.py

      - name: コミット
        if: always()
        run: bash .github/scripts/commit.sh "米国株大引け $(date -u +%Y-%m-%d)"
