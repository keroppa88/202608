name: 個別株のコピー（chart0）

# chart0 で集めている個別株と財務CSVをこちらへ写し、
# 最新財務値と最新終値から時価総額も更新する。
#
# chart0 の更新は JST 16:40（あちらの daily_update.yml）。終わってから写したいので
# JST 18:30 に回す。JST 18:30 = UTC 09:30（同日）。曜日はずれない。
#
# chart0 側には何も要らない。こちらから読みに行くだけで、あちらのファイルにも
# 設定にも触らない。public なので鍵も要らない。
#
# 株価・財務とも4文字の個別株コードだけを対象にする。
on:
  schedule:
    - cron: "30 9 * * 1-5" # UTC 月〜金 09:30 = JST 月〜金 18:30
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/calc_stock_sectors.py"
      - "src/build_sector_groups.py"
      - "src/build_market_caps.py"
      - "src/copy_stocks.py"
      - "src/copy_finance.py"
      - "data/stock-sectors-detail.csv"
      - ".github/workflows/stocks-copy.yml"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: chart0 を取る
        uses: actions/checkout@v4
        with:
          repository: keroppa88/chart0
          path: chart0

      - name: 株価CSVを写す
        run: python3 src/copy_stocks.py chart0

      - name: 財務CSVを写す
        run: python3 src/copy_finance.py chart0

      - name: 集計用の分類を生成
        run: python3 src/build_sector_groups.py

      - name: 最新時価総額を計算
        run: python3 src/build_market_caps.py

      - name: セクター騰落率を計算
        run: python3 src/calc_stock_sectors.py

      - name: コミット
        if: always()
        run: bash .github/scripts/commit.sh "個別株・財務のコピー（chart0） $(date -u +%Y-%m-%d)"
