name: 相場データ取得

# 全市場の「直近の確定した足」を1日1回まとめて取る。
# JST 朝の時点では、米国・欧州・アジアいずれも前営業日の引けが確定している。
#
# JST 08:30 = UTC 23:30（前日）。曜日が1日戻るため、
# 「JST 火〜土」は UTC では「月〜金」になる。
# 米国株記事（08:00 JST）と 30分ずらして同時起動を避けている。
on:
  schedule:
    - cron: "30 23 * * 1-5" # UTC 月〜金 23:30 = JST 火〜土 08:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取得
        run: python3 src/fetch_market.py

      - name: コミット
        if: always()
        run: bash .github/scripts/commit.sh "相場データ $(date -u +%Y-%m-%d)"
