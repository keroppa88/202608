name: ページ確認（開発用）

# 新しい取得先を検討するときに、そのページの表示テキストを見るためのもの。
# ブラウザで開いて画面の文字を丸ごと取る（全コピペ）。
# 定期実行はしない。何も書き込まない。
on:
  workflow_dispatch:
    inputs:
      url:
        description: "見たいページのURL（空白区切りで複数可）。既定はCNBCのセクター一覧"
        required: false
        type: string
        default: "https://www.cnbc.com/markets/sectors/"
      wait:
        description: "この語が画面に出るまで待つ（値が後から流し込まれるページ用）"
        required: false
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ブラウザを用意
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: 表示テキストを見る
        env:
          URL: ${{ inputs.url }}
          WAIT: ${{ inputs.wait }}
        run: |
          # URLに ? や * が入るのでグロブを切る。空白での分割だけを使う
          set -f
          args=()
          [ -n "$WAIT" ] && args+=(--wait "$WAIT")   # 待つ語には空白が入りうる
          python3 src/probe_page.py $URL "${args[@]}"
