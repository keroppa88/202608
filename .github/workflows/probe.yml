name: ページ確認（開発用）

# 新しい取得先を検討するときに、そのページの表示テキストを見るためのもの。
# ブラウザで開いて画面の文字を丸ごと取る（全コピペ）。
# 定期実行はしない。何も書き込まない。
on:
  workflow_dispatch:
    inputs:
      url:
        description: "見たいページのURL（空白区切りで複数可）"
        required: false
        type: string
        default: "https://www.rakuten-sec.co.jp/web/market/data/list.html https://jp.investing.com/rates-bonds/china-10-year-bond-yield https://jp.investing.com/rates-bonds/south-korea-10-year-bond-yield"
      settle:
        description: "描画を待つ秒数（既定15秒）"
        required: false
        type: string
        default: "15"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ブラウザを用意
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: 表示テキストを見る
        env:
          URL: ${{ inputs.url }}
          SETTLE: ${{ inputs.settle }}
        run: |
          # URLに ? や * が入るのでグロブを切る。空白での分割だけを使う
          set -f
          python3 src/probe_page.py $URL --settle "${SETTLE:-15}"
