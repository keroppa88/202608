name: 取得の確認（開発用）

# ブラウザ取得へ切り替えた分が、これまでと同じ結果になるか確かめる。
# 何もコミットしない。定期実行もしない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ブラウザを用意
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: 日経・国内株式指標
        if: always()
        run: python3 src/fetch_nikkei_kabu.py

      - name: 日経・日本株ランキング
        if: always()
        run: python3 src/fetch_nikkei_rank.py

      - name: 日経・東証大引け記事
        if: always()
        run: python3 src/fetch_nikkei_jp.py

      - name: 日経・米国株記事
        if: always()
        run: python3 src/fetch_nikkei_us.py

      - name: セクター指数（CNBC）
        if: always()
        run: python3 src/fetch_cnbc_sectors.py

      - name: Fear & Greed（CNN）
        if: always()
        run: python3 src/fetch_fear_greed.py

      - name: 書き込まれた中身
        if: always()
        run: |
          git status --short
          git --no-pager diff --stat

      # 失敗したときに中身を見るため。抽出が直ったら消す
      - name: ランキングの生テキスト（表の周辺）
        if: always()
        run: |
          python3 - <<'EOF'
          import glob
          for path in sorted(glob.glob("data/raw/*/nikkei_rank_*.txt")):
              lines = open(path, encoding="utf-8").read().split("\n")
              i = next((k for k, l in enumerate(lines) if "更新" in l), 0)
              print(f"\n===== {path}  （{len(lines)}行、{i}行目に「更新」）=====")
              for k, l in enumerate(lines[i:i + 60], i):
                  print(f"{k:5}: {l.replace(chr(9), ' ⇥ ')}")
          EOF
